<!doctype html>
<html lang="en" data-theme="eclipse">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalshi</title>
<meta name="description" content="The Kalshi bot: balance, P&L, equity, open bets, strategies and recent trades, from the numbers its server sends.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../jarvis/icon-192.png?v=j1">
<!-- Kalshi page (owner 2026-11-01): the Kalshi bot runs on its own server; its numbers arrive as kalshi.json
     (engine/kalshi_publish.py, docs/KALSHI_PUBLISH.md) and this page shows them, inside Jarvis or on its own. Read-only.
     Look: kalshi.css (the old Jarvis HUD); logic: kalshi.js. Bump ?v= on both when either changes. -->
<script>(function () { var t = 'eclipse'; try { t = String(localStorage.getItem('jtheme') || 'eclipse').replace(/"/g, ''); } catch (e) { t = 'eclipse'; }
  document.documentElement.setAttribute('data-theme', t.indexOf('reactor') === 0 ? 'reactor' : 'eclipse'); })();</script>
<link rel="stylesheet" href="kalshi.css?v=k5">
</head>
<body>
<main>
  <header class="top">
    <div class="top-t">
      <h1>Kalshi</h1>
      <p class="sub" id="sub" aria-live="polite">Loading…</p>
    </div>
    <button type="button" class="refresh" id="refresh" aria-busy="false" title="Refresh">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Refresh</span>
    </button>
  </header>
  <div id="body" aria-busy="true" data-state="loading"><div class="sk sk1" aria-hidden="true"></div><div class="sk sk2" aria-hidden="true"></div><div class="sk sk3" aria-hidden="true"></div></div>
  <p class="foot" id="foot"></p>
</main>
<script src="kalshi.js?v=k5"></script>
</body>
</html>
