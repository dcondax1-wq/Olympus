<!-- Kalshi page (owner 2026-11-01): the Kalshi bot runs on its own server; its numbers arrive as kalshi.json
     (engine/kalshi_publish.py, docs/KALSHI_PUBLISH.md) and this page shows them, inside Jarvis or on its own. Read-only.
     AGORA look (owner 2026-11-09, docs/DESIGN_AGORA.md): marble, bronze, gold; olive gains, terracotta losses; serif headings; no neon, no
     HUD, no ticker, no 3D orb. Four groups (Today -> Edge -> Performance -> Alerts) with a section bar; the balance first. Look: kalshi.css
     (the AGORA layer is at its end); logic: kalshi.js; kfx.js = counters, sparklines, OLYMPUS themes via applyTheme; offline: sw.js.
     Bump ?v= on both when either changes, and in sw.js its SHELL and CACHE ('kalshi-' + the version). -->
<script>(function () { var d = document.documentElement; d.setAttribute('data-theme', 'kalshi');
  /* inside Jarvis (a frame under its bar) the notch is Jarvis's: no second top inset */
  try { if (window.top !== window) d.classList.add('framed'); } catch (e) { d.classList.add('framed'); } })();</script>
<link rel="stylesheet" href="kalshi.css?v=k23">
<!-- OLYMPUS theme (../olympus/themes.js, key 'olympus.theme', picked in Jarvis's Look sheet): the shared --oly-* tokens and Kalshi's
     page / panels blended toward the theme (the mint stays Kalshi's own). Async, never waited on; the default changes nothing. -->
<script>(function () {
  var K = { '--bg': ['#14110e', 'bg'], '--bg2': ['#1d1914', 'bg2'] };
  function go() {
    var T = window.OLYMPUS_THEMES; if (!T) return;
    T.apply('stage', { meta: true, extra: function (t) {
      var o = { '--pr': T.rgb(T.mix('#1d1914', t.bg2, t.mix)).join(','), '--txt': t.text };
      for (var k in K) o[k] = T.mix(K[k][0], t[K[k][1]], t.mix);
      return o; } });
  }
  var s = document.createElement('script'); s.src = '../olympus/themes.js?v=o4'; s.async = true; s.onload = go; document.head.appendChild(s);
})();</script>
</head>
<body>
<main>
  <a class="olyback" href="../jarvis/" aria-label="Back to Olympus">&#8592; Olympus</a>
  <header class="top">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M7 9h26M10 13h20M13 13v18M18 13v18M22 13v18M27 13v18M10 31h20M7 35h26" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="top-t">
      <h1>Kalshi</h1>
      <p class="sub" id="sub" aria-live="polite">Loading…</p>
    </div>
    <button type="button" class="refresh" id="refresh" aria-busy="false" aria-label="Refresh" title="Refresh">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Refresh</span>
    </button>
  </header>
  <nav class="secnav" id="secnav" aria-label="Sections" hidden>
    <button type="button" data-go="today">Today</button><button type="button" data-go="edge">Edge</button><button type="button" data-go="perf">Performance</button><button type="button" data-go="alerts">Alerts <b></b></button>
  </nav>
  <div id="body" aria-busy="true" data-state="loading"><div class="sk sk1" aria-hidden="true"></div><div class="sk sk2" aria-hidden="true"></div><div class="sk sk3" aria-hidden="true"></div></div>
  <p class="foot" id="foot"></p>
</main>
<script src="kfx.js?v=k23"></script>
