<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FATES</title>
<meta name="description" content="FATES: a Monte Carlo of the bots' MFFU evals and money, drawn as threads of fate. Paper only.">
<meta name="theme-color" content="#07050f">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../jarvis/icon-192.png?v=j1">
<!-- FATES (2026-11-03): the Moirai spin the threads. Data: fates.json (python -X utf8 -m tools.fates.build), demo: fixture.json.
     Logic without WebGL: fates-core.js; the scene + HUD: fates.js; look: fates.css. Jarvis's orb owns the bottom-right 80 x 160 px. -->
<link rel="stylesheet" href="../olympus/olympus.css?v=o1">
<script src="../olympus/olympus.js?v=o1" data-app="fates"></script>
<link rel="stylesheet" href="fates.css?v=f2">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<main id="ui">
  <header class="top">
    <div class="brand">
      <h1>FATES</h1>
      <p class="sub" id="sub">the threads of your evals</p>
    </div>
    <div class="tags"><span id="demo" class="tag demo" hidden>DEMO</span><span id="lite" class="tag" hidden>LITE</span></div>
  </header>
  <nav class="row" aria-label="Scenario">
    <div class="seg" id="scen" role="tablist">
      <button type="button" role="tab" data-scen="zlarior">Zlarior</button>
      <button type="button" role="tab" data-scen="atlas">ATLAS</button>
      <button type="button" role="tab" data-scen="money">Money</button>
    </div>
    <div class="seg small" id="period" role="tablist" aria-label="Sample">
      <button type="button" role="tab" data-period="2026">2026</button>
      <button type="button" role="tab" data-period="2021-25">2021-25</button>
    </div>
  </nav>
  <nav class="row accts" id="acctsRow" aria-label="Accounts" hidden>
    <span class="lbl">Accounts</span>
    <div class="seg small" id="accts">
      <button type="button" data-n="1">1</button><button type="button" data-n="2">2</button><button type="button" data-n="3">3</button>
      <button type="button" data-n="4">4</button><button type="button" data-n="5">5</button><button type="button" data-n="6">6</button>
    </div>
  </nav>
  <p class="weak" id="weak" hidden>2021-25: the older market (LIT was tuned on 2026 only). A much weaker edge: read it as the bad-market case.</p>
  <section class="hud" id="hud" aria-live="polite">
    <div class="tile gold" data-id="pass"><span class="l"></span><b class="v"></b><span class="s"></span></div>
    <div class="tile red" data-id="fail"><span class="l"></span><b class="v"></b><span class="s"></span></div>
    <div class="tile" data-id="days"><span class="l"></span><b class="v"></b><span class="s"></span></div>
    <div class="tile wide" data-id="money"><span class="l"></span><b class="v"></b><span class="s"></span>
      <div class="span seg tiny" id="span"><button type="button" data-span="6m">6M</button><button type="button" data-span="12m">12M</button></div></div>
    <div class="tile" data-id="pay30"><span class="l"></span><b class="v"></b><span class="s"></span></div>
  </section>
  <p class="cap" id="cap"></p>
  <div class="bottom">
    <button type="button" class="spin" id="spin">Spin again</button>
    <p class="hint" id="hint">Tap a thread to follow it.<br><span class="k g">gold</span> pass · <span class="k r">red</span> fail · <span class="k v">violet</span> open</p>
  </div>
  <section class="follow" id="follow" hidden aria-live="polite">
    <header><b id="fTitle"></b><span id="fEnd"></span><button type="button" class="x" id="fClose" aria-label="Close">×</button></header>
    <ol id="fRows"></ol>
  </section>
  <p class="nogl" id="nogl" hidden>3D is off on this device: the numbers above are the full result.</p>
</main>
<script type="module" src="fates.js?v=f2"></script>
</body>
</html>
