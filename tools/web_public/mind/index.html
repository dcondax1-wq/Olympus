<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<meta name="color-scheme" content="dark">
<meta name="description" content="OLYMPUS Mind: your Obsidian vault and Jarvis's memory as a living 3D brain.">
<title>OLYMPUS Mind</title>
<link rel="icon" href="../jarvis/icon.svg">
<link rel="apple-touch-icon" href="../jarvis/apple-touch-icon.png">
<link rel="stylesheet" href="../olympus/olympus.css?v=o1">
<script src="../olympus/olympus.js?v=o1" data-app="mind"></script>
<link rel="stylesheet" href="mind.css">
<script type="module" src="main.js"></script>
</head>
<body>
<canvas id="gl" aria-label="Your notes as a 3D brain. Drag to turn, pinch to zoom, tap a note to open it."></canvas>
<div id="labels" aria-hidden="true"></div>

<header id="top">
  <div class="bar">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".45"/>
      <circle cx="16" cy="16" r="4.2" fill="currentColor"/>
      <circle cx="7.5" cy="10" r="2" fill="currentColor" opacity=".8"/><circle cx="25" cy="9" r="1.6" fill="currentColor" opacity=".7"/>
      <circle cx="23.5" cy="24" r="2.2" fill="currentColor" opacity=".8"/><circle cx="8.5" cy="23" r="1.4" fill="currentColor" opacity=".6"/>
      <path d="M16 16 7.5 10M16 16 25 9M16 16l7.5 8M16 16l-7.5 7" stroke="currentColor" stroke-width=".9" opacity=".55"/>
    </svg>
    <h1>OLYMPUS <b>MIND</b></h1>
    <span id="mode" class="mode" data-mode="loading"><i></i><span>Waking up</span></span>
    <button id="quality" class="ghost" type="button" aria-pressed="true" title="Quality">HD</button>
  </div>
  <div id="ticker" class="glass" role="status" aria-live="polite">
    <span class="spark-dot" aria-hidden="true"></span>
    <span class="tk-label">Jarvis learned</span>
    <span id="tk-text" class="tk-text">Listening…</span>
  </div>
  <form id="search" class="glass" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search your brain" aria-label="Search notes" enterkeyhint="search" spellcheck="false">
    <button id="timelapse" class="ghost" type="button" aria-pressed="false" title="Replay the vault growing">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 1-7.4 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Time-lapse</span>
    </button>
    <ul id="results" class="glass" role="listbox" aria-label="Matching notes" hidden></ul>
  </form>
  <p id="demo" class="demo" hidden><b>Demo</b> · Connect your vault in Jarvis ⋯ → Connect Obsidian</p>
</header>

<div id="tl" class="tl" hidden aria-live="polite"><span id="tl-date"></span><i><b id="tl-bar"></b></i><span id="tl-count"></span></div>

<aside id="card" class="card glass" hidden aria-labelledby="c-title">
  <button id="c-close" class="close" type="button" aria-label="Close">×</button>
  <p class="c-kind"><i id="c-dot"></i><span id="c-cluster"></span></p>
  <h2 id="c-title"></h2>
  <p id="c-path" class="c-path"></p>
  <div id="c-tags" class="c-tags"></div>
  <dl class="c-facts">
    <div><dt>Links</dt><dd id="c-links"></dd></div>
    <div><dt>Backlinks</dt><dd id="c-back"></dd></div>
    <div><dt>Words</dt><dd id="c-words"></dd></div>
    <div><dt>Edited</dt><dd id="c-edited"></dd></div>
  </dl>
  <p id="c-snippet" class="c-snippet"></p>
  <div id="c-learned" class="c-learned"></div>
  <div id="c-near" class="c-near"></div>
  <button id="c-fly" class="fly" type="button">Fly to it</button>
</aside>

<footer id="bottom">
  <div id="stats" class="stats">
    <div><b id="s-notes">–</b><span>Notes</span></div>
    <div><b id="s-links">–</b><span>Links</span></div>
    <div><b id="s-clusters">–</b><span>Clusters</span></div>
    <div><b id="s-learned">–</b><span>Learned 7d</span></div>
  </div>
  <div id="chips" class="chips" role="toolbar" aria-label="Show one cluster"></div>
</footer>

<div id="toast" class="toast" role="status" hidden></div>
<div id="nogl" class="nogl" hidden><p>This device can't draw the 3D brain.</p><p>The numbers and the search still work.</p></div>
</body>
</html>
