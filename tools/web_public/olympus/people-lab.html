<!doctype html>
<html lang="en" data-theme="agora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>People lab</title>
<meta name="theme-color" content="#14110e">
<!-- PEOPLE LAB: every person of the roster as a 2D portrait (44 px and 96 px, four moods) and as a 3D figure (high, LITE, seated, crowd). A checking page for the people kit
     (olympus/people.js, people3d.js); not an app. ?pose=wave|talk|cheer|slump|idle  ?still=1 (no animation)  ?n=24 (how many 3D figures). Tap anyone to talk. -->
<link rel="stylesheet" href="agora.css?v=a1">
<style>
  html { background: #14110e; } body { margin: 0; padding: 14px 14px 60px; font: 500 14px/1.4 -apple-system, system-ui, sans-serif; color: #f3ece0; }
  h1 { font: 600 24px 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; margin: 0 0 4px; } h2 { font: 600 17px 'Iowan Old Style', Palatino, Georgia, serif; margin: 18px 0 8px; }
  p { margin: 0 0 8px; color: #cfc4b2; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 8px; }
  .cell { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; min-height: 44px; border-radius: 14px; border: 1px solid #3a3228; background: #1d1914; color: inherit; font: inherit; cursor: pointer; text-align: center; }
  .cell b { font-size: 13px; } .cell small { font-size: 11px; color: #9a8f7d; }
  .moods { display: flex; gap: 3px; }
  canvas { display: block; width: 100%; height: 520px; border-radius: 16px; border: 1px solid #3a3228; background: #2a2118; touch-action: none; }
</style>
</head>
<body>
<h1>People lab</h1>
<p id="status" role="status" aria-live="polite">Loading...</p>
<h2>In 3D (front row: full figures; back row: LITE; behind: one instanced crowd, seated)</h2>
<canvas id="c3d" aria-label="The people as 3D figures"></canvas>
<h2>Portraits (96 px, then 44 px: calm, proud, sheepish, worried)</h2>
<div class="grid" id="grid"></div>
<script type="module">
import P from './people.js?v=p1';
import * as THREE from '../jarvis/three.module.min.js';
import { spec, figure, figureInstanced, POSE_NAMES } from './people3d.js?v=p1';
const q = new URLSearchParams(location.search), still = q.get('still') === '1', pose = POSE_NAMES.indexOf(q.get('pose')) >= 0 ? q.get('pose') : null, N = Math.max(1, Math.min(40, +q.get('n') || 14));
await P.ready(); await P.warm();
const people = P.list(), grid = document.getElementById('grid');
for (const p of people.concat(P.list({ kind: 'villager' }).slice(0, 8))) {
  const b = document.createElement('button'); b.className = 'cell'; b.type = 'button';
  b.appendChild(P.portrait(p.id, 96));
  const m = document.createElement('span'); m.className = 'moods'; for (const mood of ['calm', 'proud', 'sheepish', 'worried']) m.appendChild(P.portrait(p.id, 44, { mood, uid: mood })); b.appendChild(m);
  const n = document.createElement('b'); n.textContent = p.name; b.appendChild(n); const t = document.createElement('small'); t.textContent = p.title; b.appendChild(t);
  b.addEventListener('click', () => P.open(p.id, { anchor: b })); grid.appendChild(b);
}
const canvas = document.getElementById('c3d');
let info = 'no WebGL';
try {
  const r = new THREE.WebGLRenderer({ canvas, antialias: true }); r.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#3a2c1e');
  const cam = new THREE.PerspectiveCamera(34, 1, 0.1, 60);
  scene.add(new THREE.HemisphereLight('#ffe9c4', '#5a4630', 1.5)); const sun = new THREE.DirectionalLight('#ffd9a0', 2.2); sun.position.set(3, 6, 5); scene.add(sun);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 40), new THREE.MeshStandardMaterial({ color: '#cdbf9f', roughness: 0.95 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const figs = [], shown = people.slice(0, N), poses = POSE_NAMES;
  shown.forEach((p, i) => { const per = Math.ceil(shown.length / 2), row = i < per ? 0 : 1, k = row ? i - per : i, n = row ? shown.length - per : per; const f = figure(THREE, spec(p.id), {}); f.position.set((k - (n - 1) / 2) * 0.62, 0, 1.5 - row * 0.9); f.userData.pose(pose || poses[i % 5]); scene.add(f); figs.push(f); });
  people.slice(0, 8).forEach((p, i) => { const f = figure(THREE, spec(p.id), { lite: true }); f.position.set((i - 3.5) * 0.62, 0, -0.5); scene.add(f); figs.push(f); });
  const crowd = figureInstanced(THREE, people.map((p) => spec(p.id)), { seated: true });
  people.forEach((p, i) => crowd.userData.place(i, ((i % 13) - 6) * 0.56, 0.0, -1.5 - Math.floor(i / 13) * 0.75, 0, 1)); scene.add(crowd);
  let tris = 0; for (const f of figs.slice(0, shown.length)) tris = Math.max(tris, f.userData.triangles);
  const fit = () => { const w = canvas.clientWidth, h = canvas.clientHeight; r.setSize(w, h, false); cam.aspect = w / h; const d = w < 600 ? 8.6 : 5.4; cam.position.set(0, 1.7, d); cam.lookAt(0, 0.45, -0.4); cam.updateProjectionMatrix(); };
  fit(); addEventListener('resize', fit);
  const t0 = performance.now(); let last = t0;
  const frame = (now) => { const t = (now - t0) / 1000, dt = (now - last) / 1000; last = now; if (!still) { for (const f of figs) f.userData.tick(dt, t); crowd.userData.tick(t); } r.render(scene, cam); window.__labCalls = r.info.render.calls; if (!still) requestAnimationFrame(frame); };
  if (still) { for (const f of figs) f.userData.tick(0.016, 1.3); frame(t0 + 1300); } else requestAnimationFrame(frame);
  info = shown.length + ' figures (most triangles in one: ' + tris + '), 8 LITE, ' + people.length + ' in one crowd of ' + crowd.userData.drawCalls + ' draw calls';
} catch (e) { info = 'no WebGL here: ' + (e && e.message ? e.message : e); }
document.getElementById('status').textContent = people.length + ' people. ' + info + '. Tap anyone to talk.';
window.PEOPLE_LAB = { ready: () => true };
</script>
</body>
</html>
