<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OLYMPUS Sound Lab</title>
<style>
:root{--bg:#0b0b10;--fg:#f1e8d0;--gold:#d4af37;--card:#16161f}
@media (prefers-color-scheme:light){:root{--bg:#f4efe2;--fg:#1b1710;--card:#fff}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif}
h1{color:var(--gold);letter-spacing:.2em;font-size:20px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{min-height:56px;border:1px solid var(--gold);background:var(--card);color:var(--fg);border-radius:12px;font-size:16px}
button:active{background:var(--gold);color:#000}
label{display:block;margin:16px 0 4px}input[type=range]{width:100%}
pre{background:var(--card);padding:10px;border-radius:8px;font-size:12px;overflow:auto}
</style></head><body>
<h1>OLYMPUS SOUND LAB</h1>
<p>Tap anything first: sound starts only after a touch. On iPhone, turn the silent switch off.</p>
<div class="g" id="g"></div>
<label>Volume <input id="vol" type="range" min="0" max="1" step="0.01"></label>
<button id="mu" style="width:100%">Mute</button>
<pre id="st"></pre>
<script src="sfx.js"></script>
<script>
var S=window.OLYMPUS_SFX,g=document.getElementById('g');
S.names.forEach(function(n){var b=document.createElement('button');b.textContent=n;
 b.onclick=function(){if(n==='pad'){S.state().padOn?S.stop('pad'):S.play('pad');}else S.play(n);up();};g.appendChild(b);});
var v=document.getElementById('vol');v.value=S.state().volume;v.oninput=function(){S.setVolume(v.value);up();};
document.getElementById('mu').onclick=function(){S.mute();up();};
function up(){var s=S.state();document.getElementById('mu').textContent=s.muted?'Unmute':'Mute';document.getElementById('st').textContent=JSON.stringify(s,null,1);}
up();
</script></body></html>
