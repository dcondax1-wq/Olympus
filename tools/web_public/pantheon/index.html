<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantheon</title>
<meta name="description" content="PANTHEON: free market-context data for NQ futures, one Greek god per source, and the Council of the Gods verdict.">
<meta name="theme-color" content="#07060d">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../jarvis/icon-192.png?v=j1">
<!-- PANTHEON (tools/web_public/pantheon/, 2026-11-03): the hall of the data gods. tools/pantheon/build.py writes
     pantheon.json + states.json + jarvis.json here (CRONOS refreshes them nightly); fixture.json is the demo copy.
     Read-only context page: it never changes a strategy. Look: pantheon.css; data + formatting: pantheoncore.js;
     the 3D hall + UI: pantheon.js (three.js r160 from ../jarvis/). Bump ?v= on all three when one changes. -->
<script>(function () { var d = document.documentElement; try { if (window.top !== window) d.classList.add('framed'); } catch (e) { d.classList.add('framed'); } })();</script>
<link rel="stylesheet" href="../olympus/olympus.css?v=o2">
<script src="../olympus/themes.js?v=o2"></script>
<script src="../olympus/olympus.js?v=o2" data-app="pantheon"></script>
<link rel="stylesheet" href="pantheon.css?v=p1">
</head>
<body>
<canvas id="hall" aria-label="Mount Olympus: a circle of glowing pillars, one per data god, beaming into the Council orb" role="img"></canvas>
<div id="nogl" class="nogl" hidden></div>
<header class="hud" id="hud">
  <div class="title">
    <h1>PANTHEON</h1>
    <span class="tag" id="demo" hidden>DEMO DATA</span>
  </div>
  <p class="sub" id="sub">The gods of free market data</p>
  <button type="button" class="council" id="councilBtn" aria-controls="council" aria-expanded="false">
    <span class="ck">COUNCIL OF THE GODS</span>
    <b id="c-label">—</b><i id="c-gauge"></i>
  </button>
</header>
<footer class="dock" id="dock">
  <nav class="strip" id="strip" aria-label="The gods"></nav>
  <p class="vline" id="vline"></p>
</footer>
<section class="card" id="card" hidden role="dialog" aria-modal="false" aria-labelledby="card-h">
  <button type="button" class="x" id="cardX" aria-label="Close">✕</button>
  <h2 id="card-h"></h2>
  <p class="meta" id="card-m"></p>
  <div id="card-b"></div>
</section>
<section class="card" id="council" hidden role="dialog" aria-modal="false" aria-labelledby="council-h">
  <button type="button" class="x" id="councilX" aria-label="Close">✕</button>
  <h2 id="council-h">The Council of the Gods</h2>
  <div id="council-b"></div>
</section>
<script type="module" src="pantheon.js?v=p1"></script>
</body>
</html>
