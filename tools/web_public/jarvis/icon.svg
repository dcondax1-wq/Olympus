<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
<!-- Jarvis vector fallback: the violet Gimbal Reactor as a simple silhouette (plasma core, tilted gimbal ring,
     equatorial ring, projector dial). The full icon is the rendered PNG set. -->
<defs>
<radialGradient id="bg" cx=".5" cy=".42" r=".78"><stop offset="0" stop-color="#3d0f75"/><stop offset=".55" stop-color="#140630"/><stop offset="1" stop-color="#03010a"/></radialGradient>
<radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".28" stop-color="#f5d0fe"/><stop offset=".62" stop-color="#a95cff" stop-opacity=".8"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a95cff" stop-opacity=".85"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
</defs>
<rect width="64" height="64" rx="14" fill="url(#bg)"/>
<ellipse cx="32" cy="54.5" rx="19" ry="6" fill="url(#pool)"/>
<ellipse cx="32" cy="54.5" rx="15.5" ry="4" fill="none" stroke="#c084fc" stroke-width="1.3"/>
<circle cx="32" cy="27.5" r="15" fill="url(#core)"/>
<g fill="none" stroke-linecap="round">
<ellipse cx="31" cy="27" rx="11.5" ry="21" transform="rotate(14 31 27)" stroke="#e2d6ff" stroke-width="2.4"/>
<ellipse cx="31" cy="27" rx="11.5" ry="21" transform="rotate(14 31 27)" stroke="#22d3ee" stroke-width="1.1" stroke-dasharray="7 9"/>
<ellipse cx="32" cy="29" rx="27" ry="5.5" transform="rotate(3 32 29)" stroke="#e2d6ff" stroke-width="2.2"/>
<ellipse cx="32" cy="29" rx="27" ry="5.5" transform="rotate(3 32 29)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="9 7"/>
</g>
<circle cx="32" cy="27.5" r="4.2" fill="#fff"/>
<circle cx="6" cy="27.6" r="1.6" fill="#f5d0fe"/><circle cx="58" cy="30.4" r="1.6" fill="#22d3ee"/>
</svg>
