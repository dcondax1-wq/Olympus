<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2a0f52"/><stop offset=".45" stop-color="#12062a"/><stop offset="1" stop-color="#030108"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#f7cf6a"/><stop offset=".75" stop-color="#d9962c"/><stop offset="1" stop-color="#a8681a"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8771f"/><stop offset=".3" stop-color="#ffe7a3"/><stop offset=".55" stop-color="#f2c45a"/><stop offset="1" stop-color="#9c5f16"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".18" stop-color="#f3e6ff"/><stop offset=".42" stop-color="#c084fc"/><stop offset=".72" stop-color="#7c22e0"/><stop offset="1" stop-color="#7c22e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".75"/><stop offset=".55" stop-color="#7c3aed" stop-opacity=".22"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#e9d5ff" opacity=".7">
    <circle cx="150" cy="170" r="3"/><circle cx="860" cy="140" r="2.5"/><circle cx="790" cy="250" r="2"/><circle cx="230" cy="300" r="2"/>
    <circle cx="905" cy="420" r="2"/><circle cx="110" cy="460" r="2.5"/><circle cx="640" cy="110" r="2"/><circle cx="360" cy="130" r="2"/>
  </g>
  <!-- the core's halo behind the temple -->
  <circle cx="512" cy="560" r="300" fill="url(#halo)"/>
  <!-- the temple -->
  <g filter="url(#glow)">
    <!-- pediment -->
    <path d="M512 214 L834 372 L190 372 Z" fill="url(#gold)"/>
    <path d="M512 262 L752 352 L272 352 Z" fill="#1a0838" opacity=".85"/>
    <!-- architrave -->
    <rect x="176" y="384" width="672" height="40" rx="6" fill="url(#gold)"/>
    <!-- columns -->
    <g fill="url(#goldSide)">
      <rect x="214" y="446" width="64" height="318" rx="6"/>
      <rect x="342" y="446" width="64" height="318" rx="6"/>
      <rect x="618" y="446" width="64" height="318" rx="6"/>
      <rect x="746" y="446" width="64" height="318" rx="6"/>
    </g>
    <!-- column capitals and bases -->
    <g fill="url(#gold)">
      <rect x="200" y="434" width="92" height="20" rx="4"/><rect x="328" y="434" width="92" height="20" rx="4"/>
      <rect x="604" y="434" width="92" height="20" rx="4"/><rect x="732" y="434" width="92" height="20" rx="4"/>
      <rect x="200" y="756" width="92" height="20" rx="4"/><rect x="328" y="756" width="92" height="20" rx="4"/>
      <rect x="604" y="756" width="92" height="20" rx="4"/><rect x="732" y="756" width="92" height="20" rx="4"/>
    </g>
    <!-- steps -->
    <rect x="160" y="788" width="704" height="34" rx="6" fill="url(#gold)"/>
    <rect x="124" y="832" width="776" height="34" rx="6" fill="url(#gold)" opacity=".92"/>
  </g>
  <!-- the core between the columns -->
  <circle cx="512" cy="600" r="150" fill="#9333ea" opacity=".55" filter="url(#soft)"/>
  <circle cx="512" cy="600" r="112" fill="url(#core)"/>
  <circle cx="512" cy="600" r="128" fill="none" stroke="#e9d5ff" stroke-width="5" opacity=".55"/>
  <ellipse cx="512" cy="600" rx="150" ry="44" fill="none" stroke="#c084fc" stroke-width="5" opacity=".7" transform="rotate(-18 512 600)"/>
  <!-- lightning through the core -->
  <path d="M548 470 L486 590 L530 590 L470 722 L578 566 L532 566 L582 470 Z" fill="#fff8dc" filter="url(#glow)"/>
</svg>
