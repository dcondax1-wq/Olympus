<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="description" content="Jarvis: the home screen for all your projects. Switch between Jarvis and Zenith in one tap, plus the Planner, Kalshi and the rest.">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest?v=j1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=j1">
<link rel="icon" href="icon-192.png?v=j1">
<!-- dark from the first paint, even before (or without) the stylesheet: never a white screen -->
<style>html,body{background:#0b0b0d;color:#f4f4f6;margin:0}</style>
<link rel="stylesheet" href="jarvis.css?v=j4">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="modes" id="modes" role="group" aria-label="Mode"></div>
    <nav class="apps" id="apps" aria-label="Your dashboards"></nav>
    <button class="icon-b" id="out" type="button" title="Open this dashboard on its own" aria-label="Open this dashboard on its own" hidden>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3H3.5A.5.5 0 0 0 3 3.5v9a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V10M9 3h4v4M13 3 7.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-b" id="gear" type="button" title="Settings" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="2.6" stroke="currentColor" stroke-width="1.6"/><path d="M9 1.8v2.1M9 14.1v2.1M1.8 9h2.1M14.1 9h2.1M3.9 3.9l1.5 1.5M12.6 12.6l1.5 1.5M3.9 14.1l1.5-1.5M12.6 5.4l1.5-1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="view" id="home" aria-label="Jarvis">
    <div class="home-in">
      <div class="hero">
        <div class="core" id="core" aria-hidden="true"><div class="orb" id="orb"></div><div class="core-slot" id="coreSlot"></div></div>
        <div>
          <h1 class="hello" id="hello">Hello</h1>
          <p class="sub" id="when">&nbsp;</p>
        </div>
      </div>

      <form class="ask" id="ask" autocomplete="off">
        <input id="q" type="text" enterkeyhint="send" placeholder="Ask Jarvis, or say “open planner”" aria-label="Ask Jarvis">
        <button type="button" id="mic" aria-label="Talk to Jarvis" title="Talk to Jarvis" hidden>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="6.2" y="2" width="5.6" height="9" rx="2.8" stroke="currentColor" stroke-width="1.7"/><path d="M3.8 8.6a5.2 5.2 0 0 0 10.4 0M9 13.8V16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <button type="submit" aria-label="Send" title="Send">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 9h11M9.5 4.5 14 9l-4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="talk" id="talk" aria-live="polite"></div>
      <div class="chips2" id="sugs"></div>

      <p class="sec-t">Your projects</p>
      <div class="cards" id="cards"></div>
      <p class="foot">Every project keeps running on its own. Jarvis only switches what you see.</p>
    </div>
  </section>
  <section class="view" id="zen" aria-label="Zenith" hidden></section>
  <div id="frames"></div>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <form class="sheet-in" id="addF" autocomplete="off">
    <h2 id="sheetT">Add a dashboard</h2>
    <label>Name<input id="addName" type="text" maxlength="24" placeholder="Clipper"></label>
    <label>Link<input id="addUrl" type="url" inputmode="url" placeholder="https://…"></label>
    <p class="err" id="addErr"></p>
    <div class="mine" id="mine"></div>
    <div class="sheet-row"><button class="btn ghost" type="button" id="addX">Close</button><button class="btn" type="submit">Add</button></div>
  </form>
</div>

<div class="sheet" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="setT">
  <form class="sheet-in" id="setF" autocomplete="off">
    <h2 id="setT">Settings</h2>
    <h3>Voice</h3>
    <label class="row-t"><span>Talk to Jarvis<small>The mic button, and answers read out loud when you talk</small></span><input type="checkbox" id="setVoice"></label>
    <h3>Smart mode</h3>
    <label class="row-t"><span>Smart answers<small id="smartNote">Your own API key, kept only on this phone</small></span><input type="checkbox" id="setSmart"></label>
    <label>API key<input id="setKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key (kept on this phone only)"></label>
    <label>Model<input id="setModel" type="text" autocapitalize="off" spellcheck="false" placeholder="Leave empty for the default"></label>
    <p class="note" id="smartState"></p>
    <h3>Apps</h3>
    <div class="mine" id="setApps"></div>
    <div class="sheet-row"><button class="btn ghost" type="button" id="setAdd">Add a dashboard</button></div>
    <p class="note" id="modNote"></p>
    <div class="sheet-row"><button class="btn ghost" type="button" id="setForget">Forget key</button><button class="btn ghost" type="button" id="setX">Close</button><button class="btn" type="submit">Save</button></div>
  </form>
</div>

<div class="boot" id="boot" hidden>Jarvis is taking a while to start.<button type="button" onclick="location.reload()">Reload</button></div>
<script>window.__jarvisBoot = setTimeout(function () { var b = document.getElementById('boot'); if (b) b.hidden = false; }, 8000);</script>
<script type="module">
// Jarvis shell (2026-11-01): modes (Jarvis / Zenith) + the other apps, on one data facade (data.js). The other parts are
// separate modules loaded on their own; a missing or broken one falls back to the built-in version here:
//   brain.js        createBrain({getFacts, open, now})      fallback: fallbackBrain() (rule-based answers)
//   core-visual.js  mountCore(el, {size})                   fallback: the CSS orb
//   apps.js         listApps / addApp / removeApp / appStatus   fallback: data.js fallbackApps
//   zenith-mode.js  mountZenithMode({host, onExit})         fallback: Zenith in a frame
import * as D from './data.js';

const $ = (s) => document.querySelector(s);
const esc = D.esc;
const root = document.documentElement;
const HOME = { id: 'home', name: 'Jarvis', glyph: 'orb' };

// ------------------------------------------------------------------ settings kept on this phone
const S = {
  voice: () => D.LS.get('jarvis.voice', true) !== false,
};

// ------------------------------------------------------------------ the optional modules (each on its own; absent = fallback)
const mods = {};
function load(name, path, ok) {
  root.dataset[name] = 'loading';
  return import(path).then((m) => { if (!ok(m)) throw new Error(name + ': not the expected module'); mods[name] = m; root.dataset[name] = 'module'; return m; })
    .catch(() => { root.dataset[name] = 'fallback'; return null; });
}
const ready = {
  apps: load('apps', './apps.js', (m) => typeof m.listApps === 'function'),
  brain: load('brain', './brain.js', (m) => typeof m.createBrain === 'function'),
  core: load('core', './core-visual.js', (m) => typeof m.mountCore === 'function'),
  zenith: load('zenith', './zenith-mode.js', (m) => typeof m.mountZenithMode === 'function'),
};
const within = (p, ms) => Promise.race([p, new Promise((ok) => setTimeout(() => ok(null), ms))]);

// ------------------------------------------------------------------ apps
const apps = () => [HOME, ...D.listApps()];
const byId = (id) => { const all = apps(); return all.find((a) => a.id === id) || all.find((a) => String(a.id).toLowerCase() === String(id || '').toLowerCase()); };
function glyphSvg(kind, size) {
  if (kind === 'orb') return `<svg class="glyph" viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true"><defs><radialGradient id="g${size}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset=".28" stop-color="#fff" stop-opacity=".7"/><stop offset=".62" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="40" height="40" rx="10" fill="#1d1d21"/><circle cx="20" cy="20" r="13" fill="url(#g${size})"/><circle cx="20" cy="20" r="11" fill="none" stroke="#9a9ba1" stroke-width="1.6"/><circle cx="20" cy="20" r="3.6" fill="#fff"/></svg>`;
  const ch = esc(String(kind || '?').slice(0, 1).toUpperCase());
  return `<svg class="glyph" viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1d1d21"/><text x="20" y="26.5" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="700" fill="#c4c5ca">${ch}</text><circle cx="30.5" cy="10" r="2.6" fill="#fff"/></svg>`;
}
const iconOf = (a, size) => a.icon ? `<img src="${esc(a.icon)}" alt="" width="${size}" height="${size}">` : glyphSvg(a.glyph || a.name, size);

// ------------------------------------------------------------------ switching: Jarvis mode, Zenith mode, one other app at a time
let active = 'home';
const frames = {};
let zen = null, zenMounted = false;                // the Zenith mode module, once mounted
function renderBar() {
  const z = byId('zenith') || { id: 'zenith', name: 'Zenith', icon: '../icons/icon-192.png?v=p111030' };
  $('#modes').innerHTML = [HOME, z].map((a) => `<button class="mode" type="button" data-app="${esc(a.id)}"${a.id === active ? ' aria-current="page"' : ''}>${iconOf(a, 26)}<span>${esc(a.name)}</span></button>`).join('');
  $('#apps').innerHTML = D.listApps().filter((a) => a.id !== 'zenith').map((a) => `<button class="chip" type="button" data-app="${esc(a.id)}"${a.id === active ? ' aria-current="page"' : ''}>${iconOf(a, 26)}<span>${esc(a.name)}</span></button>`).join('')
    + '<button class="chip add" type="button" id="addB" aria-label="Add a dashboard" title="Add a dashboard"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>';
  const a = byId(active);
  $('#out').hidden = !(a && a.url && active !== 'home');
  $('#gear').hidden = active !== 'home';
  root.dataset.mode = active === 'home' ? 'jarvis' : active === 'zenith' ? 'zenith' : 'app';
}
function parseOpen(x) {                               // 'zenith', 'zenith:board', 'zenith/board' or {id, route}
  if (!x) return null;
  if (typeof x === 'object') return x.id ? { id: String(x.id), route: x.route } : null;
  const m = /^([^:/]+)[:/]?(.*)$/.exec(String(x).trim());
  return m ? { id: m[1].toLowerCase() === 'jarvis' ? 'home' : m[1], route: m[2] || undefined } : null;
}
function hideZen() { if (zen && zenMounted) { try { zen.hide(); } catch (_) { /* its own problem */ } } $('#zen').hidden = true; }
function frameView(a) {
  // One dashboard kept loaded at a time (2026-11-01, white screen on the iPhone): every page inside Jarvis shares one
  // iPhone web process, so the one shown before is let go; going back to the Jarvis screen keeps it for a quick return.
  for (const k of Object.keys(frames)) if (k !== a.id) { frames[k].remove(); delete frames[k]; }
  let v = frames[a.id];
  if (!v || v.dataset.url !== a.url) {
    if (v) v.remove();
    v = document.createElement('section');
    v.className = 'view'; v.id = 'v-' + a.id; v.dataset.url = a.url; v.setAttribute('aria-label', a.name);
    const f = document.createElement('iframe');
    f.className = 'frame'; f.src = a.url; f.title = a.name;
    f.setAttribute('allow', 'clipboard-read; clipboard-write; microphone; autoplay; fullscreen; screen-wake-lock');
    v.appendChild(f);
    if (!D.sameSite(a.url)) {                      // another site may refuse to be shown inside another app
      const n = document.createElement('div');
      n.className = 'frame-note';
      n.innerHTML = 'If this stays blank, the site does not allow being shown inside Jarvis.<button type="button">Open it on its own</button>';
      n.querySelector('button').onclick = () => openOut(a);
      v.appendChild(n);
      setTimeout(() => { n.hidden = true; }, 7000);
    }
    $('#frames').appendChild(v);
    frames[a.id] = v;
  }
  v.hidden = false;
}
let showSeq = 0;
function show(id, opts = {}) {
  const a = byId(id) || HOME;
  if (a.id !== 'home' && !a.url) {
    show('home');
    setTimeout(() => { const f = document.getElementById('link-' + a.id); if (f) { f.scrollIntoView({ block: 'center' }); f.focus(); } }, 50);
    return;
  }
  const seq = ++showSeq;
  active = a.id;
  $('#home').hidden = a.id !== 'home';
  for (const k of Object.keys(frames)) frames[k].hidden = k !== a.id;
  if (a.id !== 'zenith') hideZen();
  if (a.id === 'home') { refreshHome(); setCore('idle'); }
  else if (a.id === 'zenith') showZenith(a, opts.route, seq);
  else frameView(a);
  renderBar();
  // The address stays the Jarvis screen (no #zenith): a reopen, or the iPhone reloading Jarvis in the background, always
  // starts on the Jarvis screen, never straight inside a dashboard.
}
async function showZenith(a, route, seq) {
  // Zenith mode: the full Zenith app (zenith-mode.js) when it is here, else Zenith in a frame as before
  const m = mods.zenith || await within(ready.zenith, 2500);
  if (seq !== showSeq) return;                       // the owner moved on while it loaded
  if (m && !zenMounted) {
    try { zen = m.mountZenithMode({ host: $('#zen'), onExit: () => show('home') }); zenMounted = !!(zen && typeof zen.show === 'function'); }
    catch (_) { zen = null; zenMounted = false; }
    if (!zenMounted) root.dataset.zenith = 'fallback';
  }
  if (zenMounted) {
    for (const k of Object.keys(frames)) { frames[k].remove(); delete frames[k]; }   // one heavy view at a time
    $('#zen').hidden = false;
    try { zen.show(route); root.dataset.zenith = 'module'; return; } catch (_) { $('#zen').hidden = true; root.dataset.zenith = 'fallback'; }
  }
  frameView(a);
}
function openOut(a) { if (a && a.url) window.open(new URL(a.url, location.href).href, '_blank', 'noopener'); }
let openT = 0;
function openSoon(x) { const o = parseOpen(x); if (!o) return; clearTimeout(openT); openT = setTimeout(() => show(o.id, { route: o.route }), 450); }

document.addEventListener('click', (e) => {
  const c = e.target.closest('[data-app]');
  if (c) { show(c.dataset.app); return; }
  if (e.target.closest('#addB')) { openSheet(); return; }
  if (e.target.closest('#out')) { openOut(byId(active)); return; }
  if (e.target.closest('#gear')) { openSettings(); return; }
  const s = e.target.closest('[data-say]');
  if (s) { ask(s.dataset.say); return; }
});
window.addEventListener('hashchange', () => {          // a #name link while Jarvis runs opens that app; the address stays clean
  const id = location.hash.slice(1);
  history.replaceState(null, '', location.pathname + location.search);
  show(id || 'home');
});

// ------------------------------------------------------------------ the centerpiece (core-visual.js, else the CSS orb)
let core = null, coreState = 'idle';
const orbCore = {
  setState(s) { const o = $('#orb'); if (!o) return; o.classList.toggle('think', s === 'thinking'); o.classList.toggle('listen', s === 'listening'); o.classList.toggle('speak', s === 'speaking'); },
  setLevel() { /* the CSS orb has no level */ },
  destroy() { /* nothing to free */ },
};
function setCore(state, level) {
  coreState = state;
  for (const c of core ? [core] : [orbCore]) { try { c.setState(state); if (level != null) c.setLevel(level); } catch (_) { /* a broken visual never stops Jarvis */ } }
}
ready.core.then((m) => {
  if (!m) return;
  const slot = $('#coreSlot');
  try {
    const c = m.mountCore(slot, { size: Math.round($('#core').getBoundingClientRect().width) || 64 });
    if (!c || typeof c.setState !== 'function') throw new Error('no core');
    core = c; $('#orb').hidden = true; root.dataset.core = 'module';
  } catch (_) { slot.innerHTML = ''; core = null; root.dataset.core = 'fallback'; }
});

// ------------------------------------------------------------------ the project cards
function zenithCard(a) {
  const v = D.liveView();
  const head = `<div class="card-h">${iconOf(a, 40)}<div><b>Zenith</b><small>${esc(a.sub || '')}</small></div><span class="go" aria-hidden="true">›</span></div>`;
  if (!v) return `<button class="card" type="button" data-app="zenith">${head}<p class="muted">${D.liveError() ? 'Could not reach the live feed. Open Zenith for everything.' : 'Loading the bots…'}</p></button>`;
  const vd = v.verdict || {}, lvl = vd.level === 'good' || vd.level === 'ok' ? 'ok' : vd.level === 'bad' ? 'bad' : vd.level ? 'warn' : '';
  const acct = (x, label) => {
    if (!x) return '';
    const set = x.room != null;
    return `<div class="acct"><i>${esc(label)} · ${esc(x.plan || '')}${x.badge ? ' · ' + esc(x.badge) : ''}</i>${set ? `<div class="kv"><div><span>Today</span><strong>${D.usd(x.today_pnl, true)}</strong></div><div><span>Room</span><strong>${D.usd(x.room)}</strong></div><div><span>To target</span><strong>${D.usd(x.to_target)}</strong></div></div>` : `<p class="muted">${esc(x.off ? 'Account C off · paper only until its own 25K' : x.status || 'not set up')}</p>`}</div>`;
  };
  return `<button class="card" type="button" data-app="zenith">${head}<span class="pill ${lvl}">${esc(vd.label || 'Bot status')}${v.t ? ' · ' + esc(D.ago(v.t)) : ''}</span>${acct(v.lit, 'Zlarior')}${acct(v.atlas, 'ATLAS')}${acct(v.blitz, 'BLITZ')}</button>`;
}
function plannerCard(a) {
  const p = D.plannerDay();
  const head = `<div class="card-h">${iconOf(a, 40)}<div><b>Planner</b><small>${esc(a.sub || '')}</small></div><span class="go" aria-hidden="true">›</span></div>`;
  if (!p) return `<button class="card" type="button" data-app="planner">${head}<p class="muted">Open the Planner to see your day here.</p></button>`;
  const evs = p.ev.slice(0, 4).map((e) => `<li><b>${e.allDay ? 'All day' : esc(D.hm(e.start))}</b><span>${esc(e.title)}</span></li>`).join('');
  const tk = p.tasks.length ? `<li><b>${p.tasks.length}</b><span>${p.tasks.length === 1 ? 'task' : 'tasks'} open: ${esc(p.tasks.slice(0, 2).map((t) => t.title).join(', '))}${p.tasks.length > 2 ? '…' : ''}</span></li>` : '';
  const body = evs || tk ? `<ul class="list">${evs}${tk}</ul>` : '<p class="muted">Nothing planned today.</p>';
  return `<button class="card" type="button" data-app="planner">${head}${body}</button>`;
}
function kalshiCard(a) {
  const k = D.kalshiView(), st = D.kalshiState();
  const head = `<div class="card-h">${iconOf(a, 40)}<div><b>Kalshi</b><small>${esc(a.sub || '')}</small></div><span class="go" aria-hidden="true">›</span></div>`;
  if (!k) return `<button class="card" type="button" data-app="kalshi">${head}<p class="muted">${st === 'waiting' ? 'Waiting for your PC: the Kalshi bot is not publishing yet. Open Kalshi for the one step that connects it.' : st === 'error' ? 'Could not reach the Kalshi feed. Open Kalshi to try again.' : 'Loading Kalshi…'}</p></button>`;
  const [lvl, label] = D.kalshiRun(k), n = Array.isArray(k.positions) ? k.positions.length : null;
  return `<button class="card" type="button" data-app="kalshi">${head}<span class="pill ${lvl}">${esc(label)}${k.mode ? ' · ' + esc(String(k.mode).toUpperCase()) : ''}${k.t ? ' · ' + esc(D.ago(k.t)) : ''}</span><div class="kv"><div><span>Balance</span><strong>${D.usd2(k.balance)}</strong></div><div><span>Today</span><strong>${D.usd2(k.today_pnl, true)}</strong></div><div><span>Open</span><strong>${n == null ? '—' : n}</strong></div></div></button>`;
}
const statusCards = {};                               // apps.js appStatus(app) answers, by app id
function genericCard(card) {
  if (!card || typeof card !== 'object') return '';
  const lvl = ['ok', 'warn', 'bad'].includes(card.level) ? card.level : '';
  const rows = Array.isArray(card.kv) ? card.kv : Array.isArray(card.rows) ? card.rows : [];
  return `${card.status || card.label ? `<span class="pill ${lvl}">${esc(card.status || card.label)}</span>` : ''}`
    + (rows.length ? `<div class="kv">${rows.slice(0, 3).map((r) => `<div><span>${esc(Array.isArray(r) ? r[0] : r.label)}</span><strong>${esc(Array.isArray(r) ? r[1] : r.value)}</strong></div>`).join('')}</div>` : '')
    + (card.text ? `<p class="muted">${esc(card.text)}</p>` : '');
}
function linkCard(a) {
  const head = (go) => `<div class="card-h">${iconOf(a, 40)}<div><b>${esc(a.name)}</b><small>${esc(a.sub || (a.url ? new URL(a.url, location.href).host : ''))}</small></div>${go ? '<span class="go" aria-hidden="true">›</span>' : ''}</div>`;
  if (a.url) {
    const sc = statusCards[a.id];
    let body = '';
    if (sc && mods.apps && typeof mods.apps.renderCard === 'function') { try { const h = mods.apps.renderCard(sc); body = typeof h === 'string' ? h : ''; } catch (_) { body = ''; } }
    if (!body && sc) body = genericCard(sc);
    return `<button class="card" type="button" data-app="${esc(a.id)}">${head(true)}${body || `<p class="muted">Open ${esc(a.name)} inside Jarvis.</p>`}</button>`;
  }
  return `<div class="card">${head(false)}<p class="muted">Paste your ${esc(a.name)} dashboard link once and it opens right here.</p><form class="link-f" data-link="${esc(a.id)}"><input id="link-${esc(a.id)}" type="url" inputmode="url" placeholder="https://…" aria-label="${esc(a.name)} dashboard link"><button type="submit">Save</button></form></div>`;
}
function renderCards() {
  const list = D.listApps();
  $('#cards').innerHTML = list.map((a) => a.id === 'zenith' ? zenithCard(a) : a.id === 'planner' ? plannerCard(a) : a.id === 'kalshi' ? kalshiCard(a) : linkCard(a)).join('');
}
let statusAt = 0;
function refreshStatusCards() {                       // added apps with a status feed (apps.js appStatus)
  const m = mods.apps;
  if (!m || typeof m.appStatus !== 'function' || Date.now() - statusAt < 60e3) return;
  statusAt = Date.now();
  for (const a of D.listApps()) {
    if (['zenith', 'planner', 'kalshi'].includes(a.id)) continue;
    let p = null;
    try { p = m.appStatus(a); } catch (_) { p = null; }
    if (p && typeof p.then === 'function') p.then((card) => { if (card) { statusCards[a.id] = card; if (active === 'home') renderCards(); } }).catch(() => null);
  }
}
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-link]');
  if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'), u = D.okUrl(inp.value.trim());
  if (!u) { inp.setCustomValidity('Paste a full link that starts with https://'); inp.reportValidity(); return; }
  D.fallbackApps.setLink(f.dataset.link, u);
  renderBar(); renderCards(); show(f.dataset.link);
});
function greet() { $('#hello').textContent = D.greeting(); $('#when').textContent = D.whenLine(); }
function refreshHome() { greet(); renderCards(); D.refresh({ maxAge: 50e3 }); refreshStatusCards(); }
D.onChange(({ source }) => {
  if (source === 'apps') { renderBar(); renderSettingsApps(); }
  if (active === 'home') renderCards();
});

// ------------------------------------------------------------------ the brain (brain.js, else the built-in rule-based one)
function fallbackBrain({ getFacts }) {
  const OPEN_WORDS = /\b(open|go to|goto|show|switch to|take me to|launch|pull up)\b/;
  const ASK_WORDS = /\b(how|how's|hows|status|room|floor|target|pnl|p&l|profit|doing|balance|positions?|money|made)\b/;
  const APP_WORDS = [[/\b(zenith|nq|trading|zlarior|atlas|blitz|the bots?)\b/, 'zenith'], [/\b(planner|calendar|plan)\b/, 'planner'], [/\bkalshi\b/, 'kalshi'], [/\b(jarvis|home)\b/, 'home']];
  const usd = D.usd, usd2 = D.usd2, ago = D.ago;
  function answer(raw) {
    const F = getFacts();
    const all = [HOME, ...(F.apps || [])], find = (id) => all.find((a) => a.id === id);
    const q = String(raw || '').toLowerCase().replace(/[’']/g, "'").trim();
    if (!q) return { text: 'Ask me how the bots are doing, what is on today, or say "open planner".' };
    for (const x of all) if (x.extra && q.includes(x.name.toLowerCase()) && (OPEN_WORDS.test(q) || q.split(' ').length <= 2)) return { text: `Opening ${x.name}.`, open: x.id };
    if (OPEN_WORDS.test(q) || (q.split(' ').length <= 2 && !ASK_WORDS.test(q))) {   // "how's blitz" is a question, not "open"
      for (const [re, id] of APP_WORDS) if (re.test(q)) {
        const a = find(id);
        if (!a) continue;
        if (id !== 'home' && !a.url) return { text: `${a.name} is not linked yet. Paste its dashboard link on the ${a.name} card and I will open it here.` };
        return { text: id === 'home' ? 'Here.' : `Opening ${a.name}.`, open: id };
      }
    }
    if (/\bkalshi\b/.test(q)) {
      const k = F.kalshi;
      if (!k) return { text: F.kalshiState === 'error' ? 'I cannot reach the Kalshi feed right now. Try again in a minute.' : 'Kalshi is not connected yet: the Kalshi bot runs only on your PC. Open the Kalshi page for the one step that connects it.' };
      const pos = Array.isArray(k.positions) ? k.positions : [];
      const lines = [`Kalshi${k.mode ? ' (' + String(k.mode).toUpperCase() + ')' : ''}: ${D.kalshiRun(k)[1].toLowerCase()}, balance ${usd2(k.balance)}, today ${usd2(k.today_pnl, true)}${k.week_pnl != null ? `, this week ${usd2(k.week_pnl, true)}` : ''}, ${pos.length} open ${pos.length === 1 ? 'position' : 'positions'}${k.t ? ' (' + ago(k.t) + ')' : ''}.`];
      for (const p of pos.slice(0, 3)) lines.push(`${p.title || p.ticker}: ${String(p.side || '').toUpperCase()} x${p.contracts != null ? p.contracts : '?'}, P&L ${usd2(p.pnl, true)}.`);
      return { text: lines.join('\n') };
    }
    if (/\b(help|what can you|commands?)\b/.test(q)) return { text: 'I can switch dashboards ("open planner", "open Zenith", "Kalshi"), tell you how the bots are doing ("status", "room", "today\'s P&L", "how far to target"), what is on your plan today, and whether the market is open.' };
    if (/\b(market|open|closed?|session|trading hours)\b/.test(q) && !/\b(bot|bots|zlarior|atlas|blitz)\b/.test(q)) return { text: F.market.text + '.' };
    const v = F.live;
    const need = () => (v ? null : { text: F.liveError ? 'I cannot reach the bots\' live feed right now. Open Zenith for everything.' : 'Still loading the bots. Ask me again in a second.' });
    // "how's blitz", "blitz room" ...: BLITZ alone; otherwise every account
    const onlyBz = /\bblitz\b/.test(q) && !/\b(zlarior|atlas|bots|all)\b/.test(q);
    const bz = v && v.blitz, bzOff = bz && (bz.off || bz.room == null);
    const bzWhy = () => (bz ? `BLITZ: ${bz.off ? 'account C is off on the PC (paper only until its own 25K is set up)' : 'its eval is ' + (bz.status || 'not reporting')}.` : 'BLITZ: no account C card in the live feed yet.');
    const pick = (lit, atl, blz) => (onlyBz ? [blz || bzWhy()] : [lit, atl, blz]).filter(Boolean).join('\n');
    if (/\b(room|floor|drawdown|max loss)\b/.test(q)) {
      if (!v) return need();
      return { text: pick(v.lit && v.lit.room != null ? `Zlarior 50K: ${usd(v.lit.room)} of room above the floor (${usd(v.lit.floor)}).` : '', v.atlas && v.atlas.room != null ? `ATLAS 25K: ${usd(v.atlas.room)} of room.` : '',
        bz && !bzOff ? `BLITZ 25K: ${usd(bz.room)} of room above the floor (${usd(bz.floor)}).` : '') || 'No account room to show right now: the bot is not running. Zenith has the details.' };
    }
    if (/\b(target|to go|pass|passing)\b/.test(q)) {
      if (!v) return need();
      return { text: pick(v.lit && v.lit.to_target != null ? `Zlarior: ${usd(v.lit.to_target)} to the target.` : '', v.atlas && v.atlas.to_target != null ? `ATLAS: ${usd(v.atlas.to_target)} to the target.` : '',
        bz && !bzOff && bz.to_target != null ? `BLITZ: ${usd(bz.to_target)} to the target.` : '') || 'No eval target to show right now. Zenith has the details.' };
    }
    if (/\b(p&l|pnl|p and l|profit|made|lost|money|today's)\b/.test(q) && !/\b(plan|schedule|calendar|task)\b/.test(q)) {
      if (!v) return need();
      return { text: pick(v.lit && v.lit.today_pnl != null ? `Zlarior today ${usd(v.lit.today_pnl, true)}${v.lit.week_pnl != null ? `, this week ${usd(v.lit.week_pnl, true)}` : ''}.` : '',
        v.atlas && v.atlas.today_pnl != null ? `ATLAS today ${usd(v.atlas.today_pnl, true)}.` : '',
        bz && !bzOff && bz.today_pnl != null ? `BLITZ today ${usd(bz.today_pnl, true)}${bz.week_pnl != null ? `, this week ${usd(bz.week_pnl, true)}` : ''}.` : '') || 'No P&L to show right now. Zenith has the details.' };
    }
    if (/\b(bot|bots|status|how are|how's|hows|doing|running|armed|zlarior|atlas|blitz|nq)\b/.test(q) && !/\b(today|schedule|plan|task|event)\b/.test(q)) {
      if (!v) return need();
      const bzLine = bz && !bzOff ? `BLITZ 25K: today ${usd(bz.today_pnl, true)}, room ${usd(bz.room)}, ${usd(bz.to_target)} to target${bz.trades_today ? `, ${bz.trades_today} ${bz.trades_today === 1 ? 'trade' : 'trades'} today` : ''}.` : bzWhy();
      if (onlyBz) return { text: [bzLine, bz && bz.waiting && !bzOff ? bz.waiting : '', F.market.text + '.'].filter(Boolean).join('\n') };
      const vd = v.verdict || {}, lines = [`${vd.label || 'Bot status unknown'}${v.t ? ' (' + ago(v.t) + ')' : ''}.`];
      if (vd.reason && !String(vd.label || '').toLowerCase().includes(String(vd.reason).toLowerCase())) lines.push(vd.reason[0].toUpperCase() + vd.reason.slice(1) + '.');
      if (v.lit && v.lit.room != null) lines.push(`Zlarior 50K: today ${usd(v.lit.today_pnl, true)}, room ${usd(v.lit.room)}, ${usd(v.lit.to_target)} to target.`);
      if (v.atlas && v.atlas.room != null) lines.push(`ATLAS 25K: today ${usd(v.atlas.today_pnl, true)}, room ${usd(v.atlas.room)}, ${usd(v.atlas.to_target)} to target.`);
      if (bz) lines.push(bzLine);
      lines.push(F.market.text + '.');
      return { text: lines.join('\n') };
    }
    if (/\b(today|schedule|agenda|plan|calendar|events?|tasks?|to ?do|on my plate|busy)\b/.test(q)) {
      const p = F.planner;
      if (!p) return { text: 'I cannot see your Planner here yet. Open it once inside Jarvis (connect its sync if it asks) and I will read your day.' };
      if (!p.ev.length && !p.tasks.length) return { text: 'Nothing on your plan today.' };
      const lines = p.ev.slice(0, 6).map((e) => `${e.allDay ? 'All day' : D.hm(e.start)}: ${e.title}`);
      if (p.tasks.length) lines.push(`${p.tasks.length} open ${p.tasks.length === 1 ? 'task' : 'tasks'}: ${p.tasks.slice(0, 4).map((t) => t.title).join(', ')}${p.tasks.length > 4 ? '…' : ''}`);
      return { text: lines.join('\n') };
    }
    if (/\b(hi|hello|hey|yo|sup)\b/.test(q)) return { text: `${D.greeting(F.now)}. ${F.market.text}. Ask me about the bots or your day.` };
    if (/\b(time|date|day is it)\b/.test(q)) return { text: D.whenLine(F.now).split(' · ').slice(0, 2).join(', ') + '.' };
    return { text: 'I can switch dashboards and tell you how the bots and your day look. Try "how are the bots", "what\'s on today" or "open planner".' };
  }
  return {
    fallback: true,
    smart: null,
    async ask(text) { return answer(text); },
    async briefing() {
      const F = getFacts(), v = F.live, lines = [`${D.greeting(F.now)}. ${F.market.text}.`];
      if (v && v.verdict && v.verdict.label) lines.push(`Bots: ${v.verdict.label}.`);
      const p = F.planner;
      if (p) lines.push(p.ev.length || p.tasks.length ? `Today: ${p.ev.length} ${p.ev.length === 1 ? 'event' : 'events'}, ${p.tasks.length} open ${p.tasks.length === 1 ? 'task' : 'tasks'}.` : 'Nothing on your plan today.');
      return { text: lines.join('\n') };
    },
    suggestions() { return ['How are the bots?', "What's on today?", 'Is the market open?', 'Open Zenith']; },
    setSmart() { return false; },
  };
}
const brainDeps = { getFacts: D.getFacts, open: (id, route) => openSoon(route ? { id, route } : id), now: () => new Date() };
const builtinBrain = fallbackBrain(brainDeps);
let brain = builtinBrain;
ready.brain.then((m) => {
  if (!m) return;
  try { const b = m.createBrain(brainDeps); if (!b || typeof b.ask !== 'function') throw new Error('no ask'); brain = b; root.dataset.brain = 'module'; }
  catch (_) { brain = builtinBrain; root.dataset.brain = 'fallback'; }
  renderSugs();
});
function renderSugs() {
  let s = null;
  try { s = brain.suggestions(); } catch (_) { s = null; }
  if (!Array.isArray(s) || !s.length) s = builtinBrain.suggestions();
  $('#sugs').innerHTML = s.slice(0, 5).map((x) => `<button class="sug" type="button" data-say="${esc(x)}">${esc(x)}</button>`).join('');
}
async function think(text) {                           // the brain's answer; any error or a 25 s silence = the built-in answer
  try {
    const r = await within(Promise.resolve().then(() => brain.ask(text)), 25e3);
    if (r && typeof r.text === 'string' && r.text) return r;
  } catch (_) { /* fall through */ }
  return builtinBrain.ask(text);
}

// ------------------------------------------------------------------ the conversation
const say = (who, text) => {
  const t = $('#talk');
  const m = document.createElement('div'); m.className = 'msg ' + who; m.textContent = text; t.appendChild(m);
  while (t.children.length > 8) t.removeChild(t.firstChild);
  return m;
};
function sayCards(cards) {
  if (!Array.isArray(cards) || !cards.length) return;
  const box = document.createElement('div'); box.className = 'msg-cards';
  box.innerHTML = cards.slice(0, 4).map((c) => typeof c === 'string' ? `<div class="card"><p class="muted">${esc(c)}</p></div>`
    : `<div class="card">${c.title ? `<div class="card-h"><div><b>${esc(c.title)}</b>${c.sub ? `<small>${esc(c.sub)}</small>` : ''}</div></div>` : ''}${genericCard(c)}</div>`).join('');
  $('#talk').appendChild(box);
  while ($('#talk').children.length > 8) $('#talk').removeChild($('#talk').firstChild);
}
function speak(text) {
  if (!S.voice() || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(String(text).replace(/\n/g, '. ')); u.rate = 1.03;
    u.onend = u.onerror = () => setCore('idle');
    speechSynthesis.cancel(); setCore('speaking'); speechSynthesis.speak(u);
  } catch (_) { setCore('idle'); }
}
async function ask(text, voice = false) {
  const t = String(text || '').trim();
  if (!t) return;
  say('me', t);
  setCore('thinking');
  // nothing loaded yet for what is asked: fetch it first (an answer from data that is still loading would be wrong)
  const F = D.getFacts();
  if (/\bkalshi\b/i.test(t) && !F.kalshi) await D.refreshKalshi();
  else if (/\b(bot|bots|room|target|p&l|pnl|profit|status|zlarior|atlas|blitz)\b/i.test(t) && !(F.live && !F.live.cached)) await within(D.refreshLive(), 9000);
  else await new Promise((ok) => setTimeout(ok, 220));
  const r = await think(t);
  say('j', r.text);
  sayCards(r.cards);
  if (voice) speak(r.speak || r.text); else setCore('idle');
  if (r.open) openSoon(r.open);
}
$('#ask').addEventListener('submit', (e) => { e.preventDefault(); const q = $('#q'); ask(q.value); q.value = ''; });

// voice: the phone's own speech recognition when it has one
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function setupMic() { $('#mic').hidden = !(SR && S.voice()); }
$('#mic').addEventListener('click', () => {
  if (!SR) return;
  const mic = $('#mic');
  if (rec) { try { rec.stop(); } catch (_) { /* already stopped */ } return; }
  try {
    rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => { const t = e.results && e.results[0] && e.results[0][0] ? e.results[0][0].transcript : ''; if (t) ask(t, true); };
    rec.onend = () => { rec = null; mic.classList.remove('on'); if (coreState === 'listening') setCore('idle'); };
    rec.onerror = () => { rec = null; mic.classList.remove('on'); setCore('idle'); };
    mic.classList.add('on'); setCore('listening'); rec.start();
  } catch (_) { rec = null; mic.classList.remove('on'); setCore('idle'); say('j', 'Voice is not available here. Type instead.'); }
});

// ------------------------------------------------------------------ add / remove dashboards (apps.js, else kept on this phone)
const appsApi = () => mods.apps || D.fallbackApps;
function renderMine(el) {
  const rows = D.listApps().filter((a) => !a.builtIn && (a.extra || a.removable || !['zenith', 'planner', 'kalshi'].includes(a.id)));
  const links = D.LS.get('jarvis.links', {}) || {};
  const linked = Object.keys(links).filter((id) => links[id] && ['zenith', 'planner', 'kalshi'].includes(id) && !rows.find((r) => r.id === id)).map((id) => ({ id, name: (byId(id) || { name: id }).name, url: links[id] }));
  el.innerHTML = [...linked, ...rows].map((r) => `<div><b>${esc(r.name)}</b><span>${esc(r.url || '')}</span><button type="button" data-rm="${esc(r.id)}">Remove</button></div>`).join('')
    || '<p class="note">Zenith, Planner and Kalshi are built in. Add any other dashboard with its link.</p>';
}
function renderSettingsApps() { if (!$('#settings').hidden) renderMine($('#setApps')); if (!$('#sheet').hidden) renderMine($('#mine')); }
function openSheet() { $('#settings').hidden = true; $('#addErr').textContent = ''; renderMine($('#mine')); $('#sheet').hidden = false; setTimeout(() => $('#addName').focus(), 30); }
async function removeApp(id) {
  try { await appsApi().removeApp(id); } catch (_) { /* nothing to remove */ }
  if (appsApi() !== D.fallbackApps) D.fallbackApps.removeApp(id);   // a link pasted before apps.js existed
  if (frames[id]) { frames[id].remove(); delete frames[id]; }
  if (active === id) show('home');
  renderSettingsApps(); renderBar(); renderCards();
}
$('#addX').addEventListener('click', () => { $('#sheet').hidden = true; });
for (const sh of ['#sheet', '#settings']) $(sh).addEventListener('click', (e) => {
  if (e.target === $(sh)) $(sh).hidden = true;
  const rm = e.target.closest('[data-rm]');
  if (rm) removeApp(rm.dataset.rm);
});
$('#addF').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('#addName').value.trim().slice(0, 24), url = D.okUrl($('#addUrl').value.trim());
  if (!name) { $('#addErr').textContent = 'Give it a name.'; return; }
  if (!url) { $('#addErr').textContent = 'Paste a full link that starts with https://'; return; }
  let added = null;
  try { added = await appsApi().addApp({ name, url }); } catch (err) { $('#addErr').textContent = String((err && err.message) || 'Could not add it.'); return; }
  const id = (added && added.id) || (D.listApps().find((a) => a.name === name) || {}).id;
  $('#addName').value = ''; $('#addUrl').value = '';
  $('#sheet').hidden = true; renderBar(); renderCards();
  if (id) show(id);
});

// ------------------------------------------------------------------ settings: voice, smart mode (own key, this phone only), apps
function smartInfo() { try { return brain.smart || null; } catch (_) { return null; } }
function openSettings() {
  $('#sheet').hidden = true;
  $('#setVoice').checked = S.voice();
  const sm = smartInfo(), can = !brain.fallback && typeof brain.setSmart === 'function';
  $('#setSmart').checked = !!(sm && sm.on);
  $('#setSmart').disabled = !can; $('#setKey').disabled = !can; $('#setModel').disabled = !can; $('#setForget').disabled = !can;
  $('#setKey').value = ''; $('#setModel').value = (sm && sm.model) || '';
  $('#smartState').textContent = !can ? 'Smart mode comes with the new Jarvis brain; this copy answers with its built-in rules.'
    : sm && (sm.hasKey || sm.key) ? 'A key is saved on this phone. Paste a new one to replace it.' : 'No key saved yet.';
  const st = (n) => root.dataset[n] === 'module' || mods[n] ? 'on' : 'built-in fallback';
  $('#modNote').textContent = `Parts: brain ${st('brain')} · centerpiece ${st('core')} · apps ${st('apps')} · Zenith mode ${st('zenith')}`;
  renderMine($('#setApps'));
  $('#settings').hidden = false;
}
$('#setX').addEventListener('click', () => { $('#settings').hidden = true; });
$('#setAdd').addEventListener('click', () => openSheet());
$('#setForget').addEventListener('click', () => {
  try { brain.setSmart({ key: '', on: false }); } catch (_) { /* nothing saved */ }
  $('#setSmart').checked = false; $('#smartState').textContent = 'Key removed from this phone.';
});
$('#setF').addEventListener('submit', (e) => {
  e.preventDefault();
  D.LS.set('jarvis.voice', $('#setVoice').checked);
  setupMic();
  if (!brain.fallback && typeof brain.setSmart === 'function') {
    const opt = { on: $('#setSmart').checked };
    const key = $('#setKey').value.trim(), model = $('#setModel').value.trim();
    if (key) opt.key = key;
    if (model) opt.model = model;
    try { brain.setSmart(opt); } catch (_) { /* the brain keeps its old setting */ }
  }
  $('#setKey').value = '';
  $('#settings').hidden = true;
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#sheet').hidden = true; $('#settings').hidden = true; } });

// ------------------------------------------------------------------ apps.js, when it is here
ready.apps.then((m) => {
  if (!m) return;
  D.setAppsSource(m); root.dataset.apps = 'module';
  renderBar(); if (active === 'home') { renderCards(); refreshStatusCards(); }
});

// ------------------------------------------------------------------ start
greet();
renderBar();
renderSugs();
setupMic();
if (location.hash) history.replaceState(null, '', location.pathname + location.search);
show('home');
clearTimeout(window.__jarvisBoot); const bootNote = document.getElementById('boot'); if (bootNote) bootNote.remove();
root.dataset.ready = '1';
setInterval(() => { if (document.visibilityState === 'visible' && active === 'home') { greet(); D.refresh({ maxAge: 60e3 }); } }, 30e3);
document.addEventListener('visibilitychange', () => {
  root.classList.toggle('paused', document.visibilityState !== 'visible');
  if (document.visibilityState === 'visible' && active === 'home') refreshHome();
});
window.__jarvis = { show, ask, facts: D.getFacts, active: () => active };   // for tests and the console; read-only
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { /* works without it */ });
</script>
