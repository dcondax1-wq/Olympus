<!doctype html><!-- PRIVATE test harness for the heat view (deleted after testing): dev_heat.html?view=heat&h=340&level=max|lite
  Options: &year=2026|all  &empty=1  &sparse=1 (6 cells)  &junk=1 (malformed cells mixed in)  &seq=1 (changed data after 4 s, same data after 7 s)
           &ff=<s> (fast-forward the view's clock)  &fxfixed (full res in a software GPU) -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx dev heat</title>
<style>
  :root { --page:#07080c; --accent:#6d7cff; --accent-2:#3ee0c8; --good:#2ee59d; --bad:#ff5a7a; --bsl:#ff9b5c; --ssl:#6d9bff; }
  html,body{margin:0;background:#07080c;color:#eef1f8;font:14px Inter,system-ui,sans-serif}
  .box{position:relative;margin:16px;border-radius:18px;overflow:hidden;border:1px solid rgba(160,170,220,.12);background:#0b0d14;z-index:1}
  .fx-canvas{display:block}
  #log{position:fixed;bottom:0;left:0;right:0;font:11px monospace;color:#f88;white-space:pre-wrap;z-index:5}
</style></head><body>
<div class="box" id="box"></div><div id="log"></div>
<script type="module">
const q = new URLSearchParams(location.search), view = 'heat';
const box = document.getElementById('box'); box.style.height = (q.get('h') || 340) + 'px';
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
window.onerror = (m) => log(m);
const FX = await import('../fx_heat.js?' + Date.now());
FX.init({ level: q.get('level') || 'max' });
const D = await (await fetch('./dev-data.json')).json();
const rng = (s = 7) => () => (s = (s * 16807) % 2147483647) / 2147483647;
const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', hour12: false });
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
function heat(alt) {
  const yr = q.get('year') || '2026', cells = new Map(), R = rng(alt ? 11 : 5);
  for (const t of (D.trades || [])) {
    if (yr !== 'all' && !t.day.startsWith(yr)) continue;
    const parts = fmt.formatToParts(new Date(t.entry_t * 1000));
    const dow = DOW.indexOf(parts.find((p) => p.type === 'weekday').value), hour = +parts.find((p) => p.type === 'hour').value;
    if (dow < 0) continue;
    const k = dow + '|' + hour, c = cells.get(k) || { dow, hour, n: 0, sumr: 0, net: 0 };
    c.n++; c.sumr += t.r; c.net += t.pnl; cells.set(k, c);
  }
  let out = [...cells.values()].map((c) => ({ dow: c.dow, hour: c.hour, n: c.n, avg_r: +(c.sumr / c.n).toFixed(3), net: Math.round(c.net) }));
  if (alt) {   // changed data: some cells gone, the rest reshaped, one new lunch-hour cell
    out = out.filter((c, i) => i % 4 !== 1).map((c) => ({ ...c, n: Math.max(1, Math.round(c.n * (0.5 + R()))), avg_r: +(c.avg_r + (R() - 0.5)).toFixed(2), net: Math.round(c.net * (R() * 2 - 0.4)) }));
    out.push({ dow: 2, hour: 12, n: 3, avg_r: 0.4, net: 900 });
  }
  if (q.get('sparse') === '1') out = out.slice(0, 6);
  if (q.get('junk') === '1') out.push(null, 'x', { dow: 7, hour: 10, n: 5 }, { dow: 1, hour: 17, n: 5 }, { dow: '3', hour: '14', n: '4', avg_r: 'nan', net: null }, { dow: 0, hour: 9, n: 0 });
  return { cells: out, label: yr === 'all' ? '2021-26' : yr };
}
const make = (alt) => (q.get('empty') === '1' ? { cells: [], label: '2026' } : heat(alt));
window.__picked = null;
const onPick = (row) => { window.__picked = row; log('picked ' + JSON.stringify(row).slice(0, 160)); };
window.__ff = (sec) => { const v = window.__view; if (v?.update) for (let i = 0; i < sec * 10; i++) v.update(0, 0.1); };
window.__mount = (data) => { const v = FX.mount('dev-' + view, box, view, data, { onPick }); window.__view = v; return v; };
window.__view = window.__mount(make(false));
if (q.get('ff')) window.__ff(+q.get('ff'));
window.__FX = FX;
if (q.get('seq') === '1') {
  setTimeout(() => { window.__mount(make(true)); window.__seq = 1; }, 4000);
  setTimeout(() => {
    const v = window.__view, before = v.sig, busy0 = !!v.animating;
    window.__mount(make(true)); window.__seq = 2;
    log(`same-data remount: sig ${v.sig === before ? 'unchanged' : 'CHANGED'}, busy before ${busy0} after ${!!v.animating}`);
  }, 7000);
}
window.__ready = true;
</script></body></html>
