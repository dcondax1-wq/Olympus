<!doctype html><!-- Test harness for one 3D view: dev.html?view=<kind>&h=360&level=max|lite
  kinds: orb galaxy city candles liqmap heat weekring (real data) and constellation ribbon reactor pipeline losses jarvis newsradar montecarlo
  (synthetic data built from it); view=none: only the background field (try &scene=lab, and click the page for a ripple).
  Needs dev-data.json (gitignored): python tools/build_web_dashboard.py --state dash/state.json --out <dir>, copy <dir>/data.json here,
  then serve tools/web_public (python -m http.server 8797) and open http://127.0.0.1:8797/fx/dev.html. devshot.js screenshots it.
  Options: &year=2026|all (galaxy)  &runs=1|37|150|real (constellation; real = ./dev-runs.json)  &ser=1|2 &span=2026|all (ribbon)
           &bal= &floor= &day= &status= &locked=1 (reactor)  &idx=-1..4 &live=0|1 &kz=0|1 (pipeline)  &empty=1 (no data)
           &state=idle|listening|thinking|speaking &lvl=0..1 &cold=1 &pnl= &live=0 &text= &cycle=<ms>|0 (jarvis; cycles the four states, default 3000 ms)
           &n=3|40 &now=<unix s> (newsradar; synthetic USD events around now)  &paths=300|1000 &noprob=1 (montecarlo; random-walk evals)
           &span=2026|all (heat; the replay trades aggregated by ET weekday x hour)  &pos=long|short|0 &rich=1 (liqmap; rich = labelled synthetic pools)
           &now=<unix s> (weekring; default: the week of the last replay trade, Thursday 10:42 ET)
           &now=<unix s> &trade=0|win|loss|open &setup=1 &closed=1 (dayclock; default: a Tuesday 08:47 ET with CPI at 08:30 and a London trade)
           &seq=1 (re-mount with changed data after 4 s, then the same data again after 7 s: animation + idempotency)
           &ff=<s> (fast-forward the view's clock by s seconds after each mount: finished intros in a slow software GPU)
           &bg=0 (hide the full-screen background field: faster in a software GPU)  &scene=<name> (FX.scene preset)  &fxfixed (full res in a software GPU) -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx dev</title>
<style>
  :root { --page:#07080c; --accent:#6d7cff; --accent-2:#3ee0c8; --good:#2ee59d; --bad:#ff5a7a; --bsl:#ff9b5c; --ssl:#6d9bff; }
  html,body{margin:0;background:#07080c;color:#eef1f8;font:14px Inter,system-ui,sans-serif}
  .box{position:relative;margin:16px;border-radius:18px;overflow:hidden;border:1px solid rgba(160,170,220,.12);background:#0b0d14}
  .fx-canvas{display:block}
  .fx-bg{position:fixed;inset:0;z-index:0;pointer-events:none}.fx-bg .fx-canvas{width:100%!important;height:100%!important}
  .box{z-index:1}
  #log{position:fixed;bottom:0;left:0;right:0;font:11px monospace;color:#f88;white-space:pre-wrap;z-index:5}
</style><script src="../olympus/gate-nav.js?v=g9" defer></script><!-- ORGANIZE 2026-11-21: back + Home + arena breadcrumb on every page -->
</head><body>
<div class="box" id="box"></div><div id="log"></div>
<script type="module">
const q = new URLSearchParams(location.search), view = q.get('view') || 'galaxy';
const box = document.getElementById('box'); box.style.height = (q.get('h') || 360) + 'px';
if (view === 'none') box.style.display = 'none';   // the background field only (scenes, ripples: click the page)
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
window.onerror = (m) => log(m);
const FX = await import('../fx.js?' + Date.now());
FX.init({ level: q.get('level') || 'max' });
if (q.get('scene') && FX.scene) FX.scene(q.get('scene'));
if (q.get('bg') === '0') document.querySelector('.fx-bg')?.style.setProperty('display', 'none');
const D = await (await fetch('./dev-data.json')).json();
// deterministic RNG for the synthetic data
const rng = (s = 7) => () => (s = (s * 16807) % 2147483647) / 2147483647;

// ---------------------------------------------------------------- constellation: baseline + variants (+ synthetic runs)
const BASE = { id: 'baseline', title: 'Live strategy (locked 2026-10-17)', family: 'baseline', status: 'baseline', pf26: 3.48, pf21: 1.09,
  net26: 20111, net21: 6491, tpw26: 2.16, tpw21: 3.17, dd21: -11401, p20_21: 8.8, f20_21: 9.6 };
const FAMS = ['risk', 'stops', 'targets', 'management', 'bias', 'filters', 'timing', 'other'];
const famOf = (n) => /fixed|stop|wide/i.test(n) ? 'stops' : /risk|size|derisk|half|kelly/i.test(n) ? 'risk' : /target|tp|draw|pool|5r/i.test(n) ? 'targets'
  : /be|trail|time|giveback|partial/i.test(n) ? 'management' : /bias|htf|trend/i.test(n) ? 'bias' : /filter|skip|cold|vix|grade/i.test(n) ? 'filters'
  : /kz|session|hour|am|pm|killzone/i.test(n) ? 'timing' : 'other';
function runs(n, seed = 3) {
  const R = rng(seed), out = [BASE];
  if (n <= 1) return out;
  const st = ['rejected', 'rejected', 'rejected', 'promising', 'info', 'adopt-candidate', 'rejected', 'promising'];
  for (const v of (D.variants?.rows || [])) {
    if (out.length >= n) break;
    const a = v.y2026 || {}, b = v.y5 || {};
    if (!(a.pf > 0) || !(b.pf > 0)) continue;
    out.push({ id: 'v' + out.length, title: v.name, family: famOf(v.name), status: st[out.length % st.length], pf26: a.pf, pf21: b.pf, net26: a.net, net21: b.net,
      tpw26: a.tpw, tpw21: b.tpw, dd21: b.dd, p20_21: b.p20, f20_21: b.f20 });
  }
  while (out.length < n) {
    const i = out.length, good = R() < 0.12, fam = FAMS[(R() * FAMS.length) | 0];
    const pf26 = Math.max(0.5, 3.48 * Math.exp((R() - 0.62) * 0.9 + (good ? 0.25 : 0))), pf21 = Math.max(0.55, 1.09 * Math.exp((R() - 0.55) * 0.5 + (good ? 0.12 : 0)));
    const status = good && pf26 > 3.48 && pf21 > 1.09 ? 'adopt-candidate' : pf26 > 3.2 && pf21 > 1.05 ? 'promising' : R() < 0.1 ? 'info' : 'rejected';
    out.push({ id: 'r' + i, title: `${fam} variant #${i}: ${['tighter', 'wider', 'later', 'earlier', 'skip Mondays', 'half size', '2 trades a day'][i % 7]}`, family: fam, status,
      pf26: +pf26.toFixed(2), pf21: +pf21.toFixed(2), net26: Math.round((pf26 - 1) * 9000), net21: Math.round((pf21 - 1) * 60000), tpw26: +(1.2 + R() * 2.4).toFixed(2),
      tpw21: +(1.4 + R() * 2.6).toFixed(2), dd21: -Math.round(6000 + R() * 12000), p20_21: +(R() * 25).toFixed(1), f20_21: +(R() * 30).toFixed(1) });
  }
  return out;
}
// ---------------------------------------------------------------- ribbon: the baseline's days + a perturbed variant
function ribbon(nser, span, seed = 5) {
  const R = rng(seed);
  let days = (D.results?.days || []).map((d) => [d[0], d[1]]);
  if (span !== 'all') days = days.filter((d) => d[0].startsWith(span || '2026'));
  const variant = days.map(([dt, p]) => [dt, p ? Math.round(p * (R() < 0.12 ? 0 : 0.75 + R() * 0.7) + (R() - 0.5) * 30) : 0]);
  const s = [{ label: 'Full risk up to a 30-pt stop', color: '#22d3ee', days: variant }, { label: 'Baseline', color: '#ffd98a', days }];
  return { series: s.slice(0, nser) };
}
// ---------------------------------------------------------------- the rest
const ev = D.live?.eval || {};
const reactor = () => ({ balance: +(q.get('bal') ?? ev.balance ?? 50000), start: 50000, target: 53000, floor: +(q.get('floor') ?? ev.trailing_mll ?? 48000),
  locked: q.get('locked') === '1', dayPnl: +(q.get('day') ?? 0), dayLimit: 1000, status: q.get('status') || 'OPEN' });
const pipeline = () => ({ steps: ['Sweep', 'IFVG', 'Order', 'Trade', 'Done'], idx: +(q.get('idx') ?? 1), live: q.get('live') !== '0', killzone: q.get('kz') !== '0' });
function losses(seed = 9) {
  const R = rng(seed);
  return { trades: (D.trades || []).filter((t) => t.r < -0.05).map((t) => {
    const mfe = +(t.mfe ?? 0), kind = mfe < 0.35 ? 'never worked' : mfe >= 0.8 ? 'gave back' : t.risk_pts >= 45 ? 'wide stop' : 'normal';
    return { r: t.r, mfe, mae: +Math.max(-t.r, 0.2 + R() * 0.9).toFixed(2), risk_pts: t.risk_pts, day: t.day, kind: R() < 0.02 ? 'odd one' : kind };
  }) };
}
const empty = q.get('empty') === '1';
// ---------------------------------------------------------------- newsradar: synthetic USD events around `now` (&n=3|40, &now=<unix s>)
const NOW = q.has('now') ? +q.get('now') : Math.floor(Date.now() / 1000);
function newsradar(alt, seed = 21) {
  const R = rng(seed), n = +(q.get('n') || 3), H = 3600;
  const base = [
    { t: NOW + 25 * 60, title: 'CPI (Sep)', impact: 'high', kind: 'cpi', source: 'BLS', forecast: '3.0%', previous: '2.9%' },
    { t: NOW + 2 * H + 10 * 60, title: 'Initial jobless claims', impact: 'medium', kind: 'claims', source: 'DOL', forecast: '225k', previous: '219k' },
    { t: NOW + 4 * H, title: '10-year note auction', impact: 'low', kind: 'auction', source: 'Treasury' },
    { t: NOW - 2 * H, title: 'GDP q/q (adv)', impact: 'high', kind: 'gdp', source: 'BEA', actual: '2.8%', forecast: '2.6%', previous: '3.0%', surprise: 0.2 },
    { t: NOW + 6 * H + 30 * 60, title: 'Fed Chair speaks', impact: 'high', kind: 'speaker', source: 'Fed' },
    { t: NOW + 26 * H, title: 'Core PCE m/m', impact: 'high', kind: 'pce', source: 'BEA', forecast: '0.2%', previous: '0.3%' },
    { t: NOW + 30 * H, title: 'Nonfarm payrolls', impact: 'high', kind: 'nfp', source: 'BLS', forecast: '150k', previous: '142k' },
    { t: NOW + 9 * H, title: 'FOMC minutes', impact: 'high', kind: 'fomc', source: 'Fed' },
    { t: NOW - 9 * H, title: 'too old (dropped)', impact: 'low', kind: 'other' },
  ];
  const KINDS = ['cpi', 'nfp', 'fomc', 'pce', 'gdp', 'claims', 'auction', 'speaker', 'other'], IMP = ['high', 'medium', 'low'];
  const ev = base.slice(0, n >= 8 ? base.length : n);
  while (ev.length < n) { const i = ev.length, k = KINDS[(R() * KINDS.length) | 0]; ev.push({ t: NOW + Math.round((R() * 46 - 4) * H), title: `${k.toUpperCase()} event #${i}`, impact: IMP[(R() * 3) | 0], kind: k, source: ['BLS', 'Fed', 'Treasury', 'BEA', 'ISM'][i % 5] }); }
  if (alt) { ev.splice(1, 1); ev.push({ t: NOW + 45 * 60, title: 'Retail sales m/m', impact: 'medium', kind: 'other', source: 'Census', forecast: '0.3%' }); }
  const o = Math.floor(NOW / 86400) * 86400;   // today's cash session in UTC (09:30-16:00 EDT)
  return { now: NOW, events: ev, session: { open: o + 13.5 * H, close: o + 20 * H } };
}
// ---------------------------------------------------------------- montecarlo: random-walk MFFU evals (&paths=300|1000, &noprob=1)
function montecarlo(alt, seed = 31) {
  const R = rng(seed + (alt ? 2 : 0)), n = +(q.get('paths') || 300), paths = [];
  for (let i = 0; i < n; i++) {
    const days = [50000]; let b = 50000, floor = 48000, result = 'OPEN';
    for (let s = 1; s <= 60; s++) {
      const trade = R() < 0.45, pnl = trade ? (R() < 0.42 ? 400 + R() * 1400 : -(200 + R() * 450)) : 0;
      b = Math.round(b + pnl); days.push(b); floor = Math.max(floor, b - 2000);
      if (b >= 53000) { result = 'PASS'; break; } if (b <= floor) { result = 'FAIL'; break; }
    }
    paths.push({ days, result, days_n: days.length });
  }
  const sh = (f) => Math.round(paths.filter(f).length / n * 1000) / 10;
  const prob = q.get('noprob') === '1' ? undefined : { pass_2w: sh((p) => p.result === 'PASS' && p.days_n <= 10), fail_2w: sh((p) => p.result === 'FAIL' && p.days_n <= 10),
    pass_3w: sh((p) => p.result === 'PASS' && p.days_n <= 15), pass_4w: sh((p) => p.result === 'PASS' && p.days_n <= 20), pass_6w: sh((p) => p.result === 'PASS' && p.days_n <= 30), open_60: sh((p) => p.result === 'OPEN') };
  return { paths, start: 50000, target: 53000, maxLoss: 2000, prob };
}
// ---------------------------------------------------------------- heat: the replay trades by ET weekday x entry hour (&span=2026|all)
const ETF = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', hourCycle: 'h23' });
function heat(alt) {
  const span = q.get('span') || '2026', cells = new Map();
  for (const t of (D.trades || [])) {
    if (span !== 'all' && !t.day.startsWith(span)) continue;
    if (alt && t.pnl < -300) continue;                       // alt: drop the big losers -> bars shrink / turn green, some vanish
    const P = {}; for (const p of ETF.formatToParts(new Date(t.entry_t * 1000))) P[p.type] = p.value;
    const dow = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].indexOf(P.weekday), hour = +P.hour; if (dow < 0) continue;
    const k = dow + '|' + hour, c = cells.get(k) || { dow, hour, n: 0, net: 0, sumR: 0 };
    c.n++; c.net += t.pnl; c.sumR += t.r; cells.set(k, c);
  }
  return { label: span === 'all' ? '5 years' : span, cells: [...cells.values()].map((c) => ({ dow: c.dow, hour: c.hour, n: c.n, avg_r: +(c.sumR / c.n).toFixed(3), net: Math.round(c.net) })) };
}
// ---------------------------------------------------------------- liqmap: the live pools / bars / price (&pos=long|short|0, &rich=1)
function liqmap(alt) {
  const L = D.live || {}, price = +(L.price || 0) + (alt ? 18.5 : 0), bars = (L.bars || []).slice(-40);
  let pools = (L.pools || []).map((p) => ({ ...p, dist: +(p.price - price).toFixed(2) }));
  if (q.get('rich') === '1') pools = [[39.5, 'H', 'PDH', 3], [12.25, 'H', '1H swing', 1], [88, 'H', 'ONH', 2], [160.5, 'H', 'Asia H', 1], [410, 'H', 'WH', 3],
    [-21.75, 'L', 'ITL', 1], [-62, 'L', 'ONL', 2], [-118.25, 'L', 'PDL', 3], [-240, 'L', 'Asia L', 1], [-520, 'L', 'WL', 2]].map(([d, s, l, st]) => ({ price: +(price + d).toFixed(2), side: s, label: l, strength: st, dist: d }));
  if (alt) pools = pools.filter((p, i) => i !== 1).concat([{ price: +(price + 7.75).toFixed(2), side: 'H', label: 'new 5m high', strength: 1, dist: 7.75 }]);
  const pm = q.get('pos'), position = !pm || pm === '0' ? null : pm === 'short' ? { dir: 'short', entry: price + 4, stop: price + 36, target: price - 92 } : { dir: 'long', entry: price - 3, stop: price - 29, target: price + 75 };
  return { price, pools, bars, position };
}
// ---------------------------------------------------------------- weekring: the week of the last replay trade (&now=<unix s>)
function weekring(alt) {
  const T = (D.trades || []).slice().sort((a, b) => a.entry_t - b.entry_t), last = T[T.length - 1];
  const dowOf = (day) => (new Date(day + 'T12:00:00Z').getUTCDay() + 6) % 7;
  const mon = new Date(last.day + 'T12:00:00Z'); mon.setUTCDate(mon.getUTCDate() - dowOf(last.day));
  const dates = [0, 1, 2, 3, 4].map((i) => { const d = new Date(mon); d.setUTCDate(d.getUTCDate() + i); return d.toISOString().slice(0, 10); });
  const now = q.has('now') ? +q.get('now') : last.entry_t + 3 * 3600 + 7 * 60;
  const days = dates.map((date, dow) => { const tr = T.filter((t) => t.day === date && t.entry_t <= now).map((t) => ({ r: t.r, pnl: t.pnl, t: t.entry_t, side: t.side.toLowerCase(), exit: t.exit }));
    if (alt && dow === 1) tr.push({ r: 2.1, pnl: 640, t: Date.parse(date + 'T14:04:00Z') / 1000, side: 'long', exit: 'TARGET' });   // Tue 10:04 ET
    return { date, dow, trades: tr, pnl: tr.reduce((s, x) => s + x.pnl, 0), sessions_done: date < dates[Math.min(4, Math.floor((now - mon.getTime() / 1000) / 86400))] }; });
  return { days, now, target_week_trades: [2, 4] };
}
// ---------------------------------------------------------------- dayclock: a synthetic LIT day (&now=<unix s>, &trade=, &setup=1, &closed=1)
function dayclock(alt) {
  const base = Date.parse('2026-10-13T12:47:00Z') / 1000, now = q.has('now') ? +q.get('now') : base + (alt ? 3 * 3600 : 0);   // Tue 08:47 ET (EDT)
  const at = (h, m = 0) => Date.parse('2026-10-13T00:00:00Z') / 1000 + (h + 4) * 3600 + m * 60;      // ET time on Oct 13
  const tr = q.get('trade') || 'win', trades = tr === '0' ? [] : [{ t: at(3, 41), exit_t: tr === 'open' ? null : at(tr === 'loss' ? 5 : 7, 12), dir: -1, pnl: tr === 'loss' ? -412 : 1830, r: tr === 'loss' ? -1.02 : 4.4, open: tr === 'open', exit: tr === 'loss' ? 'STOP' : 'TARGET' }];
  const events = [{ t: at(8, 30), title: 'CPI (Sep)', impact: 'high', blackout: true }, { t: at(10, 0), title: 'Consumer sentiment', impact: 'medium' }, { t: at(13, 0), title: '10-year note auction', impact: 'low' },
    { t: at(14, 0), title: 'Fed speaker', impact: alt ? 'high' : 'medium' }];
  return { now, day: '2026-10-13', closed: q.get('closed') === '1' ? true : undefined, windows: [[120, 930]], flat: 955,
    boxes: [{ key: 'asia', label: 'Asia', a: 1200, b: 1440, kind: 'asia', hi: 30212.5, lo: 30088.25, hiTaken: true }, { key: 'fra', label: 'Frankfurt', a: 120, b: 180, kind: 'london', hi: 30240, lo: 30150.5, hiTaken: true },
      { key: 'lon', label: 'London 03-04', a: 180, b: 240, kind: 'london', hi: 30262.75, lo: 30160 }, { key: 'pre', label: 'Premarket', a: 240, b: 570, kind: 'pre', hi: 30262.75, lo: 30010.25 },
      { key: 'ny89', label: 'NY 08-09', a: 480, b: 540, kind: 'ny', hi: 30080, lo: 30010.25, loTaken: !!alt }, { key: 'rth', label: 'Cash session', a: 570, b: 960, kind: 'rth' }],
    events, blackouts: [[at(8, 25), at(8, 40)]], trades, setup: q.get('setup') === '1' ? { t: at(8, 42), expires_t: at(9, 12), dir: 1, label: 'swept NY 08-09 low' } : null, open18: 30150.25, vixMove: 312.4 };
}
// jarvis: one payload per state (the caption is what the bot would say in that state)
const JTEXT = { idle: 'Watching NQ. No sweep yet today.', listening: 'Listening…', thinking: 'Checking the 09:30 killzone and the nearest major pool…',
  speaking: 'Asia high swept at 09:41. Waiting for the IFVG trigger; stop 32 points, size 2 micros.' };
const jarvis = (state) => ({ state, level: q.has('lvl') ? +q.get('lvl') : null, text: q.get('text') ?? JTEXT[state] ?? null,
  mood: { cold: q.get('cold') === '1', pnl: +(q.get('pnl') ?? 640), live: q.get('live') !== '0' } });
// &runs=real: a constellation payload from ./dev-runs.json (not in the repo: devshot's "route" option serves one from disk)
const REAL = q.get('runs') === 'real' ? await (await fetch('./dev-runs.json')).json().catch(() => null) : null;
const make = (alt) => ({
  galaxy: () => (D.trades || []).filter(t => q.get('year') === 'all' || t.day.startsWith(q.get('year') || '2026')).slice(alt ? 10 : 0),
  city: () => D.results.months,
  orb: () => ({ bars: (D.live.bars || []).slice(-14), pools: D.live.pools || [], price: D.live.price, state: D.live.model_state }),
  candles: () => ({ bars: D.live.bars.slice(-120), pools: D.live.pools, price: D.live.price }),
  constellation: () => empty ? { runs: [], baseline: 'baseline' } : REAL ? REAL : (() => { const r = runs(+(q.get('runs') || 37)); if (alt) { r.splice(3, 4); r.push(...runs(48, 11).slice(40)); r[5] && (r[5] = { ...r[5], status: 'adopt-candidate', pf26: 4.1, pf21: 1.21 }); } return { runs: r, baseline: 'baseline' }; })(),
  ribbon: () => empty ? { series: [] } : alt ? ribbon(+(q.get('ser') || 2), q.get('span') || '2026', 13) : ribbon(+(q.get('ser') || 2), q.get('span') || '2026'),
  reactor: () => empty ? {} : alt ? { ...reactor(), balance: reactor().balance + 1450, dayPnl: 620 } : reactor(),
  pipeline: () => empty ? {} : alt ? { ...pipeline(), idx: Math.min(4, pipeline().idx + 1) } : pipeline(),
  losses: () => empty ? { trades: [] } : alt ? { trades: losses().trades.filter((t, i) => i % 3) } : losses(),
  jarvis: () => empty ? {} : jarvis(q.get('state') || 'idle'),
  newsradar: () => empty ? { now: NOW, events: [] } : newsradar(alt),
  montecarlo: () => empty ? { paths: [] } : montecarlo(alt),
  heat: () => empty ? { cells: [], label: '2026' } : heat(alt),
  liqmap: () => empty ? {} : liqmap(alt),
  weekring: () => empty ? null : weekring(alt),
  dayclock: () => empty ? null : dayclock(alt),
  none: () => null,
}[view]());
window.__picked = null;
const onPick = (row) => { window.__picked = row; log('picked ' + JSON.stringify(row).slice(0, 160)); };
window.__ff = (sec) => { const v = window.__view; if (v?.update) for (let i = 0; i < sec * 10; i++) v.update(0, 0.1); };
window.__mount = (data) => { const v = FX.mount('dev-' + view, box, view, data, { onPick }); window.__view = v; return v; };
window.__view = window.__mount(make(false));
if (q.get('ff')) window.__ff(+q.get('ff'));
window.__FX = FX;
if (q.get('seq') === '1') {
  setTimeout(() => { window.__mount(make(true)); window.__seq = 1; }, 4000);
  setTimeout(() => {   // the same data again: must be a no-op (no new animation, same signature)
    const v = window.__view, before = v.sig, busy0 = !!(v.animating || v.revving || v.comet);
    window.__mount(make(true)); window.__seq = 2;
    log(`same-data remount: sig ${v.sig === before ? 'unchanged' : 'CHANGED'}, busy before ${busy0} after ${!!(v.animating || v.revving || v.comet)}`);
  }, 7000);
}
if (view === 'jarvis' && q.get('cycle') !== '0' && !q.get('state')) {   // state cycler: idle -> listening -> thinking -> speaking -> ...
  const ST = ['idle', 'listening', 'thinking', 'speaking']; let i = 0;
  window.__cycle = setInterval(() => { i = (i + 1) % ST.length; window.__mount(jarvis(ST[i])); window.__state = ST[i]; }, +(q.get('cycle') || 3000));
}
window.__ready = true;
</script></body></html>
