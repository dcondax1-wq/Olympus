<!doctype html><!-- PRIVATE harness for the liqmap view (deleted after testing): dev_liqmap.html?h=340&level=max|lite
  &rich=1 (extra synthetic pools with labels / strengths)  &pos=1 (an open long)  &short=1 (an open short)  &empty=1 (no price)
  &nopools=1 (price, no pools)  &nobars=1  &seq=1 (changed data after 4 s, same data again after 7 s)  &ff=<s>  &fxfixed -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx dev liqmap</title>
<style>
  :root { --page:#07080c; --accent:#6d7cff; --accent-2:#3ee0c8; --good:#2ee59d; --bad:#ff5a7a; --bsl:#ff9b5c; --ssl:#6d9bff; }
  html,body{margin:0;background:#07080c;color:#eef1f8;font:14px Inter,system-ui,sans-serif}
  .box{position:relative;margin:16px;border-radius:18px;overflow:hidden;border:1px solid rgba(160,170,220,.12);background:#0b0d14;z-index:1}
  .fx-canvas{display:block}
  #log{position:fixed;bottom:0;left:0;right:0;font:11px monospace;color:#f88;white-space:pre-wrap;z-index:5}
</style></head><body>
<div class="box" id="box"></div><div id="log"></div>
<script type="module">
const q = new URLSearchParams(location.search), view = 'liqmap';
const box = document.getElementById('box'); box.style.height = (q.get('h') || 340) + 'px';
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
window.onerror = (m) => log(m);
const FX = await import('./fx_liqmap.js?' + Date.now());
FX.init({ level: q.get('level') || 'max' });
const D = await (await fetch('./dev-data.json')).json();
const L = D.live, price = L.price, bars = (L.bars || []).slice(-40);
const basePools = (L.pools || []).map((p) => ({ ...p }));
const rich = q.get('rich') === '1';
function pools(alt) {
  let P = basePools.map((p) => ({ ...p }));
  if (rich) {
    P[0] = { ...P[0], label: 'PDH', strength: 3 }; P[1] = { ...P[1], label: 'ONH', strength: 2 }; P[2] = { ...P[2], label: '1H swing', strength: 2 }; P[3] = { ...P[3], label: 'PWH', strength: 1 };
    P.push({ label: 'ONL', price: price - 61.5, side: 'L', strength: 2 }, { label: 'PDL', price: price - 142.25, side: 'L', strength: 3 }, { label: '4H swing', price: price - 310, side: 'L', strength: 1 }, { label: 'PWL', price: price - 640, side: 'L', strength: 2 });
    P[6] = { ...P[6], label: 'Asia low' };
  }
  if (alt) { P = P.filter((p, i) => i !== 1); P.push({ label: 'new ITH', price: price + 88.5, side: 'H', strength: 2 }); }
  return P.map((p) => ({ ...p, dist: p.price - price }));
}
const position = (alt) => q.get('pos') === '1' ? { dir: 'long', entry: price - 12.25 + (alt ? 6 : 0), stop: price - 54.5, target: basePools[1].price }
  : q.get('short') === '1' ? { dir: 'short', entry: price + 9.5, stop: price + 48.75, target: price - 142.25 } : null;
const make = (alt) => q.get('empty') === '1' ? { price: null, pools: [] }
  : q.get('nopools') === '1' ? { price, pools: [], bars }
  : { price: alt ? price + 23.5 : price, pools: pools(alt), bars: q.get('nobars') === '1' ? [] : (alt ? bars.slice(2) : bars), position: position(alt) };
window.__picked = null;
const onPick = (row) => { window.__picked = row; log('picked ' + JSON.stringify(row).slice(0, 160)); };
window.__ff = (sec) => { const v = window.__view; if (v?.update) for (let i = 0; i < sec * 10; i++) v.update(0, 0.1); };
window.__mount = (data) => { const v = FX.mount('dev-' + view, box, view, data, { onPick }); window.__view = v; return v; };
window.__view = window.__mount(make(false));
if (q.get('ff')) window.__ff(+q.get('ff'));
window.__FX = FX;
if (q.get('seq') === '1') {
  setTimeout(() => { window.__mount(make(true)); window.__seq = 1; }, 4000);
  setTimeout(() => {
    const v = window.__view, before = v.sig, busy0 = !!v.animating;
    window.__mount(make(true)); window.__seq = 2;
    log(`same-data remount: sig ${v.sig === before ? 'unchanged' : 'CHANGED'}, busy before ${busy0} after ${!!v.animating}`);
  }, 7000);
}
window.__ready = true;
</script></body></html>
