<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Option I "Vault": a brushed indigo-steel vault door with gold bolts; its keyhole is filled with glowing teal
       liquidity (the pool the bot hunts). Full bleed, opaque. Built by tools/icon_options_build.py; applied with tools/icon_apply.py i -->
  <defs>
    <radialGradient id="bg" cx="512" cy="460" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#181b3a"/><stop offset="0.5" stop-color="#090b16"/><stop offset="1" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="steel" x1="180" y1="140" x2="840" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6dbff"/><stop offset="0.3" stop-color="#7f88d8"/><stop offset="0.65" stop-color="#2e3170"/><stop offset="1" stop-color="#14153a"/>
    </linearGradient>
    <linearGradient id="steel2" x1="840" y1="880" x2="180" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f98ea"/><stop offset="0.45" stop-color="#2b2e6a"/><stop offset="1" stop-color="#10112e"/>
    </linearGradient>
    <radialGradient id="face" cx="450" cy="400" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262b5c"/><stop offset="1" stop-color="#0b0c1e"/>
    </radialGradient>
    <radialGradient id="bolt" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff6d8"/><stop offset="0.4" stop-color="#f2c35b"/><stop offset="1" stop-color="#7a5216"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="470" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6fffa"/><stop offset="0.25" stop-color="#3ee0c8"/><stop offset="1" stop-color="#1a7fc0"/>
    </linearGradient>
    <clipPath id="key"><path d="M512 330 A100 100 0 0 1 572 510 L620 720 L404 720 L452 510 A100 100 0 0 1 512 330 Z"/></clipPath>
    <filter id="b60" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="b20" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="b6" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <circle id="b" cx="512" cy="164" r="24" fill="url(#bolt)"/>
  </defs>
  <g id="bg"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="art">
    <circle cx="512" cy="512" r="420" fill="#4f58ff" opacity="0.25" filter="url(#b60)"/>
    <!-- door: outer steel rim, dark gap, inner steel ring, face -->
    <circle cx="512" cy="512" r="410" fill="url(#steel)"/>
    <circle cx="512" cy="512" r="384" fill="#070812"/>
    <circle cx="512" cy="512" r="372" fill="url(#steel2)"/>
    <circle cx="512" cy="512" r="300" fill="url(#face)"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="#9aa6ff" stroke-opacity="0.45" stroke-width="6"/>
    <circle cx="512" cy="512" r="410" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4"/>
    <!-- 12 gold bolts -->
    <use xlink:href="#b"/><use xlink:href="#b" transform="rotate(30 512 512)"/><use xlink:href="#b" transform="rotate(60 512 512)"/>
    <use xlink:href="#b" transform="rotate(90 512 512)"/><use xlink:href="#b" transform="rotate(120 512 512)"/><use xlink:href="#b" transform="rotate(150 512 512)"/>
    <use xlink:href="#b" transform="rotate(180 512 512)"/><use xlink:href="#b" transform="rotate(210 512 512)"/><use xlink:href="#b" transform="rotate(240 512 512)"/>
    <use xlink:href="#b" transform="rotate(270 512 512)"/><use xlink:href="#b" transform="rotate(300 512 512)"/><use xlink:href="#b" transform="rotate(330 512 512)"/>
    <!-- keyhole with teal liquidity inside -->
    <path d="M512 330 A100 100 0 0 1 572 510 L620 720 L404 720 L452 510 A100 100 0 0 1 512 330 Z" fill="#3ee0c8" opacity="0.75" filter="url(#b20)"/>
    <path d="M512 330 A100 100 0 0 1 572 510 L620 720 L404 720 L452 510 A100 100 0 0 1 512 330 Z" fill="#05060c"/>
    <g clip-path="url(#key)">
      <path d="M380 486 Q446 456 512 486 T644 486 L644 740 L380 740 Z" fill="url(#liquid)"/>
      <path d="M380 486 Q446 456 512 486 T644 486" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.9"/>
      <ellipse cx="512" cy="600" rx="40" ry="90" fill="#ffffff" opacity="0.25" filter="url(#b6)"/>
    </g>
    <path d="M512 330 A100 100 0 0 1 572 510 L620 720 L404 720 L452 510 A100 100 0 0 1 512 330 Z" fill="none" stroke="#f2c35b" stroke-width="10"/>
  </g>
</svg>
