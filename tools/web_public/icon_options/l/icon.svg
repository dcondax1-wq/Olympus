<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Option L "Wave": one thick neon ribbon that rolls over a crest, dives below a gold liquidity line and
       surges back up through a bright reclaim point to the top right. Full bleed, opaque. Built by tools/icon_options_build.py; applied with tools/icon_apply.py l -->
  <defs>
    <radialGradient id="bg" cx="512" cy="560" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161c3a"/><stop offset="0.5" stop-color="#090b17"/><stop offset="1" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="rib" x1="80" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4b46d6"/><stop offset="0.35" stop-color="#6d7cff"/><stop offset="0.65" stop-color="#3ee0c8"/><stop offset="1" stop-color="#c8fff5"/>
    </linearGradient>
    <linearGradient id="level" x1="0" y1="0" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2c35b" stop-opacity="0"/><stop offset="0.12" stop-color="#f2c35b" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fff2cc"/><stop offset="0.88" stop-color="#f2c35b" stop-opacity="0.85"/><stop offset="1" stop-color="#f2c35b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.18" stop-color="#fff4d6" stop-opacity="0.95"/><stop offset="0.45" stop-color="#f2c35b" stop-opacity="0.35"/><stop offset="1" stop-color="#f2c35b" stop-opacity="0"/>
    </radialGradient>
    <filter id="b40" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="b12" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <g id="bg"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="art">
    <rect x="40" y="606" width="944" height="26" rx="13" fill="url(#level)"/>
    <!-- glow, ribbon, inner shading and a specular line -->
    <path d="M60 600 C160 300 330 300 400 520 C450 680 520 780 600 740 C700 690 760 360 964 210" fill="none" stroke="#3ee0c8" stroke-width="150" stroke-linecap="round" opacity="0.35" filter="url(#b40)"/>
    <path d="M60 600 C160 300 330 300 400 520 C450 680 520 780 600 740 C700 690 760 360 964 210" fill="none" stroke="url(#rib)" stroke-width="110" stroke-linecap="round"/>
    <path d="M64 630 C170 336 344 336 412 556 C462 712 528 812 612 772 C716 722 776 390 970 244" fill="none" stroke="#0b0a3a" stroke-opacity="0.35" stroke-width="40" stroke-linecap="round" filter="url(#b12)"/>
    <path d="M74 560 C170 270 320 270 388 490 C438 650 510 744 590 708 C690 660 746 330 950 186" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="12" stroke-linecap="round" filter="url(#b12)"/>
    <path d="M84 556 C176 274 318 274 386 494 C436 654 510 748 590 712 C690 664 746 334 940 190" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"/>
    <!-- the reclaim point where the ribbon crosses back above the level -->
    <circle cx="690" cy="619" r="130" fill="url(#flare)"/>
  </g>
</svg>
