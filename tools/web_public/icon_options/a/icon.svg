<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Option A "Reclaim": one faceted obsidian-glass candle whose spear-tipped lower wick sweeps below a gold
       liquidity line and closes back above it (sweep + reclaim, the LIT entry idea). Full bleed, opaque.
       Built by tools/icon_options_build.py; applied with tools/icon_apply.py a -->
  <defs>
    <radialGradient id="bg" cx="512" cy="420" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16203a"/><stop offset="0.45" stop-color="#0b0f1c"/><stop offset="1" stop-color="#040508"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="220" x2="0" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8bfbe8"/><stop offset="0.35" stop-color="#3ee0c8"/><stop offset="0.75" stop-color="#2c9bd6"/><stop offset="1" stop-color="#5b6cff"/>
    </linearGradient>
    <linearGradient id="facetL" x1="362" y1="0" x2="584" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="facetR" x1="0" y1="236" x2="0" y2="604" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#03121e" stop-opacity="0.10"/><stop offset="1" stop-color="#050a2a" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="wick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff6e3"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#58d4ff"/>
    </linearGradient>
    <linearGradient id="spear" x1="0" y1="604" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fe9ff"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe7a8"/>
    </linearGradient>
    <linearGradient id="level" x1="0" y1="0" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2c35b" stop-opacity="0"/><stop offset="0.12" stop-color="#f2c35b" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fff2cc"/><stop offset="0.88" stop-color="#f2c35b" stop-opacity="0.9"/><stop offset="1" stop-color="#f2c35b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.16" stop-color="#fff4d6" stop-opacity="0.95"/><stop offset="0.45" stop-color="#f2c35b" stop-opacity="0.35"/><stop offset="1" stop-color="#f2c35b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tip" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#ffe6a3" stop-opacity="0.7"/><stop offset="1" stop-color="#ff9b5c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bodyClip"><rect x="362" y="220" width="300" height="390" rx="38"/></clipPath>
    <filter id="b80" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="b30" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b14" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="b6" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g id="bg"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="art">
    <!-- aura behind the candle -->
    <ellipse cx="512" cy="430" rx="280" ry="330" fill="#2bc8d0" opacity="0.30" filter="url(#b80)"/>
    <ellipse cx="512" cy="700" rx="420" ry="60" fill="#f2c35b" opacity="0.16" filter="url(#b30)"/>
    <!-- the liquidity level -->
    <rect x="50" y="686" width="924" height="28" rx="14" fill="url(#level)"/>
    <!-- wick glows -->
    <g filter="url(#b14)" opacity="0.9">
      <rect x="482" y="92" width="60" height="150" rx="30" fill="#3ee0c8"/>
      <path d="M480 604 L544 604 L512 904 Z" fill="#7fdfff"/>
    </g>
    <!-- upper wick -->
    <rect x="488" y="98" width="48" height="136" rx="24" fill="url(#wick)"/>
    <!-- lower wick: tapers to the sweep extreme (the protected low) -->
    <path d="M486 604 L538 604 L515 892 Q512 902 509 892 Z" fill="url(#spear)"/>
    <!-- body glow + body -->
    <rect x="362" y="220" width="300" height="390" rx="38" fill="#30d6d0" opacity="0.55" filter="url(#b30)"/>
    <rect x="362" y="220" width="300" height="390" rx="38" fill="url(#body)"/>
    <g clip-path="url(#bodyClip)">
      <path d="M362 220 L584 220 L470 610 L362 610 Z" fill="url(#facetL)"/>
      <path d="M584 220 L662 220 L662 610 L470 610 Z" fill="url(#facetR)"/>
      <rect x="362" y="220" width="300" height="12" fill="#ffffff" opacity="0.55"/>
      <rect x="380" y="244" width="18" height="320" rx="7" fill="#ffffff" opacity="0.55" filter="url(#b6)"/>
    </g>
    <rect x="363.5" y="221.5" width="297" height="387" rx="37" fill="none" stroke="#c9fff6" stroke-opacity="0.55" stroke-width="3"/>
    <!-- flare where the wick crosses the level, hot point at the sweep extreme -->
    <circle cx="512" cy="700" r="135" fill="url(#flare)"/>
    <rect x="392" y="696" width="240" height="8" rx="4" fill="#ffffff" opacity="0.9" filter="url(#b6)"/>
    <circle cx="512" cy="892" r="50" fill="url(#tip)"/>
  </g>
</svg>
