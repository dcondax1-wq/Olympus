<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Option K "Orbit": a tall teal glass candle circled by one tilted gold neon ring that passes behind and in front
       of it, in an indigo halo. Full bleed, opaque. Built by tools/icon_options_build.py; applied with tools/icon_apply.py k -->
  <defs>
    <radialGradient id="bg" cx="512" cy="480" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1d48"/><stop offset="0.5" stop-color="#0a0b19"/><stop offset="1" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="body" x1="432" y1="0" x2="592" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8fff8"/><stop offset="0.3" stop-color="#3ee0c8"/><stop offset="0.75" stop-color="#1c9cc8"/><stop offset="1" stop-color="#3b3fc8"/>
    </linearGradient>
    <linearGradient id="ring" x1="130" y1="0" x2="894" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8862c"/><stop offset="0.4" stop-color="#fff3cf"/><stop offset="0.7" stop-color="#f2c35b"/><stop offset="1" stop-color="#a87720"/>
    </linearGradient>
    <clipPath id="front"><rect x="-200" y="520" width="1424" height="700"/></clipPath>
    <filter id="b90" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="b22" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="b8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <g id="bg"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="art">
    <circle cx="512" cy="512" r="300" fill="#5a5cff" opacity="0.45" filter="url(#b90)"/>
    <!-- ring, back half -->
    <g transform="rotate(-18 512 520)"><ellipse cx="512" cy="520" rx="390" ry="112" fill="none" stroke="url(#ring)" stroke-width="26" opacity="0.5"/></g>
    <!-- candle -->
    <rect x="498" y="120" width="28" height="170" rx="14" fill="#bffff4"/>
    <rect x="498" y="720" width="28" height="180" rx="14" fill="#9fe9ff"/>
    <rect x="422" y="270" width="180" height="470" rx="34" fill="#3ee0c8" opacity="0.6" filter="url(#b22)"/>
    <rect x="422" y="270" width="180" height="470" rx="34" fill="url(#body)"/>
    <rect x="442" y="292" width="18" height="420" rx="9" fill="#ffffff" opacity="0.6" filter="url(#b8)"/>
    <rect x="423.5" y="271.5" width="177" height="467" rx="33" fill="none" stroke="#e6fffa" stroke-opacity="0.6" stroke-width="3"/>
    <!-- ring, front half -->
    <g transform="rotate(-18 512 520)">
      <g clip-path="url(#front)">
        <ellipse cx="512" cy="520" rx="390" ry="112" fill="none" stroke="#f2c35b" stroke-width="44" opacity="0.45" filter="url(#b22)"/>
        <ellipse cx="512" cy="520" rx="390" ry="112" fill="none" stroke="url(#ring)" stroke-width="28"/>
        <ellipse cx="512" cy="523" rx="390" ry="112" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5"/>
      </g>
    </g>
  </g>
</svg>
