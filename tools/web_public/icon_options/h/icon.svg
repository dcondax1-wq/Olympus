<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Option H "Strike": an indigo glass candle whose lower wick is a gold lightning bolt striking through a teal
       liquidity line. Full bleed, opaque. Built by tools/icon_options_build.py; applied with tools/icon_apply.py h -->
  <defs>
    <radialGradient id="bg" cx="512" cy="420" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1b46"/><stop offset="0.5" stop-color="#0a0b19"/><stop offset="1" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="150" x2="0" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cbd1ff"/><stop offset="0.35" stop-color="#7f8cff"/><stop offset="1" stop-color="#3a2fc4"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="520" x2="0" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a1"/><stop offset="0.5" stop-color="#fff8e6"/><stop offset="1" stop-color="#f2c35b"/>
    </linearGradient>
    <linearGradient id="level" x1="0" y1="0" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ee0c8" stop-opacity="0"/><stop offset="0.12" stop-color="#3ee0c8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#e6fffa"/><stop offset="0.88" stop-color="#3ee0c8" stop-opacity="0.9"/><stop offset="1" stop-color="#3ee0c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.2" stop-color="#fff1c8" stop-opacity="0.9"/><stop offset="0.5" stop-color="#f2c35b" stop-opacity="0.3"/><stop offset="1" stop-color="#f2c35b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bc"><rect x="372" y="170" width="280" height="370" rx="36"/></clipPath>
    <filter id="b70" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="b22" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="b8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <g id="bg"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="art">
    <ellipse cx="512" cy="420" rx="260" ry="320" fill="#5a5cff" opacity="0.4" filter="url(#b70)"/>
    <rect x="40" y="756" width="944" height="26" rx="13" fill="#3ee0c8" opacity="0.35" filter="url(#b22)"/>
    <rect x="40" y="756" width="944" height="26" rx="13" fill="url(#level)"/>
    <!-- bolt glow + bolt -->
    <path d="M560 520 L440 740 L526 740 L456 940 L650 660 L560 660 L626 520 Z" fill="#f2c35b" opacity="0.85" filter="url(#b22)"/>
    <path d="M560 520 L440 740 L526 740 L456 940 L650 660 L560 660 L626 520 Z" fill="url(#bolt)"/>
    <path d="M560 520 L440 740 L462 740 L572 528 Z" fill="#ffffff" opacity="0.8"/>
    <!-- upper wick + body -->
    <rect x="490" y="70" width="44" height="120" rx="22" fill="#b6bfff"/>
    <rect x="372" y="170" width="280" height="370" rx="36" fill="#6d7cff" opacity="0.6" filter="url(#b22)"/>
    <rect x="372" y="170" width="280" height="370" rx="36" fill="url(#body)"/>
    <g clip-path="url(#bc)">
      <path d="M372 170 L540 170 L440 540 L372 540 Z" fill="#ffffff" opacity="0.22"/>
      <rect x="390" y="190" width="18" height="300" rx="9" fill="#ffffff" opacity="0.6" filter="url(#b8)"/>
    </g>
    <rect x="373.5" y="171.5" width="277" height="367" rx="35" fill="none" stroke="#e6eaff" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="492" cy="769" r="130" fill="url(#flare)"/>
  </g>
</svg>
