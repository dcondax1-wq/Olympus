<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Option G "Market Eye": a gold-rimmed eye whose glowing teal-indigo iris has a candle-shaped pupil: the bot
       watching the market. Full bleed, opaque. Built by tools/icon_options_build.py; applied with tools/icon_apply.py g -->
  <defs>
    <radialGradient id="bg" cx="512" cy="512" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171b3a"/><stop offset="0.5" stop-color="#090b16"/><stop offset="1" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="lid" x1="112" y1="300" x2="912" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0c2"/><stop offset="0.35" stop-color="#f2c35b"/><stop offset="0.7" stop-color="#3ee0c8"/><stop offset="1" stop-color="#6d7cff"/>
    </linearGradient>
    <radialGradient id="iris" cx="512" cy="512" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6fffa"/><stop offset="0.3" stop-color="#3ee0c8"/><stop offset="0.7" stop-color="#5b5fe8"/><stop offset="1" stop-color="#1a1760"/>
    </radialGradient>
    <radialGradient id="white" cx="512" cy="512" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151a33"/><stop offset="1" stop-color="#06070d"/>
    </radialGradient>
    <clipPath id="almond"><path d="M112 512 Q512 120 912 512 Q512 904 112 512 Z"/></clipPath>
    <filter id="b70" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="b24" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="b8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <g id="bg"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="art">
    <ellipse cx="512" cy="512" rx="420" ry="240" fill="#2fb7c8" opacity="0.28" filter="url(#b70)"/>
    <path d="M112 512 Q512 120 912 512 Q512 904 112 512 Z" fill="url(#white)"/>
    <g clip-path="url(#almond)">
      <circle cx="512" cy="512" r="250" fill="#3ee0c8" opacity="0.4" filter="url(#b24)"/>
      <circle cx="512" cy="512" r="210" fill="url(#iris)"/>
      <circle cx="512" cy="512" r="210" fill="none" stroke="#0b0a2e" stroke-width="14"/>
      <!-- iris fibres -->
      <g stroke="#e6fffa" stroke-opacity="0.18" stroke-width="6">
        <line x1="512" y1="330" x2="512" y2="380"/><line x1="512" y1="644" x2="512" y2="694"/>
        <line x1="330" y1="512" x2="380" y2="512"/><line x1="644" y1="512" x2="694" y2="512"/>
        <line x1="383" y1="383" x2="418" y2="418"/><line x1="606" y1="606" x2="641" y2="641"/>
        <line x1="641" y1="383" x2="606" y2="418"/><line x1="418" y1="606" x2="383" y2="641"/>
      </g>
      <!-- candle pupil -->
      <rect x="500" y="352" width="24" height="320" rx="12" fill="#05050f"/>
      <rect x="466" y="420" width="92" height="184" rx="16" fill="#05050f"/>
      <!-- specular -->
      <ellipse cx="596" cy="430" rx="34" ry="26" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="440" cy="610" rx="14" ry="10" fill="#ffffff" opacity="0.6"/>
      <path d="M112 512 Q512 120 912 512" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="60" filter="url(#b24)"/>
    </g>
    <!-- gold-to-teal lids -->
    <path d="M112 512 Q512 120 912 512 Q512 904 112 512 Z" fill="none" stroke="#f2c35b" stroke-opacity="0.45" stroke-width="44" filter="url(#b24)" stroke-linejoin="miter"/>
    <path d="M112 512 Q512 120 912 512 Q512 904 112 512 Z" fill="none" stroke="url(#lid)" stroke-width="32" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <path d="M150 494 Q512 160 874 494" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6" filter="url(#b8)"/>
  </g>
</svg>
