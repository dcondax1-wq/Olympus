<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Option E "Bull Crest": a low-poly indigo bull head with polished gold horns and a glowing teal candle as its
       blaze. Full bleed, opaque. Built by tools/icon_options_build.py; applied with tools/icon_apply.py e -->
  <defs>
    <radialGradient id="bg" cx="512" cy="460" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1d40"/><stop offset="0.5" stop-color="#0a0c18"/><stop offset="1" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="hornL" x1="160" y1="220" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3cc"/><stop offset="0.35" stop-color="#f2c35b"/><stop offset="1" stop-color="#7d5418"/>
    </linearGradient>
    <linearGradient id="hornR" x1="864" y1="220" x2="584" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a1"/><stop offset="0.4" stop-color="#d9a640"/><stop offset="1" stop-color="#6a4512"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="440" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dafff8"/><stop offset="0.4" stop-color="#3ee0c8"/><stop offset="1" stop-color="#1491b0"/>
    </linearGradient>
    <filter id="b70" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="b22" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="b8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <g id="bg"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="art">
    <ellipse cx="512" cy="540" rx="330" ry="330" fill="#5a63ff" opacity="0.34" filter="url(#b70)"/>
    <!-- horns -->
    <g filter="url(#b22)" opacity="0.55">
      <path d="M430 470 C300 476 168 400 150 200 C226 350 330 392 440 392 Z" fill="#f2c35b"/>
      <path d="M594 470 C724 476 856 400 874 200 C798 350 694 392 584 392 Z" fill="#f2c35b"/>
    </g>
    <path d="M430 470 C300 476 168 400 150 200 C226 350 330 392 440 392 Z" fill="url(#hornL)"/>
    <path d="M594 470 C724 476 856 400 874 200 C798 350 694 392 584 392 Z" fill="url(#hornR)"/>
    <path d="M164 236 C214 340 300 382 410 392 L440 392 C330 392 226 350 150 200 Z" fill="#ffffff" opacity="0.55"/>
    <!-- low-poly head: facets lit from the upper left -->
    <path d="M512 380 L352 380 L316 500 L512 560 Z" fill="#8a96ff"/>
    <path d="M512 380 L672 380 L708 500 L512 560 Z" fill="#4b46d6"/>
    <path d="M316 500 L512 560 L432 850 Z" fill="#5e62f0"/>
    <path d="M708 500 L512 560 L592 850 Z" fill="#2c2a9a"/>
    <path d="M432 850 L512 560 L592 850 Z" fill="#3a37c0"/>
    <path d="M352 380 L672 380 L708 500 L592 850 L432 850 L316 500 Z" fill="none" stroke="#c9d0ff" stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/>
    <path d="M440 820 L584 820 L592 850 L432 850 Z" fill="#1b1960"/>
    <!-- the blaze: a teal candle -->
    <rect x="472" y="420" width="80" height="250" rx="18" fill="#3ee0c8" opacity="0.7" filter="url(#b22)"/>
    <rect x="502" y="388" width="20" height="360" rx="10" fill="#bffff4"/>
    <rect x="472" y="440" width="80" height="230" rx="18" fill="url(#teal)"/>
    <rect x="480" y="452" width="16" height="200" rx="8" fill="#ffffff" opacity="0.6" filter="url(#b8)"/>
  </g>
</svg>
