<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Option M "Facet": a brilliant-cut gem in teal and indigo facets with gold girdle edges and one white sparkle.
       Full bleed, opaque. Built by tools/icon_options_build.py; applied with tools/icon_apply.py m -->
  <defs>
    <radialGradient id="bg" cx="512" cy="460" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171d3c"/><stop offset="0.5" stop-color="#090b17"/><stop offset="1" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="250" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6fffa"/><stop offset="1" stop-color="#5fe8d4"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.2" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="1" stop-color="#3ee0c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="b80" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="b24" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <g id="bg"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="art">
    <ellipse cx="512" cy="540" rx="360" ry="340" fill="#30c0d0" opacity="0.3" filter="url(#b80)"/>
    <path d="M362 230 L662 230 L862 400 L512 890 L162 400 Z" fill="#3ee0c8" opacity="0.5" filter="url(#b24)"/>
    <!-- crown -->
    <path d="M162 400 L362 230 L330 400 Z" fill="#9ff8ea"/>
    <path d="M362 230 L512 230 L512 400 L330 400 Z" fill="url(#table)"/>
    <path d="M512 230 L662 230 L694 400 L512 400 Z" fill="#3ee0c8"/>
    <path d="M662 230 L862 400 L694 400 Z" fill="#1b9fc0"/>
    <path d="M362 230 L512 300 L662 230 Z" fill="#ffffff" opacity="0.55"/>
    <!-- pavilion -->
    <path d="M162 400 L330 400 L512 890 Z" fill="#7f8cff"/>
    <path d="M330 400 L512 400 L512 890 Z" fill="#4b46d6"/>
    <path d="M512 400 L694 400 L512 890 Z" fill="#2c2a9a"/>
    <path d="M694 400 L862 400 L512 890 Z" fill="#1d1868"/>
    <path d="M330 400 L420 400 L512 890 Z" fill="#a9b3ff" opacity="0.5"/>
    <path d="M512 400 L560 400 L512 890 Z" fill="#3ee0c8" opacity="0.35"/>
    <!-- gold girdle and edges -->
    <path d="M362 230 L662 230 L862 400 L512 890 L162 400 Z" fill="none" stroke="#f2c35b" stroke-width="12" stroke-linejoin="round"/>
    <path d="M162 400 L862 400" stroke="#fff0c2" stroke-width="12"/>
    <path d="M330 400 L512 890 M512 400 L512 890 M694 400 L512 890 M330 400 L362 230 M694 400 L662 230 M512 230 L512 400" stroke="#f2c35b" stroke-opacity="0.45" stroke-width="4"/>
    <!-- sparkle -->
    <circle cx="372" cy="262" r="80" fill="url(#spark)"/>
    <path d="M372 182 L384 250 L452 262 L384 274 L372 342 L360 274 L292 262 L360 250 Z" fill="#ffffff"/>
  </g>
</svg>
