<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athena</title>
<meta name="description" content="ATHENA, your library: a searchable, plain-words knowledge base of your trading system, the MFFU rules, what was tested and rejected, a glossary and what-to-do-when playbooks. Works offline.">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../jarvis/icon-192.png?v=j1">
<!-- ATHENA (tools/web_public/athena/, 2026-11-03): the library. The content is library.json, written at build time by
     tools/athena_build.py from STRATEGY.md, research/lit/mffu_rules.json and the 'Tested and rejected' list (an embedded stub in
     athenacore.js when it is missing). Look: athena.css; search, quiz and glossary links: athenacore.js (pure functions); the 3D
     library + the UI: athena.js (render core ../olympus/render.js + materials.js, three.js from ../jarvis/). It fetches nothing but
     its own library.json / jarvis.json, stores nothing, and the quiz feeds nothing outside the page. Bump ?v= on all of them when one changes. -->
<script>(function () { var d = document.documentElement; try { if (window.top !== window) d.classList.add('framed'); } catch (e) { d.classList.add('framed'); } })();</script>
<link rel="stylesheet" href="../olympus/olympus.css?v=o2">
<script src="../olympus/themes.js?v=o2"></script>
<script src="../olympus/olympus.js?v=o2" data-app="athena"></script>
<script src="../olympus/intro-app.js?v=i1" defer></script>
<script>(function () { var r = document.documentElement.style; r.setProperty('--oly-accent', '#5ea8ff'); r.setProperty('--oly-accent-rgb', '94, 168, 255'); })();</script>
<link rel="stylesheet" href="athena.css?v=a1">
</head>
<body>
<canvas id="stage" aria-label="A round library of glowing shelves, one for each topic. Tap a shelf to filter the list." role="img"></canvas>
<div id="nogl" class="nogl" hidden>3D is not available here. Everything works below.</div>
<header class="hud">
  <div class="title"><h1>ATHENA</h1><span class="tag" id="demo" hidden>STUB LIBRARY</span></div>
  <p class="sub" id="sub">Your library. Tap a shelf.</p>
</header>
<section class="sheet" id="sheet" aria-live="polite">
  <div class="pane" id="p-lib" role="tabpanel" aria-label="Library">
    <div class="chips" id="chips" role="group" aria-label="Shelves"></div>
    <p class="count" id="count"></p>
    <div id="list"></div>
  </div>
  <div class="pane" id="p-entry" role="tabpanel" aria-label="Entry" hidden>
    <button type="button" class="back" id="back">&larr; Back</button>
    <div id="entry" class="entry"></div>
  </div>
  <div class="pane" id="p-quiz" role="tabpanel" aria-label="Quiz me" hidden>
    <div id="quiz"></div>
  </div>
</section>
<footer class="dock">
  <label class="search"><span class="vh">Search the library</span>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search: sweep, floor, payout..."></label>
  <nav class="tabs" id="tabs" aria-label="Athena">
    <button type="button" data-tab="lib" aria-pressed="true">Library</button><button type="button" data-tab="quiz" aria-pressed="false">Quiz me</button>
  </nav>
</footer>
<script type="module" src="athena.js?v=a1"></script>
</body>
</html>
