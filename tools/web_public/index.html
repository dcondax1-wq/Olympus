<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070c">
<title>Liquidity Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#06070c;--panel:rgba(18,21,34,.62);--panel2:rgba(26,30,48,.7);--line:rgba(140,160,255,.12);--ink:#e9ecf8;--ink2:#a3aac4;--muted:#6b7392;
--acc:#7c5cff;--acc2:#22d3ee;--up:#22c58b;--dn:#ff5b6e;--warn:#f5b84a;--r:18px;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:84px;background:
radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.22),transparent 60%),
radial-gradient(700px 500px at 110% 10%,rgba(34,211,238,.14),transparent 60%),
radial-gradient(800px 600px at 50% 120%,rgba(124,92,255,.12),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px}
header{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 0 28px rgba(124,92,255,.55)}
.logo svg{width:22px;height:22px}
h1{font-size:19px;margin:0;letter-spacing:.3px}h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.4px;margin-top:2px}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font:600 12px var(--mono);color:var(--ink2);padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(34,197,139,.7);animation:pulse 1.8s infinite}
.dot.off{background:var(--warn);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,139,.6)}70%{box-shadow:0 0 0 9px rgba(34,197,139,0)}100%{box-shadow:0 0 0 0 rgba(34,197,139,0)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 40px rgba(0,0,0,.45),0 0 0 1px rgba(124,92,255,.18)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.k{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.v{font:700 26px var(--mono);margin-top:6px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.v.sm{font-size:18px}.sub{font-size:12px;color:var(--ink2);margin-top:4px}
.up{color:var(--up)}.dn{color:var(--dn)}.acc{color:var(--acc2)}
h2{font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:14px;border-radius:2px;background:linear-gradient(var(--acc),var(--acc2))}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font:600 11px var(--mono);border:1px solid var(--line);background:var(--panel2)}
.pill.full{color:var(--up);border-color:rgba(34,197,139,.35)}.pill.half{color:var(--warn);border-color:rgba(245,184,74,.35)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 18px rgba(34,211,238,.5);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
table{width:100%;border-collapse:collapse;font:500 13px var(--mono)}th{font:600 10.5px 'Space Grotesk';letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.04)}td.n{text-align:right}
.scroll{overflow-x:auto}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:4px;padding:6px;border-radius:20px;background:rgba(14,16,28,.82);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:9}
nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:14px;color:var(--muted);font:600 11px 'Space Grotesk';letter-spacing:.4px;transition:all .2s}
nav button svg{width:20px;height:20px}nav button.on{color:#fff;background:linear-gradient(135deg,rgba(124,92,255,.9),rgba(34,211,238,.7));box-shadow:0 6px 20px rgba(124,92,255,.45)}
nav button:not(.on):hover{color:var(--ink);background:rgba(255,255,255,.05)}
.page{display:none;animation:fade .35s ease}.page.on{display:block}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.trade{display:grid;gap:8px}.trade .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.side{font:700 11px var(--mono);padding:4px 9px;border-radius:8px}.side.L{background:rgba(34,197,139,.14);color:var(--up)}.side.S{background:rgba(255,91,110,.14);color:var(--dn)}
.trade ul{margin:0;padding-left:18px;color:var(--ink2);font-size:13px;line-height:1.55}.trade .plan{font:500 12px var(--mono);color:var(--ink2)}
.tag{font:600 11px var(--mono);color:var(--ink2);padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.05);margin:2px 4px 2px 0;display:inline-block}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;font:600 12px 'Space Grotesk';color:var(--ink2)}.seg button.on{background:rgba(124,92,255,.85);color:#fff}
.log div{font:500 12px var(--mono);color:var(--ink2);padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}.log b{color:var(--acc2);font-weight:600;margin-right:8px}
img.chart{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.verdict{font:600 11px var(--mono);padding:3px 8px;border-radius:7px}.vg{background:rgba(34,197,139,.14);color:var(--up)}.vb{background:rgba(255,91,110,.14);color:var(--dn)}.vm{background:rgba(255,255,255,.06);color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}.note{font-size:12px;color:var(--muted);line-height:1.5}
.skel{height:80px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.07),rgba(255,255,255,.03));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 7-9"/><path d="M14 5h5v5"/></svg></div>
    <h1>Liquidity Engine<small id="strat">NQ futures · paper</small></h1>
    <div class="live"><span class="dot" id="dot"></span><span id="ago">loading</span></div>
  </header>

  <section class="page on" id="p-today">
    <div class="grid g4" id="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <h2>Eval progress · MFFU 50K</h2>
    <div class="card" id="eval"></div>
    <h2>Position</h2>
    <div class="card" id="pos"></div>
    <h2>Market now</h2>
    <div class="card"><img class="chart" id="chart" src="chart.png" alt="NQ chart" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'empty',textContent:'Chart appears after the next market-hours run.'}))"></div>
    <h2>Today's log</h2>
    <div class="card log" id="log"></div>
  </section>

  <section class="page" id="p-trades">
    <h2>Paper trades (cloud)</h2>
    <div class="card scroll" id="ledger"></div>
    <h2>Backtested trades · reports</h2>
    <div class="seg" id="tf"><button class="on" data-f="all">All</button><button data-f="win">Wins</button><button data-f="loss">Losses</button><button data-f="half">Half size</button></div>
    <div class="grid" id="tlist" style="margin-top:12px"></div>
  </section>

  <section class="page" id="p-results">
    <div class="seg" id="per" style="margin-bottom:14px"></div>
    <div class="grid g4" id="rk"></div>
    <h2>Equity curve (all years)</h2>
    <div class="card"><canvas id="eq" height="120"></canvas></div>
    <h2>Eval odds</h2>
    <div class="grid g3" id="evo"></div>
    <h2>By month</h2>
    <div class="card scroll" id="months"></div>
    <h2>Risk follows the stop</h2>
    <div class="card scroll" id="buckets"></div>
    <h2>Data & method</h2>
    <div class="card note" id="meth"></div>
  </section>

  <section class="page" id="p-learn">
    <h2>How losses happen</h2>
    <div class="grid g3" id="lsum"></div>
    <h2>What the bot learned</h2>
    <div class="card scroll" id="factors"></div>
    <div class="note" id="howl" style="margin-top:10px"></div>
  </section>
</div>

<nav id="nav">
  <button class="on" data-p="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-p="trades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Trades</button>
  <button data-p="results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 7-9"/></svg>Results</button>
  <button data-p="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>Learned</button>
</nav>

<script>
const $=s=>document.querySelector(s);
const money=v=>v==null?'—':(v<0?'−':'')+'$'+Math.abs(Math.round(v)).toLocaleString();
const smoney=v=>v==null?'—':(v>0?'+':'')+money(v);
const cls=v=>v>0?'up':v<0?'dn':'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function count(el,to,fmt){const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function kpi(k,v,sub,c,fmt){return `<div class="card"><div class="k">${k}</div><div class="v ${c||''}" data-n="${v??''}" data-f="${fmt||''}">${v==null?'—':v}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`}
function animate(root){root.querySelectorAll('[data-n]').forEach(el=>{const n=parseFloat(el.dataset.n);if(isNaN(n))return;const f=el.dataset.f;
 count(el,n,f==='$'?(x=>smoney(x)):f==='%'?(x=>x.toFixed(0)+'%'):f==='x'?(x=>x.toFixed(2)):(x=>x.toFixed(f==='1'?1:0)))})}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p));window.scrollTo({top:0,behavior:'smooth'})});

fetch('data.json?'+Date.now()).then(r=>r.json()).then(D=>{
 const L=D.live||{},R=D.results;
 if(L.strategy)$('#strat').textContent=L.strategy.replace('Liquidity Engine - ','');
 const age=L.last_run?Math.round((Date.now()/1000-L.last_run)/60):null;
 $('#ago').textContent=age==null?'no run yet':age<90?`updated ${age} min ago`:`updated ${new Date(L.last_run*1000).toLocaleString()}`;
 if(age==null||age>90)$('#dot').classList.add('off');
 const ef=L.equity_filter||{},E=L.eval||{};
 $('#kpis').innerHTML=kpi('Session',esc(L.model_state||'—'),`NQ ${L.price?L.price.toLocaleString(undefined,{maximumFractionDigits:2}):''}`,'acc')+
  kpi('Size mode',ef.enabled?(ef.on?'FULL':'HALF'):'FULL',ef.sum_r!=null?`last ${ef.n} signals ${ef.sum_r>0?'+':''}${ef.sum_r}R`:'',ef.on===false?'':'up')+
  kpi('Eval profit',E.profit??0,`balance ${money(E.balance)}`,cls(E.profit),'$')+kpi('Cushion',E.cushion??null,`trailing max loss ${money(E.trailing_mll)}`,'','$');
 animate($('#kpis'));
 const pct=Math.max(0,Math.min(100,100*(E.profit||0)/3000));
 $('#eval').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline"><div><div class="k">Profit to $3,000 target</div><div class="v ${cls(E.profit)}">${smoney(E.profit||0)}</div></div><div class="sub">${money(E.to_target)} to go</div></div><div class="bar"><i style="width:0"></i></div>`;
 setTimeout(()=>$('#eval .bar i').style.width=pct+'%',60);
 const P=L.position;
 $('#pos').innerHTML=P?`<div class="top" style="display:flex;gap:10px;align-items:center"><span class="side ${P.dir===1?'L':'S'}">${P.dir===1?'LONG':'SHORT'}</span><span class="tag">${esc(P.qty_label||P.qty+' MNQ')}</span></div>
  <div class="grid g4" style="margin-top:12px">${kpi('Entry',P.entry?.toFixed?.(2))}${kpi('Stop',P.stop?.toFixed?.(2),'','dn')}${kpi('Target',P.target?.toFixed?.(2),esc(P.target_label||''),'up')}${kpi('Stop size',P.entry&&P.stop?Math.abs(P.entry-P.stop).toFixed(2)+' pts':'—')}</div>`
  :`<div class="empty">Flat · no open position. ${L.model_state?'State: '+esc(L.model_state):''}</div>`;
 const ev=L.events||[];
 $('#log').innerHTML=ev.length?ev.slice().reverse().map(e=>`<div><b>${new Date(e.t*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',timeZone:'America/New_York'})}</b>${esc(e.type.toUpperCase())} · ${esc(e.text)}</div>`).join(''):'<div class="empty">Quiet so far today.</div>';
 const led=L.ledger||[];
 $('#ledger').innerHTML=led.length?`<table><tr><th>Entry</th><th>Side</th><th>Trigger</th><th>Exit</th><th class="n">R</th><th class="n">$</th></tr>${led.map(v=>`<tr><td>${esc(v.entry)}</td><td>${esc(v.side)}</td><td>${esc(v.trigger)}</td><td>${esc(v.exit||'')}</td><td class="n ${cls(v.R)}">${v.R>0?'+':''}${v.R}</td><td class="n ${cls(v.usd)}">${v.taken===false?'skipped':smoney(v.usd)}${v.mult<1&&v.taken!==false?' ½':''}</td></tr>`).join('')}</table>`:'<div class="empty">No cloud paper trades yet. They appear here after the first trade.</div>';
 if(!R){return}
 const T=R.trades||[];
 const render=f=>{$('#tlist').innerHTML=T.filter(t=>f==='all'||(f==='win'&&t.r>0)||(f==='loss'&&t.r<=0)||(f==='half'&&t.half)).slice(0,40).map(t=>{const p=t.report||{};
  return `<div class="card trade"><div class="top"><span class="side ${t.side==='LONG'?'L':'S'}">${t.side}</span><b>${esc(p.date)} · ${esc(p.time)}</b><span class="${cls(t.r)}" style="margin-left:auto;font:700 15px var(--mono)">${t.r>0?'+':''}${t.r.toFixed(2)}R · ${smoney(t.pnl)}</span></div>
  <div class="k">Why it entered</div><ul>${(p.why||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul><div class="plan">${esc(p.plan)}</div><div class="plan">${esc(p.result)}</div>
  ${(p.lessons||[]).length?`<div>${p.lessons.map(l=>`<span class="tag">${esc(l)}</span>`).join('')}</div>`:''}</div>`}).join('')||'<div class="empty">None.</div>'};
 render('all');document.querySelectorAll('#tf button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tf button').forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.f)});
 const PER=R.periods||{},names=Object.keys(PER);
 $('#per').innerHTML=names.map(n=>`<button data-n="${esc(n)}" class="${n==='2026 YTD'?'on':''}">${esc(n)}</button>`).join('');
 const showP=n=>{const p=PER[n]||{},e=p.eval||{};
  $('#rk').innerHTML=kpi('Net',p.net,`${p.trades} trades · ${p.per_week}/week`,cls(p.net),'$')+kpi('Profit factor',p.pf,`win ${p.win_pct}%`,'','x')+kpi('Max drawdown',p.max_dd,`worst day ${money(p.worst_day)}`,'dn','$')+kpi('Weeks with 2+',p.weeks_2plus_pct,`median stop ${p.median_stop_pts} pts`,'','%');animate($('#rk'));
  const w2=e.within_2_weeks||{},w1=e.within_1_month||{},bb=e.back_to_back||{};
  $('#evo').innerHTML=kpi('Pass within 2 weeks',w2.pass_pct,`fail ${w2.fail_pct}%`,'up','%')+kpi('Pass within 1 month',w1.pass_pct,`fail ${w1.fail_pct}%`,'up','%')+kpi('Back to back',`${bb.passed??'—'} / ${bb.failed??'—'}`,'passed / failed','');animate($('#evo'))};
 showP(names.includes('2026 YTD')?'2026 YTD':names[0]);
 document.querySelectorAll('#per button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#per button').forEach(x=>x.classList.toggle('on',x===b));showP(b.dataset.n)});
 const eq=R.equity||[];
 if(window.Chart&&eq.length){const ctx=$('#eq').getContext('2d');const g=ctx.createLinearGradient(0,0,0,260);g.addColorStop(0,'rgba(124,92,255,.45)');g.addColorStop(1,'rgba(124,92,255,0)');
  new Chart(ctx,{type:'line',data:{labels:eq.map(x=>x[0]),datasets:[{data:eq.map(x=>x[1]),borderColor:'#22d3ee',borderWidth:2,pointRadius:0,fill:true,backgroundColor:g,tension:.15}]},
  options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>smoney(c.parsed.y)}}},interaction:{intersect:false,mode:'index'},scales:{x:{ticks:{color:'#6b7392',maxTicksLimit:6},grid:{display:false}},y:{ticks:{color:'#6b7392',callback:v=>money(v)},grid:{color:'rgba(255,255,255,.05)'}}}}})}
 const M=R.months||{};
 $('#months').innerHTML=`<table><tr><th>Month</th><th class="n">Trades</th><th class="n">Wins</th><th class="n">Net</th></tr>${Object.entries(M).reverse().slice(0,24).map(([m,v])=>`<tr><td>${m}</td><td class="n">${v.trades}</td><td class="n">${v.wins}</td><td class="n ${cls(v.net)}">${smoney(v.net)}</td></tr>`).join('')}</table>`;
 $('#buckets').innerHTML=`<table><tr><th>Stop size</th><th class="n">Trades</th><th class="n">Win %</th><th class="n">Avg R</th><th class="n">Micros</th><th class="n">$ risk</th></tr>${(R.stop_buckets||[]).map(b=>`<tr><td>${b.stop_pts} pts</td><td class="n">${b.trades}</td><td class="n">${b.win_pct}</td><td class="n ${cls(b.avg_r)}">${b.avg_r>0?'+':''}${b.avg_r}</td><td class="n">${b.median_micros}</td><td class="n">${money(b.median_risk_usd)}</td></tr>`).join('')}</table>`;
 const me=R.meta||{};$('#meth').innerHTML=`${esc(me.data?.source)} · ${esc(me.data?.first_session)} → ${esc(me.data?.last_session)} (${me.data?.sessions} sessions).<br>${esc(me.method)}<br>Costs: ${esc(me.costs?.instrument)}, $${me.costs?.commission_round_trip_per_micro} round trip per micro, ${me.costs?.slippage_pts} pt slippage. Backtests are not a promise.`;
 const S=R.lessons?.summary||{};
 $('#lsum').innerHTML=kpi('Stopped within 2 bars',S.losses?.stopped_within_2_bars_pct,'of losing trades','dn','%')+kpi('Never moved in favour',S.losses?.never_reached_0_3R_pct,'of losing trades','dn','%')+kpi('Winners hit target',S.wins?.hit_target_pct,`avg win +${S.wins?.avg_win_r}R`,'up','%');animate($('#lsum'));
 const F=R.lessons?.factors||[];
 $('#factors').innerHTML=`<table><tr><th>Condition</th><th class="n">2021-25 avg R</th><th class="n">2026 avg R</th><th>Verdict</th></tr>${F.map(f=>{const v=f.verdict||'';const c=v.startsWith('better')?'vg':v.startsWith('worse')?'vb':'vm';
  return `<tr><td>${esc(f.factor)}: <b>${esc(f.value)}</b></td><td class="n ${cls(f.avg_r_2021_25)}">${f.avg_r_2021_25??'—'}</td><td class="n ${cls(f.avg_r_2026)}">${f.avg_r_2026??'—'}</td><td><span class="verdict ${c}">${esc(v)}</span></td></tr>`}).join('')}</table>`;
 $('#howl').textContent=S.how_it_learns||'';
}).catch(e=>{$('#ago').textContent='data unavailable';$('#dot').classList.add('off')});
</script>
