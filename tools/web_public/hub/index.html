<!doctype html>
<html lang="en" data-theme="agora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olympus hub</title>
<meta name="description" content="An OLYMPUS hub: one of the owner's jobs on one page. A tab per job, the best app for it first with its live status, the others below, duplicates folded under 'Other views of the same'.">
<meta name="theme-color" content="#14110e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg">
<!-- OLYMPUS HUB PAGE (2026-11-14, docs/OLYMPUS_IA_V2.md). hub/?h=<hub>&t=<tab>: today | bots | kalshi | money | plan | research | jarvis | worlds | settings.
     The hubs and their tabs are DATA in olympus/gate-catalog.js (HUBS + each app's hub / section / fold); the live lines come from olympus/hub-status.js.
     Each tab: the job in one line, the BEST app for it as a big card (its live status from its jarvis.json, "Open", and "Show it here" = the app embedded
     in a frame), the other apps for that job as rows, and the duplicates folded under "Other views of the same" (nothing removed: every old app URL works).
     Breadcrumb Home > Hub and "Go to" come from olympus/gate-nav.js. Read only: home.json (through truth.js), kalshi.json, money/scoreboard.json,
     the hub's apps' jarvis.json, the Planner's summary on this phone. It sends nothing. Text only through textContent / createElementNS. -->
<style>html, body { background: var(--oly-th-n3, #14110e); color: var(--oly-th-n37, #f3ece0); margin: 0; }</style>
<script>(function () { var d = document.documentElement; try { if (window.top !== window) d.className += ' framed'; } catch (e) { d.className += ' framed'; }
  /* this hub's page id for the theme engine ('hub-<id>': the Gate's Mix maps it to its hub, olympus/themes.js pageId), then the look it painted here
     last time ('olympus.theme.paint.page.hub-<id>'), before the first frame */
  var m = /[?&]h=([a-z]+)/.exec(location.search || ''); if (!m) return;
  d.setAttribute('data-oly-district', m[1]); d.setAttribute('data-oly-page', 'hub-' + m[1]);
  try {
    var ls = window.localStorage, p = JSON.parse(ls.getItem('olympus.theme.paint.page.hub-' + m[1]) || 'null');
    if (p && p.vars && p.id && p.id !== 'agora' && (ls.getItem('olympus.theme') || ls.getItem('olympus.themeMix'))) {
      var on = []; for (var k in p.vars) { d.style.setProperty(k, p.vars[k]); on.push(k); }
      d.setAttribute('data-oly-theme', p.id); d.setAttribute('data-oly-scheme', p.scheme === 'light' ? 'light' : 'dark'); window.__olyPaint = on;
      if (p.style) d.setAttribute('data-oly-style', p.style);
      var mt = document.querySelector('meta[name="theme-color"]'); if (mt && p.meta) mt.setAttribute('content', p.meta);
    }
  } catch (e) { /* the default look */ }
})();</script>
<link rel="stylesheet" href="../olympus/agora.css?v=a4">
<link rel="stylesheet" href="hub.css?v=h1">
<script src="../olympus/themes.js?v=o5"></script>
<script src="../olympus/a11y.js" defer></script>
<script src="../olympus/gate-catalog.js?v=g2"></script>
<script src="../olympus/hub-status.js?v=h1"></script>
<script src="../olympus/gate-nav.js?v=g3" data-app="hub" defer></script>
<script src="hub.js?v=h1" defer></script>
</head>
<body>
<main id="hub" class="hb-main">
  <header class="hb-head" id="hubHead">
    <h1 class="hb-title" id="hubName">Your hubs</h1>
    <p class="hb-q" id="hubQ">Pick the job you want to do.</p>
  </header>

  <section class="hb-now" id="hubNow" aria-label="Right now in this hub" hidden>
    <div class="hb-facts" id="hubFacts" role="status" aria-live="polite"></div>
    <p class="hb-nowfoot" id="hubFoot"></p>
  </section>

  <div class="hb-tabs" id="tabs" role="tablist" aria-label="Jobs in this hub" hidden></div>
  <section class="hb-panel" id="panel" role="tabpanel" hidden></section>

  <section class="hb-see" id="see" aria-labelledby="seeH" hidden>
    <h2 class="hb-h2" id="seeH">Also useful here, from other hubs</h2>
    <div class="hb-list" id="seeList"></div>
  </section>

  <nav class="hb-index" id="hubIndex" aria-labelledby="indexH">
    <h2 class="hb-h2" id="indexH">All hubs</h2>
    <div class="hb-chips" id="hubChips">
      <a class="hb-chip" data-hub="today" href="index.html?h=today">Today</a>
      <a class="hb-chip" data-hub="bots" href="index.html?h=bots">Bots &amp; Evals</a>
      <a class="hb-chip" data-hub="kalshi" href="index.html?h=kalshi">Kalshi</a>
      <a class="hb-chip" data-hub="money" href="index.html?h=money">My Money</a>
      <a class="hb-chip" data-hub="plan" href="index.html?h=plan">Plan &amp; Day</a>
      <a class="hb-chip" data-hub="research" href="index.html?h=research">Research</a>
      <a class="hb-chip" data-hub="jarvis" href="index.html?h=jarvis">Jarvis</a>
      <a class="hb-chip" data-hub="worlds" href="index.html?h=worlds">Worlds</a>
      <a class="hb-chip" data-hub="settings" href="index.html?h=settings">Settings &amp; Help</a>
      <a class="hb-chip hb-home" href="../gate/index.html">Home</a>
    </div>
  </nav>

  <footer class="hb-foot"><p>Read only: nothing here can trade or change a bot.</p></footer>
</main>
</body>
</html>
