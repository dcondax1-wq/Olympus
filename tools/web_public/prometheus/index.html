<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Forge</title>
<meta name="description" content="PROMETHEUS: a genetic algorithm evolves the live LIT strategy's knobs on 2026 H1 and checks every survivor on 2026 H2 and 2021-25.">
<meta name="theme-color" content="#120806">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../jarvis/icon-192.png?v=j4">
<!-- THE FORGE (tools/web_public/prometheus/, 2026-11-03): the PROMETHEUS strategy-evolution forge (tools/prometheus/forge.py
     writes forge.json + jarvis.json here). Read-only research page: it never changes a strategy. Look: forge.css; data:
     forgecore.js; 3D arena + HUD: forge.js (three.js r160 from ../jarvis/); the flames' fire shader: flames.js; the lineage
     graph: lineage.js. One top bar (title, stats, the verdict banner), one bottom bar, one bottom sheet. Bump ?v= when one changes. -->
<script>(function () { var d = document.documentElement; try { if (window.top !== window) d.classList.add('framed'); } catch (e) { d.classList.add('framed'); } })();</script>
<link rel="stylesheet" href="../olympus/olympus.css?v=o2">
<script src="../olympus/themes.js?v=o2"></script>
<script src="../olympus/olympus.js?v=o2" data-app="prometheus"></script>
<script src="../olympus/intro-app.js?v=i1" defer></script>
<link rel="stylesheet" href="forge.css?v=f4">
</head>
<body>
<canvas id="arena" aria-label="The forge arena: each flame is one strategy variant" role="img"></canvas>
<div id="nogl" class="nogl" hidden></div>
<header class="hud" id="hud">
  <div class="title">
    <h1>THE FORGE</h1>
    <p class="sub" id="sub">PROMETHEUS · evolving LIT on 2026 H1</p>
    <span class="tag" id="demo" hidden>DEMO DATA</span>
  </div>
  <div class="stats" id="stats" aria-live="polite">
    <div class="st"><span class="k" title="the best creature's 2026 H1 $ per month">BEST H1/MO</span><b id="s-h1">—</b><i id="s-h1l"></i></div>
    <div class="st"><span class="k" title="the same creature on 2026 H2 (never seen by the forge)">ITS H2/MO</span><b id="s-h2">—</b><i id="s-h2l"></i></div>
    <div class="st"><span class="k" title="eval pass / fail % within 10 sessions (2026 H1)">P10/F10</span><b id="s-pf">—</b><i id="s-pfl"></i></div>
    <div class="st"><span class="k">TR/WK</span><b id="s-tpw">—</b><i id="s-tpwl"></i></div>
    <div class="st"><span class="k">GEN</span><b id="s-gen">—</b><i id="s-gen2"></i></div>
  </div>
  <button type="button" class="banner" id="banner" aria-controls="truth"><b id="bn-t">LIVE LIT STILL BEST</b><span id="bn-s"></span></button>
  <div class="legend" aria-hidden="true">
    <span><em class="dot live"></em>live LIT</span><span><em class="dot champ"></em>champion's lineage</span><span><em class="dot hot"></em>fitter = taller, hotter</span>
  </div>
</header>
<footer class="dock" id="dock">
  <div class="row">
    <button type="button" class="play" id="play" aria-label="Play the evolution">▶</button>
    <label class="slider"><span class="vh">Generation</span>
      <input type="range" id="gen" min="0" max="0" step="1" value="0" aria-label="Generation">
    </label>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter the creatures by half-year pass or fail">
    <button type="button" data-f="all" aria-pressed="true">All <small></small></button>
    <button type="button" data-f="h1" aria-pressed="false">H1 ✓ <small></small></button>
    <button type="button" data-f="h2" aria-pressed="false">H2 ✓ <small></small></button>
    <button type="button" data-f="both" aria-pressed="false">Both ✓ <small></small></button>
    <button type="button" data-f="fail2" aria-pressed="false">H2 ✗ <small></small></button>
  </div>
  <p class="chipn" id="chipn" aria-live="polite"></p>
  <nav class="tabs" aria-label="Panels">
    <button type="button" class="truth" id="truthBtn" aria-controls="truth" aria-expanded="false">Verdict</button>
    <button type="button" class="truth" id="linBtn" aria-controls="truth" aria-expanded="false">Lineage</button>
    <button type="button" class="truth" id="hallBtn" aria-controls="truth" aria-expanded="false">Hall</button>
  </nav>
</footer>
<section class="card" id="card" hidden role="dialog" aria-modal="false" aria-labelledby="card-h">
  <button type="button" class="x" id="cardX" aria-label="Close">✕</button>
  <h2 id="card-h"></h2>
  <p class="meta" id="card-m"></p>
  <div id="card-b"></div>
</section>
<section class="card truthp" id="truth" hidden role="dialog" aria-modal="false" aria-labelledby="truth-h">
  <button type="button" class="x" id="truthX" aria-label="Close">✕</button>
  <h2 id="truth-h">Does the fire survive H2?</h2>
  <div id="truth-b"></div>
  <div id="lin-b" hidden></div>
  <div id="hall-b" hidden></div>
</section>
<script type="module" src="forge.js?v=f4"></script>
</body>
</html>
