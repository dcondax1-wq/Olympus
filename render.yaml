# Render.com blueprint: always-on dashboard + paper bot (PC can be off).
# New > Blueprint > pick this repo. Render asks for LE_DASH_PASSWORD (sync: false = you type it there, it is never in git).
# Plan: the server peaks around 510 MB (5-year history + dashboard backtests), so 512 MB plans (free/starter) risk
# out-of-memory restarts; "standard" (2 GB) is safe. Free instances also sleep after 15 min idle (stops the paper bot).
services:
  - type: web
    name: liquidity-engine
    runtime: docker
    plan: standard
    region: ohio
    healthCheckPath: /api/health/ping
    envVars:
      - key: LE_CLOUD
        value: "1"
      - key: LE_DASH_PASSWORD
        sync: false
      - key: TZ
        value: America/New_York
