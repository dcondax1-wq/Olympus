# Cloud paper monitor: runs the live paper bot's decision loop on a schedule so it works with the PC off.
# Publishes README.md + chart.png + state.json to the `dashboard` branch (open it in the GitHub app), and the web dashboard
# (tools/web_public + data.json, a Home Screen app) to demetrades2000-coder.github.io/nq-dashboard.
# Paper only - never places orders. Free: about 1,200-1,500 of the 2,000 monthly Actions minutes for private repos, plus the
# fast-entry watcher (last step) capped at 550 a month (~1,800 in all, tests/test_lit_watch.py).
# Phone notifications (free Web Push to the Home Screen app, docs/NOTIFICATIONS.md): automatic. The app posts its subscription
# to the ntfy.sh relay when the owner taps Allow; this job reads it, keeps it in state.json and sends an entry and an outcome
# notice for every trade. The notification key is made on the first run and kept in the Actions cache (never committed or
# printed); a secret LE_VAPID_PRIVATE overrides it. Telegram / Discord (TG_TOKEN + TG_CHAT, DISCORD_WEBHOOK) stay off unless
# the repository variable LE_ALERTS_CHAT is 1.
name: cloud-monitor

on:
  schedule:
    - cron: "2,32 6-21 * * 1-5"      # UTC, half-hourly; covers 02:00-16:25 ET in summer (EDT) and winter (EST) time (LIT trades London); ~32 jobs a day, ~2 of them exit at the guard
    - cron: "32 5 * * 1-5"           # 05:32 UTC = 01:32 ET in summer (EDT): the night check that the Surface is awake before 02:00 ET (in winter 06:02 / 06:32 UTC = 01:02 / 01:32 ET already do it); +1 job a day
    - cron: "47 21 * * 0"            # Sunday ~17:47 ET: the learning loop's weekly review (engine/lit_learn.py); Monday's first run catches up if it is skipped
  workflow_dispatch:
    inputs:
      push_test:
        description: "Send a test notification to the phone app"
        type: boolean
        default: false
      learn_review:
        description: "Run the learning loop's review now (normally every Sunday)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cloud-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 70              # a normal run ~1 min; the fast-entry watcher (tools/lit_watch.py) may add up to 55
    steps:
      - name: Market-hours guard (ET)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          dow=$(TZ=America/New_York date +%u); h=$(TZ=America/New_York date +%-H); m=$(TZ=America/New_York date +%-M)
          mod=$((h*60+m)); go=0
          if [ "${{ github.event.schedule }}" = "47 21 * * 0" ]; then go=1; fi   # Sunday: the learning loop's weekly review
          if [ "$dow" -le 5 ]; then
            # LIT (live_model.json since 2026-10-18) enters 02:00-15:30 ET, mostly London: half-hourly from 01:30 (the night
            # check that the Surface is awake, engine/push.pc_outage) to 16:25 (end-of-day summary), ~31 runs a day.
            # Every scheduled run inside the window goes: GitHub starts scheduled runs 5-28 min late, and the old
            # "minute % 30 < 15" test dropped about half of them (2026-10-20: the 02:21 ET run was skipped, so the first
            # "PC silent" push came at 03:13 ET). Each cron firing starts one run, so there are no duplicates to drop.
            # Minutes (private repo, 2,000 free a month): ~29 full runs x ~2 billed min x 22 days = ~1,300 + the watcher's 550 cap.
            if [ $mod -ge 90 ] && [ $mod -le 1000 ]; then go=1; fi            # 01:30-16:40 ET (a late 16:02 run still makes the summary)
            # the midday lull 11:30-13:30 ET (no killzone) keeps the old filter: about one run an hour there
            if [ $mod -ge 690 ] && [ $mod -lt 810 ] && [ $((m % 30)) -ge 15 ]; then go=0; fi
          fi
          echo "ET $(TZ=America/New_York date '+%a %H:%M') -> go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - name: Checkout (engine + history only)
        if: steps.guard.outputs.go == '1'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine/
            /tools/
            /data/news/
            /data/shadow_ledger_seed.json
            /live_model.json
            /live_model_engine.json
            /live_model_lit.json
            /second_model.json
            /data/NQ_rolls.json
            /research/second/*.json
            /research/stophunt/*.json
            /research/props/*.json
            /research/lab/rule_log.json
            /data/VIX_1d.csv
            /data/VXN_1d.csv
            /data/NQ_5m.csv
            /data/NQ_1m.csv
            /data/lit_journal.jsonl
            /data/lit_learning.json
            /requirements-cloud.txt
            /scripts/cloud_publish.sh
            /research/lab/backtest_live.json
            /research/lab/replays.json
            /research/lab/variant_results.json
            /research/lab/montecarlo.json
            /research/lab/intraday_heat.json
            /research/lab/calendar_effects.json
            /research/lab/backtest_engine.json
            /research/lit/*.md
            /research/lit/mffu_rules.json
            /research/lit/eventual.json
            /research/lit/uprisk_eval.json
            /research/archive/engine-2026-10-17/
            /research/study/
            /research/runs/*.json
            /research/writeups/
            /research/*.md
            /research/lab/*.md
            /research/lab/chart_examples/
            /STRATEGY.md
            /web/icons/

      - name: Notification key (Actions cache; made by the monitor on the first run, refreshed every run)
        if: steps.guard.outputs.go == '1'
        uses: actions/cache@v4
        with:
          path: .le_push
          key: le-vapid-v1-${{ github.run_id }}
          restore-keys: |
            le-vapid-v1-

      - name: Python
        if: steps.guard.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install
        if: steps.guard.outputs.go == '1'
        run: |
          pip install -q -r requirements-cloud.txt
          # Web Push sender; engine/push.py has a built-in sender (cryptography only) if this ever fails to install
          pip install -q pywebpush==2.5.0 || echo "pywebpush not installed: engine/push.py uses its built-in sender"

      - name: Control branch for the phone remote control (made once; never overwritten)
        if: steps.guard.outputs.go == '1'
        continue-on-error: true
        run: python tools/init_control_branch.py || true     # engine/remote_ctl.py, docs/REMOTE_CONTROL.md

      - name: Load previous dashboard state
        if: steps.guard.outputs.go == '1'
        run: |
          mkdir -p dash
          if git fetch -q --depth 1 origin dashboard 2>/dev/null; then
            git show FETCH_HEAD:state.json > dash/state.json 2>/dev/null || rm -f dash/state.json
            git show FETCH_HEAD:shadow_ledger.json > dash/shadow_ledger.json 2>/dev/null || rm -f dash/shadow_ledger.json
            git show FETCH_HEAD:bars_1m.csv > dash/bars_1m.csv 2>/dev/null || rm -f dash/bars_1m.csv     # LIT 1m bars (12 days)
            # no Yahoo: the PC's NinjaTrader 5m bars the cloud has received so far (engine/pcbars.py CloudFeed store, 75 days)
            git show FETCH_HEAD:pc_bars_5m.csv > dash/pc_bars_5m.csv 2>/dev/null || rm -f dash/pc_bars_5m.csv
            git show FETCH_HEAD:watch.json > dash/watch.json 2>/dev/null || rm -f dash/watch.json        # fast-entry watcher record
            # the learning loop (engine/lit_learn.py): the append-only trade journal and the learned knobs / decisions log
            git show FETCH_HEAD:lit_journal.jsonl > dash/lit_journal.jsonl 2>/dev/null || rm -f dash/lit_journal.jsonl
            git show FETCH_HEAD:lit_learning.json > dash/lit_learning.json 2>/dev/null || rm -f dash/lit_learning.json
            # recap cards + brief image + their index (tools/recap.py): each drawn once, the newest 30 kept
            git archive --format=tar FETCH_HEAD recaps 2>/dev/null | tar -x -C dash 2>/dev/null || true
            # trade pictures (engine/trade_chart.py): one PNG per paper trade of each strategy + charts/index.json, newest 60 kept
            git archive --format=tar FETCH_HEAD charts 2>/dev/null | tar -x -C dash 2>/dev/null || true
          fi

      - name: Run paper monitor
        if: steps.guard.outputs.go == '1'
        env:
          LE_VAPID_PRIVATE: ${{ secrets.LE_VAPID_PRIVATE }}
          LE_VAPID_KEY_FILE: .le_push/vapid.json
          LE_PUSH_SUBS: ${{ secrets.LE_PUSH_SUBS }}
          LE_PUSH_SUBS_2: ${{ secrets.LE_PUSH_SUBS_2 }}
          LE_PUSH_SUBS_3: ${{ secrets.LE_PUSH_SUBS_3 }}
          LE_PUSH_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.push_test && '1' || '' }}
          LE_LEARN_REVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.learn_review && '1' || '' }}
          LE_PUSH_EXTRA: ${{ vars.LE_PUSH_EXTRA }}
          LE_ALERTS_CHAT: ${{ vars.LE_ALERTS_CHAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MPLBACKEND: Agg
        run: python tools/cloud_monitor.py --out dash

      - name: News hub (USD calendar + headlines, free sources; never fails the run)
        if: steps.guard.outputs.go == '1'
        timeout-minutes: 5
        continue-on-error: true
        run: python tools/news_hub.py --out data/news/hub.json || true

      - name: Publish dashboard branch
        if: steps.guard.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dash
          git init -q -b dashboard
          git config user.name "liquidity-engine-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dashboard $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dashboard

      - name: Publish web dashboard (public repo nq-dashboard, GitHub Pages)
        if: steps.guard.outputs.go == '1'
        env:
          DASH_KEY: ${{ secrets.DASH_DEPLOY_KEY }}
        run: |
          python tools/build_web_dashboard.py --state dash/state.json --chart dash/chart.png --out site
          mkdir -p ~/.ssh && echo "$DASH_KEY" > ~/.ssh/dash_key && chmod 600 ~/.ssh/dash_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd site
          git init -q -b main
          git config user.name "liquidity-engine-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dashboard $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/dash_key -o IdentitiesOnly=yes" git push -q -f git@github.com:demetrades2000-coder/nq-dashboard.git main
          rm -f ~/.ssh/dash_key

      # Fast entries (owner 2026-10-18: "when there's a signal, it needs to send an entry"): when this run found a LIT setup
      # armed (limit working / tapped) or forming, keep reading the PC's NinjaTrader bars from the heartbeat branch every 30 s
      # (no Yahoo, engine/pcbars.py; Yahoo NQ=F only with live_model.json "no_yahoo": false) until it fills or goes away (max 55 min),
      # and on every change run the monitor again (ledger + phone notification) and publish (scripts/cloud_publish.sh).
      # Costs minutes only on those stretches: at most 15 min a day on forming setups, 550 a month in all.
      - name: Watch an armed / forming LIT setup (fast entry notice)
        if: steps.guard.outputs.go == '1' && github.event.schedule != '47 21 * * 0'
        timeout-minutes: 62          # cap 55 + the last full run / publish; a hang or a kill never fails the job (cache still saved)
        continue-on-error: true
        env:
          LE_VAPID_PRIVATE: ${{ secrets.LE_VAPID_PRIVATE }}
          LE_VAPID_KEY_FILE: .le_push/vapid.json
          LE_PUSH_SUBS: ${{ secrets.LE_PUSH_SUBS }}
          LE_PUSH_SUBS_2: ${{ secrets.LE_PUSH_SUBS_2 }}
          LE_PUSH_SUBS_3: ${{ secrets.LE_PUSH_SUBS_3 }}
          LE_PUSH_EXTRA: ${{ vars.LE_PUSH_EXTRA }}
          LE_ALERTS_CHAT: ${{ vars.LE_ALERTS_CHAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          DASH_KEY: ${{ secrets.DASH_DEPLOY_KEY }}
          MPLBACKEND: Agg
        run: python tools/lit_watch.py --out dash --cap 55 --every 30 --forming-budget 15 --month-budget 550 || true
