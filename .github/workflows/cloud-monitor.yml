# Cloud paper monitor: runs the live paper bot's decision loop on a schedule so it works with the PC off.
# Publishes README.md + chart.png + state.json to the `dashboard` branch (open it in the GitHub app), and the web dashboard
# (tools/web_public + data.json, a Home Screen app) to demetrades2000-coder.github.io/nq-dashboard.
# Paper only - never places orders. Free: about 1,200-1,500 of the 2,000 monthly Actions minutes for private repos.
# Phone notifications (free Web Push to the Home Screen app, docs/NOTIFICATIONS.md): automatic. The app posts its subscription
# to the ntfy.sh relay when the owner taps Allow; this job reads it, keeps it in state.json and sends an entry and an outcome
# notice for every trade. The notification key is made on the first run and kept in the Actions cache (never committed or
# printed); a secret LE_VAPID_PRIVATE overrides it. Telegram / Discord (TG_TOKEN + TG_CHAT, DISCORD_WEBHOOK) stay off unless
# the repository variable LE_ALERTS_CHAT is 1.
name: cloud-monitor

on:
  schedule:
    - cron: "2,32 6-21 * * 1-5"      # UTC, half-hourly; covers 02:00-16:25 ET in summer (EDT) and winter (EST) time (LIT trades London); ~32 jobs a day, ~2 of them exit at the guard
  workflow_dispatch:
    inputs:
      push_test:
        description: "Send a test notification to the phone app"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cloud-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Market-hours guard (ET)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          dow=$(TZ=America/New_York date +%u); h=$(TZ=America/New_York date +%-H); m=$(TZ=America/New_York date +%-M)
          mod=$((h*60+m)); go=0
          if [ "$dow" -le 5 ]; then
            # LIT (live_model.json since 2026-10-18) enters 02:00-15:30 ET, mostly London: half-hourly from 02:00 keeps the
            # run count (~30 a day) and the free Actions minutes where they were with the old 15-min killzone cadence
            if [ $mod -ge 965 ] && [ $mod -le 985 ]; then go=1; fi            # 16:05-16:25 end-of-day summary
            if [ $mod -ge 120 ] && [ $mod -le 985 ] && [ $((m % 30)) -lt 15 ]; then go=1; fi   # 02:00-16:25 half-hourly
          fi
          echo "ET $(TZ=America/New_York date '+%a %H:%M') -> go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - name: Checkout (engine + history only)
        if: steps.guard.outputs.go == '1'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine/
            /tools/
            /data/news/
            /data/shadow_ledger_seed.json
            /live_model.json
            /live_model_engine.json
            /live_model_lit.json
            /data/VIX_1d.csv
            /data/VXN_1d.csv
            /requirements-cloud.txt
            /research/lab/backtest_live.json
            /research/lab/replays.json
            /research/lab/variant_results.json
            /research/lab/montecarlo.json
            /research/lab/intraday_heat.json
            /research/lab/calendar_effects.json
            /research/study/
            /research/runs/*.json
            /research/writeups/
            /research/*.md
            /research/lab/*.md
            /STRATEGY.md
            /web/icons/

      - name: Notification key (Actions cache; made by the monitor on the first run, refreshed every run)
        if: steps.guard.outputs.go == '1'
        uses: actions/cache@v4
        with:
          path: .le_push
          key: le-vapid-v1-${{ github.run_id }}
          restore-keys: |
            le-vapid-v1-

      - name: Python
        if: steps.guard.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install
        if: steps.guard.outputs.go == '1'
        run: |
          pip install -q -r requirements-cloud.txt
          # Web Push sender; engine/push.py has a built-in sender (cryptography only) if this ever fails to install
          pip install -q pywebpush==2.5.0 || echo "pywebpush not installed: engine/push.py uses its built-in sender"

      - name: Load previous dashboard state
        if: steps.guard.outputs.go == '1'
        run: |
          mkdir -p dash
          if git fetch -q --depth 1 origin dashboard 2>/dev/null; then
            git show FETCH_HEAD:state.json > dash/state.json 2>/dev/null || rm -f dash/state.json
            git show FETCH_HEAD:shadow_ledger.json > dash/shadow_ledger.json 2>/dev/null || rm -f dash/shadow_ledger.json
            git show FETCH_HEAD:bars_1m.csv > dash/bars_1m.csv 2>/dev/null || rm -f dash/bars_1m.csv     # LIT 1m bars (12 days)
          fi

      - name: Run paper monitor
        if: steps.guard.outputs.go == '1'
        env:
          LE_VAPID_PRIVATE: ${{ secrets.LE_VAPID_PRIVATE }}
          LE_VAPID_KEY_FILE: .le_push/vapid.json
          LE_PUSH_SUBS: ${{ secrets.LE_PUSH_SUBS }}
          LE_PUSH_SUBS_2: ${{ secrets.LE_PUSH_SUBS_2 }}
          LE_PUSH_SUBS_3: ${{ secrets.LE_PUSH_SUBS_3 }}
          LE_PUSH_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.push_test && '1' || '' }}
          LE_PUSH_EXTRA: ${{ vars.LE_PUSH_EXTRA }}
          LE_ALERTS_CHAT: ${{ vars.LE_ALERTS_CHAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MPLBACKEND: Agg
        run: python tools/cloud_monitor.py --out dash

      - name: News hub (USD calendar + headlines, free sources; never fails the run)
        if: steps.guard.outputs.go == '1'
        run: python tools/news_hub.py --out data/news/hub.json || true

      - name: Publish dashboard branch
        if: steps.guard.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dash
          git init -q -b dashboard
          git config user.name "liquidity-engine-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dashboard $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dashboard

      - name: Publish web dashboard (public repo nq-dashboard, GitHub Pages)
        if: steps.guard.outputs.go == '1'
        env:
          DASH_KEY: ${{ secrets.DASH_DEPLOY_KEY }}
        run: |
          python tools/build_web_dashboard.py --state dash/state.json --chart dash/chart.png --out site
          mkdir -p ~/.ssh && echo "$DASH_KEY" > ~/.ssh/dash_key && chmod 600 ~/.ssh/dash_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd site
          git init -q -b main
          git config user.name "liquidity-engine-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dashboard $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/dash_key -o IdentitiesOnly=yes" git push -q -f git@github.com:demetrades2000-coder/nq-dashboard.git main
          rm -f ~/.ssh/dash_key
