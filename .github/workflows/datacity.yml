# OLYMPUS DATA CITY, nightly (tools/datacity, research only, paper only: it never touches live_model*.json or any order).
# After the close: append the PC's NinjaTrader 5m bars (heartbeat branch, no Yahoo), rebuild the event table
# incrementally, re-score the ~67k combinations with the FDR / placebo / holdout guards, update the leaderboard history
# and publish the small JSON (research/datacity/*.json, < 2 MB) as ONE force-pushed commit on the `datacity` branch.
# The 3D page (tools/web_public/datacity/) reads city.json + jarvis.json from that branch once the site build copies them.
# Free: ~2-3 billed minutes a night (the event table is cached between runs).
name: datacity

on:
  schedule:
    - cron: "37 3 * * 2-6"           # 03:37 UTC Tue-Sat = 22:37 ET (EST) / 23:37 ET (EDT), after the Mon-Fri close
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild the event table from scratch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: datacity
  cancel-in-progress: false

jobs:
  city:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (code + the TradingView history only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine/
            /tools/
            /live_model.json
            /live_model_engine.json
            /live_model_lit.json
            /second_model.json
            /requirements-cloud.txt
            /data/NQ_5m.csv
            /data/ES_5m.csv
            /data/VIX_1d.csv
            /data/VXN_1d.csv
            /data/NQ_rolls.json
            /data/news/events.csv
            /research/runs/lit_live.json

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install
        run: pip install -q -r requirements-cloud.txt

      - name: Event-table cache (incremental runs)
        uses: actions/cache@v4
        with:
          path: research/datacity/_cache
          key: datacity-events-v1-${{ github.run_id }}
          restore-keys: |
            datacity-events-v1-

      - name: Previous run (history + the appended PC bars)
        run: |
          mkdir -p research/datacity
          if git fetch -q --depth 1 origin datacity 2>/dev/null; then
            for f in history.json bars_extra.csv.gz; do
              git show "FETCH_HEAD:$f" > "research/datacity/$f" 2>/dev/null || rm -f "research/datacity/$f"
            done
          fi

      - name: Run the data machine
        run: python -X utf8 -m tools.datacity --heartbeat --no-web --no-run ${{ inputs.full && '--full' || '' }}

      - name: Publish the datacity branch (one commit, JSON + the bar store)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pub
          cp research/datacity/*.json pub/
          cp research/datacity/bars_extra.csv.gz pub/ 2>/dev/null || true
          du -ch pub/* | tail -1
          cd pub
          git init -q -b datacity
          git config user.name "liquidity-engine-datacity"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "datacity $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" datacity
