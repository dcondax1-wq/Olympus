# OLYMPUS KALSHI CITY, every 6 hours (tools/kalshi_edges.py: READ ONLY, paper/research only, no secret, no Kalshi call, no order).
# Reads the public kalshi-feed (raw.githubusercontent.com .../kalshi-feed/main/kalshi.json: its last 40 settled bets + whole-life totals),
# adds the bets it has not seen to the ledger, re-measures every edge and appends dated lessons to the learning log, then publishes
# edges.json + learning_log.json + ledger.json + jarvis.json as ONE force-pushed commit on the `kalshicity` branch (the engine's memory
# lives there between runs). The site build (tools/cronos/site.py) copies edges.json, learning_log.json and the card into kalshicity/
# at the next cloud-monitor publish; ledger.json stays on the branch. The feed window is about a day of bets, so 6 hours loses none.
# Free and tiny: stdlib Python only (no pip, no cache), ~0.5 min a run, a commit only when something changed (~60-120 of 2,000 min/month).
# No secrets: GITHUB_TOKEN with contents: write, like datacity.yml and cronos.yml; it pushes only the kalshicity branch (never main).
name: kalshicity

on:
  schedule:
    - cron: "17 */6 * * *"           # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshicity
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (the engine and its seed only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/__init__.py
            /tools/kalshi_edges.py
            /tools/kalshi_whatif.py
            /tools/web_public/kalshicity/edges.json
            /tools/web_public/kalshicity/ledger.json
            /tools/web_public/kalshicity/learning_log.json
            /tools/web_public/kalshicity/jarvis.json
            /tools/web_public/kalshicity/whatif.json

      - name: Previous state (the kalshicity branch, else the repo's seed)
        run: |
          mkdir -p state prev
          if git fetch -q --depth 1 origin kalshicity 2>/dev/null; then
            for f in edges.json ledger.json learning_log.json jarvis.json whatif.json; do
              git show "FETCH_HEAD:$f" > "state/$f" 2>/dev/null || rm -f "state/$f"
            done
            cp -f state/*.json prev/ 2>/dev/null || true
          else
            cp tools/web_public/kalshicity/*.json state/
          fi

      - name: Learn (read the public feed, re-measure every edge)
        id: learn
        continue-on-error: true           # an unreachable feed leaves the branch as it was (stale beats invented): no red job, no commit
        run: python3 -X utf8 tools/kalshi_edges.py --out state

      - name: What-if (the owner's past bets under three simple rules, suggestions only)
        continue-on-error: true
        run: python3 -X utf8 tools/kalshi_whatif.py --out state/whatif.json

      - name: Publish the kalshicity branch (one commit, only when something changed)
        if: steps.learn.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d prev ] && [ -n "$(ls -A prev)" ] && diff -rq prev state >/dev/null; then
            echo "nothing new: no commit"; exit 0
          fi
          du -ch state/*.json | tail -1
          cd state
          git init -q -b kalshicity
          git config user.name "liquidity-engine-kalshicity"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "kalshicity $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" kalshicity
