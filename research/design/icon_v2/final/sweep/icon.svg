<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Liquidity Engine app icon, concept "Sweep": one glowing glass candle whose lower wick pierces the cyan
       liquidity line (the sweep). Full bleed 1024 x 1024, opaque; iOS / Android apply their own mask.
       Assets: research/design/icon_v2/src/build.py (the maskable variant is this art scaled 0.8 about the centre). -->
  <defs>
    <radialGradient id="bg" cx="512" cy="430" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d1088"/><stop offset="0.38" stop-color="#1b0750"/><stop offset="0.75" stop-color="#0b0322"/><stop offset="1" stop-color="#05010f"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="200" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6fe6"/><stop offset="0.3" stop-color="#f21ccf"/><stop offset="0.68" stop-color="#a91ce6"/><stop offset="1" stop-color="#5b2bf0"/>
    </linearGradient>
    <linearGradient id="cyl" x1="372" y1="0" x2="652" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="0.1" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.26" stop-color="#ffffff" stop-opacity="0.02"/><stop offset="0.62" stop-color="#1a0040" stop-opacity="0.0"/>
      <stop offset="0.88" stop-color="#1a0040" stop-opacity="0.34"/><stop offset="1" stop-color="#1a0040" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="bounce" x1="0" y1="420" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#5eeaff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="222" x2="0" y2="616" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rimR" x1="0" y1="200" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9a4ff" stop-opacity="0.5"/><stop offset="1" stop-color="#7cf3ff" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="inner" cx="500" cy="390" r="190" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 390) scale(0.75 1.25) translate(-500 -390)">
      <stop offset="0" stop-color="#fff0fd" stop-opacity="0.62"/><stop offset="0.45" stop-color="#ff9cf0" stop-opacity="0.22"/><stop offset="1" stop-color="#ff5ce1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8aee"/><stop offset="0.45" stop-color="#ffffff"/><stop offset="1" stop-color="#ff6ae6"/>
    </linearGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.1" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#f0feff"/><stop offset="0.9" stop-color="#22d3ee" stop-opacity="0.85"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.14" stop-color="#e6fdff" stop-opacity="0.95"/><stop offset="0.4" stop-color="#22d3ee" stop-opacity="0.42"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflFade" x1="0" y1="800" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflMask"><rect x="0" y="800" width="1024" height="224" fill="url(#reflFade)"/></mask>
    <clipPath id="bodyClip"><rect x="372" y="200" width="280" height="440" rx="46"/></clipPath>
    <filter id="b90" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="b34" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="b16" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b10" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b5" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="b2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g id="art">
    <!-- aura -->
    <ellipse cx="512" cy="420" rx="260" ry="360" fill="#c81fd6" opacity="0.42" filter="url(#b90)"/>
    <!-- reflection of the candle below the line (glass floor) -->
    <g mask="url(#reflMask)" opacity="0.5">
      <g transform="translate(0 1600) scale(1 -1)">
        <rect x="372" y="200" width="280" height="440" rx="46" fill="url(#body)" filter="url(#b5)"/>
        <rect x="496" y="640" width="32" height="160" rx="16" fill="#ff7ae8" filter="url(#b5)"/>
      </g>
    </g>
    <!-- line haze -->
    <rect x="0" y="752" width="1024" height="76" fill="#22d3ee" opacity="0.22" filter="url(#b34)"/>
    <!-- wick glow -->
    <g filter="url(#b16)" opacity="0.95">
      <rect x="490" y="84" width="44" height="150" rx="22" fill="#ff3fdc"/>
      <rect x="490" y="610" width="44" height="300" rx="22" fill="#ff3fdc"/>
    </g>
    <!-- wicks -->
    <rect x="496" y="88" width="32" height="140" rx="16" fill="url(#wick)"/>
    <rect x="496" y="612" width="32" height="290" rx="16" fill="url(#wick)"/>
    <!-- body glow -->
    <rect x="372" y="200" width="280" height="440" rx="46" fill="#ff2bd6" opacity="0.7" filter="url(#b34)"/>
    <!-- body -->
    <rect x="372" y="200" width="280" height="440" rx="46" fill="url(#body)"/>
    <g clip-path="url(#bodyClip)">
      <rect x="372" y="200" width="280" height="440" fill="url(#cyl)"/>
      <rect x="372" y="200" width="280" height="440" fill="url(#inner)"/>
      <rect x="372" y="420" width="280" height="220" fill="url(#bounce)"/>
      <!-- right cyan rim + bottom bounce rim -->
      <rect x="628" y="200" width="40" height="440" rx="20" fill="url(#rimR)" opacity="0.55" filter="url(#b5)"/>
      <ellipse cx="512" cy="652" rx="150" ry="26" fill="#7cf3ff" opacity="0.65" filter="url(#b10)"/>
      <!-- top lip -->
      <ellipse cx="512" cy="196" rx="132" ry="16" fill="#ffd6fb" opacity="0.7" filter="url(#b5)"/>
    </g>
    <!-- specular streak -->
    <rect x="402" y="226" width="26" height="388" rx="13" fill="url(#streak)" filter="url(#b2)"/>
    <!-- glass edge -->
    <rect x="373.5" y="201.5" width="277" height="437" rx="44.5" fill="none" stroke="#ffd9f8" stroke-opacity="0.55" stroke-width="3"/>
    <!-- liquidity line -->
    <rect x="0" y="779" width="1024" height="22" fill="#22d3ee" opacity="0.85" filter="url(#b10)"/>
    <rect x="0" y="784" width="1024" height="12" rx="6" fill="url(#laser)"/>
    <!-- pierce flare -->
    <circle cx="512" cy="790" r="150" fill="url(#flare)"/>
    <ellipse cx="512" cy="790" rx="470" ry="7" fill="#ffffff" opacity="0.85" filter="url(#b5)"/>
    <ellipse cx="512" cy="790" rx="6" ry="84" fill="#ffffff" opacity="0.6" filter="url(#b5)"/>
    <circle cx="512" cy="790" r="21" fill="#ffffff"/>
    <!-- wick tip below the line -->
    <circle cx="512" cy="886" r="16" fill="#ffe1fa" opacity="0.9" filter="url(#b2)"/>
  </g>
</svg>
