<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Concept: Prism. A faceted amethyst crystal is the candle (its points are the wicks); its lower point pierces the
       cyan liquidity line and flares. Light from the top-left, cyan bounce from the line below. -->
  <defs>
    <radialGradient id="bg" cx="512" cy="430" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#330d6e"/><stop offset="0.45" stop-color="#140537"/><stop offset="1" stop-color="#04010c"/>
    </radialGradient>
    <linearGradient id="fL" x1="0" y1="300" x2="0" y2="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff8af0"/><stop offset="0.55" stop-color="#f02ad0"/><stop offset="1" stop-color="#a21caf"/></linearGradient>
    <linearGradient id="fC" x1="0" y1="300" x2="0" y2="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c13cf0"/><stop offset="0.6" stop-color="#7a22e0"/><stop offset="1" stop-color="#4c1aa8"/></linearGradient>
    <linearGradient id="fR" x1="0" y1="300" x2="0" y2="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5a1bb0"/><stop offset="0.7" stop-color="#2e0b72"/><stop offset="1" stop-color="#1d0a52"/></linearGradient>
    <linearGradient id="tL" x1="372" y1="300" x2="512" y2="110" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff9bf2"/><stop offset="1" stop-color="#fff1fd"/></linearGradient>
    <linearGradient id="tC" x1="0" y1="300" x2="0" y2="110" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e05cf7"/><stop offset="1" stop-color="#ffd6fb"/></linearGradient>
    <linearGradient id="tR" x1="652" y1="300" x2="540" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6b21c8"/><stop offset="1" stop-color="#b65cf5"/></linearGradient>
    <linearGradient id="bL" x1="0" y1="640" x2="0" y2="890" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b0189f"/><stop offset="1" stop-color="#5ad7f0"/></linearGradient>
    <linearGradient id="bC" x1="0" y1="640" x2="0" y2="890" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5a1fc0"/><stop offset="1" stop-color="#7ce8ff"/></linearGradient>
    <linearGradient id="bR" x1="0" y1="640" x2="0" y2="890" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#220a5c"/><stop offset="1" stop-color="#2fb8d8"/></linearGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.12" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#e8fdff"/><stop offset="0.88" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff"/><stop offset="0.18" stop-color="#d9fbff" stop-opacity="0.95"/><stop offset="0.45" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.75"/><stop offset="0.4" stop-color="#ff9cf3" stop-opacity="0.35"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
    <filter id="b80" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b12" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="470" rx="240" ry="360" fill="#c21fd8" opacity="0.4" filter="url(#b80)"/>
  <rect x="0" y="760" width="1024" height="90" fill="#22d3ee" opacity="0.2" filter="url(#b30)"/>
  <!-- crystal glow -->
  <path d="M512 110 L652 300 L652 640 L512 890 L372 640 L372 300 Z" fill="#ff2bd6" opacity="0.55" filter="url(#b30)"/>
  <!-- body facets: left / centre / right -->
  <path d="M372 300 L462 300 L462 640 L372 640 Z" fill="url(#fL)"/>
  <path d="M462 300 L590 300 L590 640 L462 640 Z" fill="url(#fC)"/>
  <path d="M590 300 L652 300 L652 640 L590 640 Z" fill="url(#fR)"/>
  <!-- top facets -->
  <path d="M372 300 L462 300 L512 110 Z" fill="url(#tL)"/>
  <path d="M462 300 L590 300 L512 110 Z" fill="url(#tC)"/>
  <path d="M590 300 L652 300 L512 110 Z" fill="url(#tR)"/>
  <!-- bottom facets -->
  <path d="M372 640 L462 640 L512 890 Z" fill="url(#bL)"/>
  <path d="M462 640 L590 640 L512 890 Z" fill="url(#bC)"/>
  <path d="M590 640 L652 640 L512 890 Z" fill="url(#bR)"/>
  <!-- inner light -->
  <ellipse cx="500" cy="440" rx="110" ry="210" fill="url(#core)"/>
  <!-- edges -->
  <g fill="none" stroke-linejoin="round" filter="url(#b3)">
    <path d="M372 300 L512 110 L652 300" stroke="#fff" stroke-opacity="0.9" stroke-width="5"/>
    <path d="M462 300 L512 110 M590 300 L512 110" stroke="#fff" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M372 300 L652 300 M372 640 L652 640" stroke="#ffd6fb" stroke-opacity="0.6" stroke-width="3"/>
    <path d="M462 300 L462 640" stroke="#fff" stroke-opacity="0.75" stroke-width="4"/>
    <path d="M590 300 L590 640" stroke="#e9c8ff" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M372 300 L372 640 L512 890 L652 640 L652 300" stroke="#ffc8f6" stroke-opacity="0.6" stroke-width="4"/>
    <path d="M462 640 L512 890 M590 640 L512 890" stroke="#bff6ff" stroke-opacity="0.5" stroke-width="3"/>
  </g>
  <!-- sparkle on the top point -->
  <ellipse cx="512" cy="112" rx="70" ry="3" fill="#fff" opacity="0.8" filter="url(#b3)"/>
  <ellipse cx="512" cy="112" rx="3" ry="50" fill="#fff" opacity="0.7" filter="url(#b3)"/>
  <circle cx="512" cy="112" r="9" fill="#fff"/>
  <!-- liquidity line + flare at the lower point -->
  <rect x="0" y="796" width="1024" height="20" fill="#22d3ee" opacity="0.8" filter="url(#b12)"/>
  <rect x="0" y="799" width="1024" height="14" rx="7" fill="url(#laser)"/>
  <circle cx="512" cy="806" r="130" fill="url(#flare)"/>
  <ellipse cx="512" cy="806" rx="420" ry="7" fill="#fff" opacity="0.9" filter="url(#b6)"/>
  <circle cx="512" cy="806" r="18" fill="#fff"/>
</svg>
