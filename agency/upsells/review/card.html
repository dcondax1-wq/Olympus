<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{name}}</title>
<!-- Printable review card (agency/upsells/make_review.py). Print at 100% / "Actual size", no headers and footers. -->
<style>
@page{size:{{page_w}} {{page_h}};margin:0}
:root{--f:{{fill}};--i:{{ink}};--a:{{accent}}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2430;background:#e9ebef}
.tools{max-width:820px;margin:0 auto;padding:16px;font-size:15px;line-height:1.45}
.tools h1{font-size:20px;margin-bottom:6px}
.tools p{margin-bottom:8px;color:#4b5563}
.tools button{min-height:46px;padding:10px 20px;border:0;border-radius:12px;background:var(--f);color:var(--i);font:inherit;font-weight:700;cursor:pointer}
.tools label{display:inline-flex;gap:8px;align-items:center;margin-left:14px}
.stage{padding:0 16px 40px;overflow:hidden}
.scaler{transform-origin:top left}
.page{width:{{page_w}};height:{{page_h}};background:#fff;position:relative;overflow:hidden;margin:0 auto 18px;box-shadow:0 6px 24px rgba(15,23,42,.18);page-break-after:always;break-after:page}
.page:last-child{page-break-after:auto;break-after:auto}
.qr svg{display:block;width:100%;height:100%}
/* A6 counter card */
.a6{display:flex;flex-direction:column;text-align:center}
.a6 .band{background:var(--f);color:var(--i);padding:6mm 6mm 5mm}
.a6 .av{width:12mm;height:12mm;margin:0 auto 2.5mm;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:700;font-size:12pt}
.a6 .nm{font-size:15pt;font-weight:800;line-height:1.15}
.a6 .ct{font-size:9pt;opacity:.9;margin-top:1mm}
.a6 .h{font-size:20pt;font-weight:800;margin:5mm 6mm 1.5mm;line-height:1.1}
.a6 .p{font-size:10pt;color:#4b5563;margin:0 8mm}
.a6 .qr{width:56mm;height:56mm;margin:3.5mm auto 2mm}
.a6 .scan{font-size:8.5pt;color:#4b5563}
.a6 .url{font-size:9.5pt;font-weight:700;color:var(--a);margin-top:1mm}
.a6 .foot{margin-top:auto;padding:0 6mm 6mm;font-size:8.5pt;color:#6b7280}
/* business card front + back */
.bc{width:3.5in;height:2in;display:flex;align-items:center;gap:3.5mm;padding:0 5mm 0 3.5mm;background:#fff;position:relative}
.bc .qr{width:40mm;height:40mm;flex:none}
.bc .h{font-size:12.5pt;font-weight:800;line-height:1.1}
.bc .p{font-size:7.5pt;color:#4b5563;margin:1.2mm 0 2.4mm;line-height:1.3}
.bc .nm{font-size:8.5pt;font-weight:800;color:var(--a);line-height:1.2}
.bc .url{font-size:7pt;color:#4b5563;margin-top:.6mm;word-break:break-all}
.bc.back{background:var(--f);color:var(--i);flex-direction:column;justify-content:center;align-items:flex-start;gap:0;padding:0 7mm}
.bc.back .nm{color:var(--i);font-size:14pt}
.bc.back .p{color:var(--i);opacity:.92;margin:1.5mm 0 3mm;font-size:8.5pt}
.bc.back .ln{font-size:8.5pt;font-weight:600}
/* Letter sheet, 10 business cards, Avery 8371 / 5371 / 5911 layout: 0.5in top, 0.75in sides, no gaps */
.sheet{padding:0.5in 0.75in;display:grid;grid-template-columns:3.5in 3.5in;grid-auto-rows:2in}
.sheet .bc{outline:0.4pt dashed #b9c0c9;outline-offset:-0.2pt}
.nocut .sheet .bc{outline:none}
@media print{
  body{background:#fff}
  .tools{display:none}
  .stage{padding:0}
  .scaler{transform:none!important;height:auto!important}
  .page{margin:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="tools">
  <h1>{{title}}</h1>
  <p>{{help}}</p>
  <p><button type="button" onclick="window.print()">Print</button>{{cut_toggle}}</p>
</div>
<div class="stage"><div class="scaler" id="scaler">
{{pages}}
</div></div>
<script>
(function () {
  var s = document.getElementById("scaler"), p = s.firstElementChild;
  function fit() {
    var w = p.offsetWidth, room = s.parentNode.clientWidth - 32, k = Math.min(1, room / w);
    s.style.transform = k < 1 ? "scale(" + k + ")" : "";
    s.style.height = k < 1 ? (s.scrollHeight * k) + "px" : "";
  }
  fit(); window.addEventListener("resize", fit);
  var cut = document.getElementById("cut");
  if (cut) cut.addEventListener("change", function () { document.body.classList.toggle("nocut", !cut.checked); });
})();
</script>
</body>
</html>
