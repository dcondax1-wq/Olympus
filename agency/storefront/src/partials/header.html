<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="{{root}}index.html"><span class="mark" aria-hidden="true">{{a.initials}}</span><span class="word">{{a.name}}</span></a>
    <nav class="nav" id="site-nav" aria-label="Main">{{{nav}}}<a class="nav-call" href="tel:{{a.tel}}">{{{icons.phone}}}Call {{a.phone}}</a></nav>
    <a class="btn btn-sm btn-primary top-call" href="tel:{{a.tel}}">{{{icons.phone}}}<span class="top-call-num">{{a.phone}}</span><span class="top-call-word">Call</span></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav" hidden>{{{icons.menu}}}<span>Menu</span></button>
  </div>
</header>
