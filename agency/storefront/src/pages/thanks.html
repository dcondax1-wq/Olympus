{{> head}}
<body>
{{> header}}
<main id="main">

      <h1 id="ph-h">Got it. Thank you!</h1>

        <a class="btn btn-primary btn-lg" href="tel:{{a.tel}}">{{{icons.phone}}}In a hurry? Call {{a.phone}}</a>
        <a class="btn btn-ghost btn-lg" href="work.html">See example websites</a>
      </div>
    </div>
  </section>
</main>
{{> footer}}
</body>
</html>
